ding Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n", "marketplaces": "## Purpose\n\nA recurring public programme bringing selected artisans and makers together with demonstrations, workshops and cultural activity.\n\n**Working ambition:** Every two months, for 3–4 days, subject to staffing, funding and participant demand. Confirm the Year 1 frequency separately.\n\n## Structure chart\n\n```kani-chart\n- Director of Creative Practice | Overall resources and accountability\n  - Programme owner | Director in Year 1; Creative Experiences Programme Manager at scale\n    - Marketplace Curator | Theme, participant selection and accompanying programme\n    - Delivery coordinator | Edition schedule, participant logistics and follow-up\n```\n\n**Chart key:** Solid connections show programme and project accountability. In Year 1 the Director also holds programme ownership; that box is a responsibility, not another hire. The permanent Programme & Operations Coordinator initially coordinates delivery. The curator owns selection; delivery coordination does not override that remit.\n\n> **Shared support — collaboration, not extra reporting lines:** Operations / Production and AV; outreach; Design & Communications; Fundraising & Partnerships; Commercial & Bookings; Accounts; Hospitality; Heart & Wellness. These teams retain their existing reporting lines.\n\n## Roles and responsibilities\n\n| Role | Responsibilities and decisions | Working arrangement |\n|---|---|---|\n| Director of Creative Practice | Agrees the series scope, resources and appointments; retains overall accountability. Holds programme ownership in Year 1. | Continuing role. |\n| Creative Experiences Programme Manager | At scale, owns the calendar, coordination and continuity of the marketplace platform; agrees handovers and tracks delivery. | Growth-stage role reporting to the Director; not an additional Year 1 hire. |\n| Programme owner | Holds the platform calendar, scope, budget coordination and delivery handovers. | Director in Year 1; Creative Experiences Programme Manager at scale. A responsibility rather than an additional Year 1 hire. |\n| Marketplace Curator | Selects participants, develops themes and shapes demonstrations, workshops and cultural activities. Works with local practitioners and relevant council advisors. | Series or edition appointment. Creative selection rests with this role within the agreed brief. |\n| Delivery coordinator | Coordinates schedules, participant requirements, logistics and follow-up, escalating resource issues to the programme owner. | Programme & Operations Coordinator in Year 1; allocated or project-funded coordination as the platform grows. |\n| Operations / Production and AV | Plans layout, stalls, equipment, installation and technical support, with named on-site responsibilities. | Allocated team capacity and technical specialists. |\n| Community engagement and outreach | Builds sustained artisan and maker relationships, supports applications and access, and gathers participant feedback. Makes opportunities understandable; does not replace curatorial selection. | Year 1 coordinator with Director support; dedicated outreach role when justified. |\n| Design & Communications | Handles promotion, audience invitations, participant stories and programme information with consent and accurate credits. | Shared communications capacity. |\n| Fundraising & Partnerships | Develops appropriate sponsors and institutional partnerships with the programme owner. | Retained or shared fundraising support. |\n| Commercial & Bookings | Administers stall bookings and fees after curatorial selection, using approved terms. | Named responsibility within Year 1 coordination; dedicated bookings role as justified. |\n| Accounts | Supports fee receipts, invoices, payments and financial records. | Existing Accounts Team. |\n| Hospitality | Supports guest arrangements, food and visitor services against the edition plan. | Existing Hospitality Team. |\n| Heart & Wellness | Supports welcome, team check-ins, recognition, listening and practical care across the programme. Flags workload pressures and supports follow-through with the relevant leads. | Shared named coordinator with allocated time, accountable to the Director. Every lead retains responsibility for respectful working and realistic workloads. |\n\n## Working arrangements\n\nProgramme ownership sits within Creative Experiences. The Director holds that responsibility initially; the Creative Experiences Programme Manager provides continuity at scale. The Marketplace Curator can be appointed across a series, with delivery supported by the permanent team and additional project appointments when needed.\n\nConfirm frequency, stall arrangements, selection criteria, staffing, outreach and budget before committing to a Year 1 series. Fees and booking administration follow selection; they do not determine curatorial acceptance.\n\nAfter each edition, review participant experience, access, attendance, costs and maker feedback. Record what changes for the next edition and who maintains the relationships between events.\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, including Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n", "new-initiatives": "Use a simple progression:\n\n1. Identify an enquiry, need or opportunity connected to the ethos and pillars.\n\n2. Define a small pilot with a named owner, audience, budget and outcome. Build outreach into its development: listen to intended participants, identify access needs and agree who maintains the relationships afterwards.\n\n3. Deliver and document the pilot.\n\n4. Review value, local relevance, participation, workload and financial viability.\n\n5. Repeat or revise where justified.\n\n6. Establish a continuing platform only when there is a clear reason and capacity to sustain it.\n", "learnings-feedback": "## A place to listen and learn\n\n**Status: Feedback collection is ongoing.** This section holds programme experience, questions and suggestions separately from the manifesto. The structure below is provisional and can develop as feedback comes in.\n\n## Kani Fest · Edition 1\n\nThe first edition ran for 15 days, with parallel workshops, talks and musical performances. Around 20 volunteers supported different tasks.\n\nThe notes below come from the organiser’s account shared during development of this document. They are initial observations, not a completed evaluation or a consensus from participants. Further feedback may add to or change them.\n\n| Area | Initial observation | Questions to explore |\n|---|---|---|\n| Programming | Programming and parallel workshops and talks worked well. | What felt valuable to participants and contributors? Where did sessions overlap productively or compete? |\n| Making and craft | Hands-on and craft workshops attracted strong interest. | Which formats, timings and facilitation worked best? What support or materials were missing? |\n| Sound and music | Local musicians drew the largest crowds. | What made these gatherings accessible and engaging? How did artists experience them? |\n| Timing | Around seven mornings were quiet across the 15-day edition. | Was this connected to timing, communication, audience availability or programme format? |\n| Infrastructure | Shared equipment moved between spaces, and infrastructure was understaffed. | Where did clashes or delays occur? What crew, equipment and changeover time would have helped? |\n| Production | There was no Festival Producer, and production capacity was weak. | Which responsibilities lacked an owner or adequate time? What needs dedicated coordination? |\n| Volunteers | Volunteers supported varied tasks; some are interested in greater responsibility across the year. | What felt supported or difficult? Who wants to stay involved, and in what capacity? |\n\n### Perspectives still to gather\n\nInvite feedback from participants, local communities, artists, workshop facilitators, volunteers, curators, production and technical crew, hospitality, partners and the organising team. Ask what worked, what was difficult and what they would change.\n\n## A simple feedback structure\n\nUse one record for each distinct observation or suggestion. Keep the original feedback separate from our interpretation and any decision.\n\n| Field | What to record |\n|---|---|\n| Programme / edition / date | Where and when the experience took place. |\n| Perspective and source | Participant, contributor, volunteer, team or partner; how the feedback was collected. |\n| Observation or feedback | What the person experienced, in their own words where appropriate. |\n| Theme | Programme, access, communication, timing, infrastructure, volunteer experience, hospitality, Heart & Wellness or another relevant theme. |\n| Question or suggestion | What needs understanding, testing or changing. |\n| Status | Collected, exploring, agreed for action or deferred. |\n| Response and follow-up | What was decided, why, who will follow up and when it will be reviewed. |\n\n### Working statuses\n\n| Status | Meaning |\n|---|---|\n| Collected | Recorded; not yet reviewed with the relevant people. |\n| Exploring | More perspectives, detail or a small test are needed. |\n| Agreed for action | A response has been agreed, with an owner and review point. |\n| Deferred | Kept for later, with the reason recorded. |\n\n## Feedback record\n\nThe initial Edition 1 notes above are the starting record. Further participant and team feedback is still being collected; no individual submissions or agreed actions have been entered here yet.\n\nUse **Edit this chapter** to add reviewed notes. This page is a shared record, not a submission form. The collection method and final feedback format remain open for discussion. Keep personal concerns and identifiable sensitive feedback out of the public record; publish agreed or anonymised summaries where appropriate.\n\nAgreed changes to the manifesto should also be recorded in [Version history](#version-history), with the relevant pages updated together. Unresolved structural questions belong in [Open decisions](#open-decisions).\n\n\n## Heart programmes · learning to gather\n\nFor Nurupa and similar initiatives, invite participants to reflect on belonging, choice, mentor support, accessibility, creative practice and what they wish to carry forward. Use voluntary check-ins and end-of-programme reflections; do not rank personal growth or assume transformation. Record only consented or anonymised summaries here. No Nurupa participant feedback has been collected in this document yet.\n", "open-decisions": "This edition incorporates the agreed drafting changes. The following questions still need collective agreement before they become operating commitments.\n\n- [ ] Review the ethos wording, three pillar titles and activity menus with the group.\n- [ ] Develop the [Option 2 council structure](#council-option-2), including authority, representative selection, decision procedures and participation support.\n- [ ] For Option 1, review the seven advisory areas and identify one or two members per area, with one-year appointments and annual review.\n- [ ] For Option 1, agree the council voting procedure: the proposal is one vote per advisory area, a quorum of five areas and four affirmative area votes. Resolve vacancies, disagreements within an area, conflicts and recusals before adoption.\n- [ ] Confirm “Platforms & Original Initiatives” as the layer title and confirm working platform names, including the publishing imprint.\n- [ ] Choose a realistic Year 1 calendar, including festival scope, marketplace frequency and publication commitments and editorial focus.\n- [ ] Confirm outreach priorities, initial community and institutional relationships, allocated staff time and participation-support budgets.\n- [ ] Confirm Year 1 retainer and project-support budgets alongside the three permanent hires; agree platform staffing against actual programmes.\n- [ ] Agree Kani Fest duration and timetable; confirm the Producer, technical lead, shared-resource plan and delivery budget.\n- [ ] Agree curatorial fellowship fees, time commitments, mentoring, selection process and programme support before recruitment.\n- [ ] Confirm volunteer support, team-captain scopes and any funded year-round associate opportunities.\n- [ ] Name the Heart & Wellness coordinator, allocate time and agree support and alternative routes for concerns.\n- [ ] Develop Nurupa within Heart: confirm the Qalb Center / Slow Thing Festival relationship, programme lead, mentor preparation, calendar, cohort format, budget, pricing and local access, privacy and recording consent, online participation and participant-support protocols before launch.\n- [ ] Confirm entity responsibilities and delegated financial authority.\n- [ ] Confirm how publishing sales and distribution will be administered initially.\n\nCollect programme and presentation feedback in [Learnings & Feedback](#learnings-feedback). A suggestion is not an agreed operating decision.\n\n", "version-history": "## Current edition\n\n**v0.7 · Revised draft — For discussion**  \n**Published:** 11 November 2026\n\nHeart now has two connected expressions: the shared culture of care beneath all three pillars, and programmes that support growth, wellbeing and becoming. Nurupa is introduced as an initiative in development, drawing on its working white paper. Related learning, creative experience, platform, staffing and feedback sections are aligned. Programme details and launch commitments remain open.\n\nThe homepage wording was refined within v0.7 to describe Heart as both our way of being together and a space for growth. The preserved v0.7 snapshot retains the initial wording.\n\n## Editions and changes\n\n| Edition | What changed | Why |\n|---|---|---|\n| v0.7 · Revised draft · 11 November 2026 | Expanded Heart into a programme space; introduced Nurupa and linked relevant chapters. | Make personal growth and becoming part of the lived foundation, alongside everyday care. |\n| v0.6 · Revised draft · 4 November 2026 | Added a participatory council option and side-by-side comparison; retained Option 1 and its reference decision rights; identified decisions required before adoption. | Explore a more inclusive model without prematurely replacing the earlier proposal. |\n| v0.5 · Revised draft · 2 November 2026 | Three high-level dotted connections without numbered relationship controls; programming and volunteer flows with clickable detail instead of repeated visible tables. | Make the map and pathways easier to read while retaining the detailed responsibilities. |\n| v0.4 · Revised draft · 2 November 2026 | Draggable festival map with shared resources and numbered dotted collaboration links; separate programming and volunteer flows; Heart & Wellness above shared resources with content to be developed; Learnings & Feedback immediately before Review & Editing. | Make working relationships easier to explore and keep developing content easy to find. |\n| v0.3 · Revised draft · 2 November 2026 | Unified expandable festival map with shared resources; year-round Heart & Wellness activities; detailed roles retained; new Learnings & Feedback chapter with collection marked ongoing. Internal analogy and retrospective material removed from manifesto chapters. | Present the proposed organisation clearly while giving experience and evolving feedback their own place. |\n| v0.2 · Revised draft · 2 November 2026 | Clickable Kani Fest working map and role explainers; paid curatorial fellowship model; named delivery and infrastructure responsibilities; programming workflow; supported volunteer pathway; shared Heart & Wellness responsibility; aligned staffing, outreach and decision pages. | Build on first-edition experience and make responsibility, shared-resource planning and routes for participation clear. |\n| v0.1 · Alpha · 2 November 2026 | “An evolving manifesto”; clearer transdisciplinary approach; outreach section and responsibilities across the structure; one-year council appointments with one or two members per area; Sound & Music title; charts and responsibilities for all three platforms; simpler status and review notes. | Prepare a coherent presentation edition and make relationships, responsibilities and the evolution of thinking easier to follow. |\n| Initial website · 1 November 2026 | The first online working document, before numbered editions. | Establish an editable, shared source. |\n\n[Read the preserved v0.7 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.7.html).\n\n[Read the preserved v0.6 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.6.html).\n\n[Read the preserved v0.5 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.5.html).\n\n[Read the preserved v0.4 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.4.html).\n\n[Read the preserved v0.3 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.3.html).\n\n[Read the preserved v0.2 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.2.html).\n\n[Read the preserved v0.1 Alpha edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.1.html).\n\n[Read the initial website snapshot](https://bhaumikdebanshu.github.io/KaniManifesto/edition-initial.html). Its content is also preserved in the [original repository commit](https://github.com/bhaumikdebanshu/KaniManifesto/tree/14fac9b564864435f37587fa36fc6e175b9512d5).\n\nSnapshots stay as they were published. The main website carries the latest edition.\n\n## Simple versioning\n\n| Version | When to use it |\n|---|---|\n| v0.1 · Alpha | This first presentation edition. |\n| v0.2 · Revised draft | Earlier revision of the Kani Fest model. |\n| v0.3 · Revised draft | Earlier revision: unified map and separate learning and feedback. |\n| v0.4 · Revised draft | Earlier revision: draggable collaboration map and revised navigation. |\n| v0.5 · Revised draft | Earlier revision: simpler collaboration links and less repetition. |\n| v0.6 · Revised draft | Earlier revision: participatory council option and Heart foundation. |\n| v0.7 · Revised draft | Current revision: Heart programmes and Nurupa in development. |\n| v1.0 · Agreed baseline | When the group agrees a structure to begin working with. It can still evolve. |\n\nDo not change the version for every typo. Increment it when the thinking, responsibilities or structure meaningfully changes. Record what changed, why and what remains unresolved; preserve the previous edition before publishing the next.\n\n## Learning and feedback\n\nProgramme observations and feedback now have a dedicated [Learnings & Feedback](#learnings-feedback) chapter. Collection is ongoing, and its structure remains provisional. Version history records changes made to the manifesto; feedback can remain under discussion without becoming an agreed change.\n\nKeep unresolved operating questions in [Open Decisions](#open-decisions). Check related chapters before publishing an agreed revision; see the [Document review checklist](#document-plan).\n\n\n", "document-plan": "## Review one complete edition\n\nReview the manifesto, programme framework, advisory arrangements, team and platforms together. This prevents a change to one role from leaving contradictory responsibilities elsewhere.\n\n## Consistency checklist\n\n| When this changes | Also review |\n|---|---|\n| Ethos or pillars | Home, Programme Framework, pillar chapters, platform descriptions and open decisions. |\n| Advisory areas, appointments or voting | Council, Decision rights, overview text and open decisions. |\n| Outreach responsibilities | Outreach section, Year 1, Full Structure, Growth, shared capabilities and all platform role tables. |\n| Heart & Wellness | Home, Year 1, Full Structure, Growth, shared capabilities, outreach, platform support tables and Decision rights. |\n| Platform staffing or reporting | Platform chart, its responsibilities table, Year 1 support, Full Structure and Decision rights. |\n| Programme observations or feedback | Learnings & Feedback, unresolved decisions, and any agreed changes to the relevant manifesto chapters. |\n| A substantive agreed revision | Version label, version history, previous-edition snapshot, navigation, Markdown export and print view. |\n\nCharts distinguish reporting and project responsibility from shared support. Platform leads and advisors are not additional permanent hires in Year 1.\n\n## Review and publish\n\nCollect proposed edits, review them as a batch, then publish one coherent edition. Keep feedback in [Learnings & Feedback](#learnings-feedback), distinguishing collected observations from agreed actions. Preserve the presentation edition before incorporating feedback so readers can follow how the thinking changed.\n\nSee [Version history](#version-history) for the current edition and revision approach.\n", "editing": "## Edit a chapter\n\n1. Open the chapter you want to change.\n2. Click **Edit this chapter** in the top bar. It opens the corresponding Markdown file on GitHub.\n3. Sign in to GitHub and make your changes. Headings use `##`; tables use rows separated by vertical bars.\n4. Use GitHub’s Preview tab to check the text and table formatting.\n5. Select **Commit changes**, add a short description, and save to the publishing branch if you have permission.\n6. Wait for the Pages deployment to complete, then refresh this website.\n\nThe editor link appears once the site is hosted on GitHub Pages, or when the repository is set in `site.json`.\n\n## Let someone else contribute\n\nShare the website link for reading. Give selected collaborators repository write access if they should edit directly. Others can propose changes through GitHub pull requests. This is repository editing, not simultaneous Google Docs-style editing.\n\n## Tables and checklists\n\nThe site displays tables and checklists from the Markdown files. Make changes in the source file through **Edit this chapter**. Checkboxes on the reading page are intentionally read-only; use `- [x]` in the source to mark a decision complete.\n\n## Download or print\n\n**Download Markdown** combines the current chapters into a single editable document. **Print all** prepares every chapter for printing or saving to PDF.\n\n## One working source\n\nAfter publishing, the Markdown files in this GitHub repository are the website’s working source. The earlier ChatGPT Page and Obsidian folder do not automatically synchronise with it.\n\n## Visibility\n\nThe free public-repository setup makes the site and its source public. The site requests that search engines do not index it, but this is not access control. Anyone with the address can read it.\n\n## Versions and charts\n\nUse [Version history](#version-history) for substantive changes. The main website is the current working edition; the linked snapshots preserve earlier editions and should not be edited. Use **Print all** on a snapshot to save that edition as a PDF.\n\nPlatform charts are written as indented bullet lists inside a `kani-chart` code block in each platform’s Markdown file. Indentation defines the project hierarchy. Kani Fest uses one `kani-map` block with three labelled sections: `[Festival team]`, `[Shared resources]` and `[Collaborations]`. Indented bullets define the team hierarchy; flat bullets define shared resources. Collaboration entries use `- Role A <> Role B | Relationship label`, matching box names exactly. The programming and volunteer flows use separate `kani-flow` blocks below the map. Each box title matches the first cell of its explanation table exactly; the next cells supply the explainer text. The programming and volunteer explanations are in `kani-details` blocks directly beneath their flows. These tables supply the clickable explainers and print output without repeating on the reading page. Edit those table cells to change an explainer. Keep map collaboration links at the level of the two festival leads and shared resources. Update the chart and table together when a role or relationship changes. Shared support stays separate from reporting lines.\n\nBefore publishing a substantive new edition, update the version and date in `site.json`, the history page and the preserved snapshot together. Follow the [Document review checklist](#document-plan).\n\nProgramme observations and feedback belong in [Learnings & Feedback](#learnings-feedback). Its collection format is provisional; use reviewed summaries when updating this public record.\n"}};

    const tables=[...template.content.querySelectorAll('table'),...detailBlocks.flatMap(({wrapper})=>[...wrapper.querySelectorAll('table')])];
    for(const table of tables){
      const headings=[...table.querySelectorAll('thead th')].map(c=>c.textContent.trim());
      for(const row of table.querySelectorAll('tbody tr')){const cells=[...row.querySelectorAll('td')];if(cells.length>1)explanations.set(cells[0].textContent.trim(),cells.slice(1).map((c,i)=>({label:headings[i+1]||'Details',text:c.textContent.trim()})));}
    }
    const charts=[...template.content.querySelectorAll('pre > code')].filter(c=>/^language-kani-(chart|support|flow|map)$/.test(c.className)).map(code=>({pre:code.parentElement,chart:code.className==='language-kani-map'?unifiedMapFromText(code.textContent,explanations):chartFromText(code.textContent,explanations,code.className.replace('language-kani-',''))}));
    const clean = node => {
      for (const el of [...node.children]) {
        if (!allowed.has(el.tagName)) { el.remove(); continue; }
        const href = el.getAttribute('href'), checked = el.hasAttribute('checked');
        const align = el.getAttribute('align');
        for (const a of [...el.attributes]) el.removeAttribute(a.name);
        if (el.tagName === 'A' && href && (/^https?:\/\//i.test(href) || /^#[a-z0-9-]+$/i.test(href))) {
          el.setAttribute('href', href);
          if (/^https?:/i.test(href)) {el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer');}
        }
        if (el.tagName === 'INPUT') {el.type='checkbox';el.disabled=true;el.checked=checked;}
        if (['TH','TD'].includes(el.tagName) && ['left','right','center'].includes(align)) el.style.textAlign=align;
        clean(el);
      }
    };
    clean(template.content);
    for(const {pre,wrapper} of detailBlocks){clean(wrapper);wrapper.className='flow-details-print';pre.replaceWith(wrapper);}
    for(const {pre,chart} of charts)if(chart)pre.replaceWith(chart);
    for(const table of template.content.querySelectorAll('table')) {
      const wrap=document.createElement('div');wrap.className='table-scroll';wrap.tabIndex=0;
      wrap.setAttribute('role','region');wrap.setAttribute('aria-label','Scrollable table');
      table.replaceWith(wrap);wrap.append(table);
    }
    return template.content;
  }
  async function readJSON(path) {
    const res=await fetch(path,{cache:'no-store'});if(!res.ok)throw Error(`Could not load ${path} (${res.status}).`);return res.json();
  }
  async function markdown(chapter) {
    if(cache.has(chapter.id))return cache.get(chapter.id);
    let text;
    if(offline) text=window.KANI_BOOTSTRAP.content[chapter.id];
    else {const r=await fetch(chapter.file,{cache:'no-store'});if(!r.ok)throw Error(`The chapter could not be loaded (${r.status}). Please refresh or check its Markdown file.`);text=await r.text();}
    cache.set(chapter.id,text);return text;
  }
  function repository() {
    if(settings.repository)return settings.repository;
    if(location.hostname.endsWith('.github.io')) {
      const owner=location.hostname.split('.')[0];
      const segment=location.pathname.split('/').filter(Boolean)[0];
      const repo=segment && !segment.endsWith('.html') ? segment : owner+'.github.io';
      return owner+'/'+repo;
    }
    return '';
  }
  function editURL(chapter) {
    const repo=repository();
    if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo))return null;
    return 'https://github.com/'+repo+'/edit/'+encodeURIComponent(settings.branch||'main')+'/'+chapter.file.split('/').map(encodeURIComponent).join('/');
  }
  function navLink(chapter) {
    const a=document.createElement('a');a.href='#'+chapter.id;a.textContent=chapter.title;a.dataset.chapter=chapter.id;return a;
  }
  function makeNavigation() {
    $('toc').replaceChildren();
    for(const c of chapters) {
      if(c.id==='home'){$('toc').append(navLink(c));continue;}
      let group=[...$('toc').querySelectorAll('details')].find(d=>d.dataset.group===c.group);
      if(!group){group=document.createElement('details');group.dataset.group=c.group;const summary=document.createElement('summary');summary.textContent=c.group;const list=document.createElement('div');list.className='subnav';group.append(summary,list);$('toc').append(group);}
      group.querySelector('.subnav').append(navLink(c));
    }
  }
  function closeMenu() {document.body.classList.remove('menu-open');$('menu').setAttribute('aria-expanded','false');$('shade').hidden=true;}
  function markActive() {
    for(const a of document.querySelectorAll('[data-chapter]')){
      if(a.dataset.chapter===current.id){a.setAttribute('aria-current','page');const group=a.closest('details');if(group)group.open=true;}
      else a.removeAttribute('aria-current');
    }
  }
  function homeCards() {
    $('home-cards').replaceChildren();
    for(const id of ['research','creative-experiences','commercial']){
      const c=chapters.find(x=>x.id===id);const a=document.createElement('a');a.href='#'+id;a.className='pillar-card';
      const num=document.createElement('small');num.textContent='PILLAR '+($('home-cards').children.length+1);
      const h=document.createElement('h2');h.textContent=c.title;
      const p=document.createElement('p');p.textContent=c.description;
      const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='Explore the pillar →';a.append(num,h,p,arrow);$('home-cards').append(a);
    }
    if(settings.foundation){
      const base=document.createElement('section');base.className='heart-foundation';base.setAttribute('aria-label','Shared foundation for all three pillars');
      const heading=document.createElement('h2');heading.textContent=settings.foundation.title;
      const description=document.createElement('p');description.textContent=settings.foundation.description;
      base.append(heading,description);$('home-cards').append(base);
    }
  }
  async function route() {
    if(roleDialog?.open)roleDialog.close();
    if(mapDialog?.open)mapDialog.close();
    const version=++routeVersion;
    let id;try{id=decodeURIComponent(location.hash.slice(1))||'home';}catch{id='home';}
    const found=chapters.find(c=>c.id===id);current=found||chapters[0];
    const c=current;
    document.title=c.id==='home'?'Kani Manifesto':c.title+' · Kani Manifesto';$('title').textContent=c.title;
    $('breadcrumb').textContent=c.id==='home'?'Programme & organisation':c.group;
    $('kicker').textContent=c.id==='home'?(settings.kicker||'An evolving manifesto'):c.group;
    $('lead').textContent=c.description||'';$('home-cards').hidden=c.id!=='home';
    $('notice').hidden=true;
    if(!found&&id!=='home'){$('notice').textContent='That chapter was not found. Showing Home.';$('notice').hidden=false;}
    const url=editURL(c);$('edit').hidden=snapshot||!url;if(url)$('edit').href=url;
    if(snapshot){$('notice').textContent='Preserved edition — this snapshot stays unchanged. The main website carries the latest version.';$('notice').hidden=false;}
    markActive();closeMenu();$('article').textContent='Loading chapter…';$('pager').replaceChildren();
    try{const md=await markdown(c);if(version!==routeVersion)return;$('article').replaceChildren(renderMarkdown(md));
      const first=$('article').firstElementChild;if(first?.tagName==='P'&&first.textContent.trim()===c.description?.trim())first.remove();}
    catch(e){if(version!==routeVersion)return;$('article').textContent=e.message;return;}
    const index=chapters.findIndex(x=>x.id===c.id);
    for(const [n,label] of [[index-1,'Previous chapter'],[index+1,'Next chapter']]){
      if(!chapters[n])continue;const a=document.createElement('a');a.href='#'+chapters[n].id;
      const small=document.createElement('small');small.textContent=label;a.append(small,document.createTextNode(chapters[n].title));$('pager').append(a);
    }
    window.scrollTo({top:0,behavior:'instant'});$('main').focus({preventScroll:true});
  }
  async function search() {
    const version=++searchVersion;const q=$('search').value.trim().toLowerCase();
    $('results').hidden=!q;$('toc').hidden=!!q;$('results').replaceChildren();
    if(!q){$('search-status').textContent='';return;}
    $('search-status').textContent='Searching chapters…';
    const loaded=await Promise.allSettled(chapters.map(async c=>({c,text:await markdown(c)})));
    if(version!==searchVersion)return;
    let count=0,failed=0;
    for(const r of loaded){if(r.status!=='fulfilled'){failed++;continue;}const {c,text}=r.value;
      if(!(c.title+' '+c.group+' '+text).toLowerCase().includes(q))continue;
      count++;const a=navLink(c);const small=document.createElement('small');small.textContent=c.group||'Overview';a.append(small);$('results').append(a);
    }
    $('search-status').textContent=`${count} matching chapter${count===1?'':'s'}`+(failed?` · ${failed} could not load`:'');markActive();
  }
  async function allMarkdown() {return Promise.all(chapters.map(async c=>({c,md:await markdown(c)})));}
  $('export').onclick=async()=>{
    $('export').disabled=true;
    try{const all=await allMarkdown();const text='# Kani Manifesto — '+(settings.version||'Working draft')+' · '+(settings.stage||'')+'\n\nUpdated '+(settings.updated||'')+'\n\n'+all.map(({c,md})=>'# '+c.title+'\n\n'+md).join('\n\n---\n\n');
      const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Kani-Manifesto-'+(settings.version||'Working-Draft')+'.md';a.hidden=true;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
    }catch(e){$('notice').textContent='Export failed: '+e.message;$('notice').hidden=false;}finally{$('export').disabled=false;}
  };
  function clearPrint(){document.body.classList.remove('print-all');document.getElementById('print-document')?.remove();}
  $('print').onclick=async()=>{
    $('print').disabled=true;
    try{const all=await allMarkdown();clearPrint();const doc=document.createElement('div');doc.id='print-document';
      for(const {c,md} of all){const section=document.createElement('section');section.className='print-chapter prose';const h=document.createElement('h1');h.textContent=c.title;const label=document.createElement('p');label.textContent=(settings.version||'Working draft')+' · '+(settings.stage||'')+' · '+(settings.updated||'');section.append(label,h,renderMarkdown(md));doc.append(section);}
      document.body.append(doc);document.body.classList.add('print-all');requestAnimationFrame(()=>window.print());
    }catch(e){$('notice').textContent='Print preparation failed: '+e.message;$('notice').hidden=false;}finally{$('print').disabled=false;}
  };
  window.addEventListener('afterprint',clearPrint);
  $('menu').onclick=()=>{const open=!document.body.classList.contains('menu-open');document.body.classList.toggle('menu-open',open);$('menu').setAttribute('aria-expanded',String(open));$('shade').hidden=!open;};
  $('shade').onclick=closeMenu;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
  $('search').addEventListener('input',search);
  document.querySelector('.skip').onclick=e=>{e.preventDefault();$('main').focus();};
  window.addEventListener('hashchange',()=>{if(chapters.length)route();});
  async function start(){
    try{if(offline){chapters=window.KANI_BOOTSTRAP.chapters;settings=window.KANI_BOOTSTRAP.settings;}
      else{[chapters,settings]=await Promise.all([readJSON('chapters.json'),readJSON('site.json')]);}
      $('version-label').textContent=(settings.version||'Draft')+' · '+(settings.stage||'Discussion');
      $('edition-meta').textContent=(settings.version||'Draft')+' · '+(settings.stage||'Discussion')+' — For discussion · Updated '+(settings.updated||'');
      makeNavigation();homeCards();await route();
      if(offline&&!snapshot){$('notice').textContent='Local preview snapshot. Online edits are made through GitHub after publishing.';$('notice').hidden=false;}
    }catch(e){$('article').textContent='The document could not load. '+e.message;}
  }
  start();
})();
</script></body>
