</script><script>window.KANI_BOOTSTRAP = {"chapters": [{"id": "home", "title": "Kani Manifesto", "group": "Home", "file": "home.md", "description": "The ethos, people and practices of Kani Home."}, {"id": "framework", "title": "Programme framework", "group": "Programme Framework", "file": "framework.md", "description": "How the ethos, pillars, people and platforms fit together."}, {"id": "research", "title": "Research, Residencies & Learning", "group": "Programme Framework", "file": "research.md", "description": "Develop knowledge, creative practices, skills and new ways of working."}, {"id": "creative-experiences", "title": "Creative Experiences", "group": "Programme Framework", "file": "creative-experiences.md", "description": "Bring people together through encounters with art, culture, ideas and making."}, {"id": "commercial", "title": "Commercial Experiences & Space Hire", "group": "Programme Framework", "file": "commercial.md", "description": "Earn income through commissioned experiences, spaces and creative hospitality."}, {"id": "outreach", "title": "Outreach & Community Engagement", "group": "Programme Framework", "file": "outreach.md", "description": "Relationships, participation and continuity across the three pillars."}, {"id": "entities", "title": "Enabling entities", "group": "Governance", "file": "entities.md", "description": "The organisations that enable the work."}, {"id": "council", "title": "Council · Option 1", "group": "Governance", "file": "council.md", "description": "Seven advisory areas. One-year appointments, reviewed annually."}, {"id": "council-option-2", "title": "Council · Option 2", "group": "Governance", "file": "council-option-2.md", "description": "A participatory council with advisors, curators, community and youth representatives."}, {"id": "decisions", "title": "Decision rights", "group": "Governance", "file": "decisions.md", "description": "Clear ownership for direction, creative decisions and delivery."}, {"id": "year-one", "title": "Year 1 · Minimum team", "group": "Working Team", "file": "year-one.md", "description": "Three permanent hires, existing teams and defined specialist support."}, {"id": "full-structure", "title": "Full structure", "group": "Working Team", "file": "full-structure.md", "description": "Dedicated capacity as programmes and recurring work grow."}, {"id": "growth", "title": "How the team grows", "group": "Working Team", "file": "growth.md", "description": "Add people in response to sustained work and funding."}, {"id": "heart-wellness", "title": "Heart & Wellness", "group": "Heart & Wellness", "file": "heart-wellness.md", "description": "Our shared foundation, with programmes for wellbeing, growth and becoming."}, {"id": "infrastructure", "title": "Shared infrastructure & capabilities", "group": "Shared Infrastructure", "file": "infrastructure.md", "description": "Spaces, equipment and services supporting all programmes."}, {"id": "platforms", "title": "Platforms & Original Initiatives", "group": "Platforms & Original Initiatives", "file": "platforms.md", "description": "Recognisable programmes with their own identity, brief and creative lead."}, {"id": "kani-fest", "title": "Kani Fest", "group": "Platforms & Original Initiatives", "file": "kani-fest.md", "description": "A fresh curatorial proposition for each festival edition."}, {"id": "publications", "title": "Kani Publications", "group": "Platforms & Original Initiatives", "file": "publications.md", "description": "A year-round publishing programme across the three pillars."}, {"id": "marketplaces", "title": "Curated Marketplaces", "group": "Platforms & Original Initiatives", "file": "marketplaces.md", "description": "Artisans, makers, demonstrations and public exchange."}, {"id": "new-initiatives", "title": "Developing new initiatives", "group": "Platforms & Original Initiatives", "file": "new-initiatives.md", "description": "Pilot, learn and establish what deserves to continue."}, {"id": "learnings-feedback", "title": "Learnings & Feedback", "group": "Learnings & Feedback", "file": "learnings-feedback.md", "description": "Programme learning and an evolving record of feedback. Collection is ongoing."}, {"id": "open-decisions", "title": "Open decisions", "group": "Review & Editing", "file": "open-decisions.md", "description": ""}, {"id": "version-history", "title": "Version history", "group": "Review & Editing", "file": "version-history.md", "description": "A record of how the thinking develops."}, {"id": "document-plan", "title": "Document review checklist", "group": "Review & Editing", "file": "document-plan.md", "description": ""}, {"id": "editing", "title": "How to edit and share", "group": "Review & Editing", "file": "editing.md", "description": ""}], "settings": {"title": "Kani Manifesto", "repository": "bhaumikdebanshu/KaniManifesto", "branch": "main", "version": "v0.7", "stage": "Revised draft", "updated": "11 November 2026", "kicker": "An evolving manifesto", "foundation": {"title": "Heart — our shared foundation", "description": "Everything begins with heart and grace. We create space for people to discover their potential, nurture their practice and grow together."}}, "content": {"home": "## Our ethos\n\n**Proposed wording for review:**\n\nKani Home is a place for creative practice, research, learning and public exchange. It brings artists, designers, architects, researchers, craftspeople, musicians, ecologists, climate practitioners, heritage specialists, technologists and communities into conversation, creating space for both sustained enquiry and shared experiences.\n\nIts work is guided by:\n\n- **Heart & grace:** Bring care, openness and respect to everything we do. Support people in exploring who they are and who they wish to become, through reflection, creative practice and community.\n\n- **Community participation:** Develop programmes with local people, practitioners and knowledge holders.\n\n- **Experimentation:** Support exploration, making, testing and work whose outcomes are not predetermined.\n\n- **Ecological responsibility:** Engage with climate, water, materials and the relationships between people and their environments.\n\n- **Exchange across disciplines:** Connect art, design, craft, music, research and technology.\n\n- **Continuity of knowledge:** Document, publish and share work so that learning continues beyond an event or residency.\n\n- **Sustainable operation:** Develop earned income and external support that sustain the place, its people and its programme.\n\n## How we work together\n\nKani brings different disciplines and forms of knowledge into shared enquiry. An artisan, technologist, researcher and local community might shape a project together, each influencing its questions, methods and outcomes. The three pillars give this work a structure while allowing projects to move between learning, public exchange and commissioned experiences.\n\n[Outreach & Community Engagement](#outreach) builds the continuing relationships that make this participation possible, from listening and co-developing ideas to supporting access and following up after a programme.\n\n[Heart](#heart-wellness) is both our way of being together and a space for growth. Through programmes such as Nurupa, we bring reflection, play, creative practice and mentorship together, helping people explore their potential and how they contribute to the world around them.\n\n## Structure Synopsis\n\nThree pillars guide the work. A council with annually reviewed appointments contributes expertise. A continuing team turns ideas into programmes, supported by shared spaces and resources.\n\n- [Explore Council Option 2](#council-option-2)\n- [Meet the Option 1 advisory roles](#council)\n- [Explore the Year 1 team](#year-one)\n- [See the programme platforms](#platforms)\n\n## Working status\n\n**Status:** An evolving proposal for discussion and collective development.\n\nThis manifesto sets out a proposed direction; the [Open Decisions](#open-decisions) section identifies what still needs collective agreement.\n\nSee [Version history](#version-history) for previous editions and the reasons behind changes.\n\n\n", "framework": "## How the organisation fits together\n\n| Layer | What it explains |\n|---|---|\n| Ethos | The values that guide Kani’s choices. |\n| Heart & Wellness | The shared foundation of care and grace, expressed through everyday culture and programmes for growth, wellbeing and becoming, including Nurupa in development. |\n| Three pillars | The broad kinds of activity Kani undertakes. |\n| Outreach & Community Engagement | How Kani builds relationships, listens, enables participation and sustains connections across its programmes. |\n| Advisory & Programme Council | The expertise, relationships and strategic guidance supporting the work. |\n| Permanent working team | The people responsible for continuity, development and delivery. |\n| Shared infrastructure & capabilities | The spaces, equipment and services available to every programme. |\n| Platforms & Original Initiatives | The recognisable programmes Kani develops, including Kani Fest, Kani Publications and curated marketplaces. |\n\nHeart underpins every pillar; its programmes connect learning, creative practice and community rather than forming a fourth pillar. See [Heart & Wellness](#heart-wellness).\n\nPlatforms bring the pillars into practice, drawing on a shared team and infrastructure. Outreach is a continuing function across the three pillars, with responsibilities assigned to the working team.\n\nThe pillar chapters describe possible activities. Year 1 priorities will be selected according to capacity, partnerships and funding.\n\n## How a project moves across the pillars\n\nThe ethos supports transdisciplinary enquiry: people with different practices and forms of knowledge shape the questions, methods and outcomes together. The pillars describe the different activities through which that enquiry can develop.\n\n**Example:** An artisan, technologist and local knowledge holders develop an AR heritage prototype during a residency. It is shared through a public walk and documented in a publication. An institution may later commission a related learning experience. The enquiry connects research and learning, public exchange and commissioned work; publishing carries its knowledge across all three.\n\nRead [How we work together on Home](#home) and the [Outreach & Community Engagement approach](#outreach).\n\n", "research": "Develop knowledge, creative practices, skills and new ways of working.\n\n| Activity area | Possible activities |\n|---|---|\n| Residencies & fellowships | Artist, designer and researcher residencies; interdisciplinary collaborations; supported periods of enquiry and practice development. |\n| Ecology & futures research | Water, climate, local ecologies, sustainability and speculative futures. |\n| Craft & material innovation | Artisan collaborations, material experiments, craft processes, sustainable production and documentation. |\n| AI, AR & emerging technologies | Creative AI, local-language tools, augmented-reality interpretation, interactive media, physical computing and critical enquiry into technology’s social implications. |\n| Living knowledge & archives | Oral histories, community-led archives, craft documentation and digital storytelling. |\n| Learning & skills exchange | Mentorship, student programmes, educational partnerships, field schools, workshops and hands-on research labs. |\n| Reflective practice & personal growth | Heart programmes such as Nurupa connect self-enquiry, mentored creative practice and community learning, through residential or hybrid formats. |\n| Research publication & dissemination | Essays, papers, field notes, toolkits and other research outputs developed through Kani Publications. |\n\nResearch programmes can produce exhibitions, performances, publications, prototypes and public discussions. Appropriate specialists are engaged per project; emerging technology work does not initially require a permanent technology department.\n\n\nSee [Heart & Wellness](#heart-wellness) for programme intent and working arrangements.\n", "creative-experiences": "Bring people together through public encounters with art, culture, ideas and making.\n\n| Activity area | Possible activities |\n|---|---|\n| Kani Fest | An interdisciplinary festival with curators appointed for each edition. |\n| Exhibitions & open studios | Art, design, installations, work-in-progress presentations and residency outcomes. |\n| Music, performance & poetry | Baithaks, concerts, theatre, readings, experimental sound and audiovisual collaborations. |\n| Film & public conversations | Screenings, filmmaker discussions, talks, panels and debates. |\n| Workshops & heritage walks | Participatory making, demonstrations and walks developed with local knowledge holders. |\n| Curated marketplaces | Selected artisans and makers, themed editions, demonstrations, workshops and associated cultural programming. |\n| Heart gatherings & creative sharing | Reflective circles, participatory gatherings and optional showcases emerging from Heart programmes such as Nurupa; developed with participant consent. |\n| Publication encounters | Book launches, readings, editorial conversations and exhibitions connected to Kani Publications. |\n\nTicketed public events and curated marketplaces remain within Creative Experiences. Charging for participation does not automatically move a programme into the commercial pillar.\n\n", "commercial": "Generate earned income through hospitality, spaces and commissioned experiences.\n\n| Activity area | Possible activities |\n|---|---|\n| Corporate retreats & offsites | Residential or day programmes combining meetings, stays and creative experiences. |\n| Commissioned experiences | Tailored craft, culture and creative-learning programmes for clients and institutions. |\n| Gallery & event-space hire | Client exhibitions, presentations and private events. |\n| Screening & AV-room hire | Private screenings, presentations and facilitated sessions. |\n| Office & meeting-space hire | Workspace, conference rooms and short-term team bookings. |\n| Creative hospitality & stays | Guest stays, catering and residential programme packages tied to creative, cultural or learning experiences. |\n| Commissioned publications | Partner-supported or commissioned editions developed with Kani Publications under an agreed editorial brief. |\n\nEach commercial engagement has an agreed scope, price, delivery owner and allocation of space and staff. Public-interest programming and commercial bookings share a coordinated calendar.\n", "outreach": "## Purpose\n\nOutreach is a continuing responsibility across all three pillars. It builds relationships, helps Kani understand what people need, and creates ways for people to participate in shaping its work. Communications helps people hear about a programme; outreach helps them find a way into it and influence it.\n\n## Relationships and responsibilities\n\n| Area | What we do | Who leads |\n|---|---|---|\n| Local relationships | Meet neighbourhood groups, craftspeople, educators and cultural practitioners; listen to their interests and develop activities together. | Programme team; Programme & Operations Coordinator in Year 1. |\n| Participation and access | Reach potential residents and participants; explain opportunities; identify barriers such as language, cost, timing or accessibility. | Named programme owner, supported by communications and outreach coordination. |\n| Audience development | Build relationships with groups likely to attend, invite them personally and encourage repeat participation beyond one event. | Design & Communications, alongside programme owners. |\n| Institutional connections | Develop exchanges and joint programmes with schools, colleges, cultural organisations and research institutions. | Director and relevant programme owner, with the partnerships lead where needed. |\n| Funding and commercial relationships | Approach funders, sponsors, offsite clients and venue users with relevant proposals. | Fundraising & Partnerships / Commercial & Bookings. |\n\n## Four working commitments\n\n1. **A named owner.** Every programme identifies who handles outreach and maintains the relationships afterwards. Programme owners remain responsible for commitments made to participants.\n2. **Time and budget.** Outreach begins while a programme is being developed. Budgets allow for visits, translation, travel and participation support where needed.\n3. **A shared relationship record.** Record conversations, interests, commitments and follow-ups, with consent for ongoing contact. Contact details are held in an appropriate internal record, not this public document.\n4. **A feedback loop.** Ask what worked, who was missing and what should change. Review repeat participation, collaborations and participant experience alongside attendance and communication reach.\n\n## Year 1 and growth\n\nThe **Director of Creative Practice** is accountable for the overall approach and supports key relationships. The **Programme & Operations Coordinator** coordinates local relationships, participation support and follow-up. The **Design & Communications Associate** leads audience communication with programme inputs. The retained fundraising lead handles funding relationships and relevant institutional partnerships.\n\nAllocate working time for these responsibilities. A busy festival, residency or marketplace must budget for additional outreach support when the permanent team cannot carry it.\n\nAs recurring work and funding justify it, a **Community Engagement & Outreach Coordinator** reports to the Director and works across the pillars. This role maintains continuity between programmes; programme owners still own their briefs, budgets and commitments.\n\n## Across the platforms\n\n- **Kani Fest:** Co-develop participation with local groups, plan invitations and access, and maintain relationships after the edition. Work with the Volunteer Coordinator on continuing participation; that coordinator owns induction, rota and welfare, while assigned venue or task leads direct each shift. Sustained year-round responsibilities need a scoped, funded role.\n- **Kani Publications:** Invite contributors and community knowledge holders, agree credit and permissions, and plan how publications reach their intended readers.\n- **Curated Marketplaces:** Build sustained artisan and maker relationships, support applications and participation, and gather feedback after each edition. Curatorial selection remains with the Marketplace Curator.\n\nProgramme reviews record what was heard, what changed in response and who will follow up. See [Decision rights](#decisions) for the boundaries between outreach, creative selection and financial approval.\n\n## Care within the team\n\nOutreach builds continuing relationships with communities and participants. The shared Heart & Wellness responsibility supports the people doing the work across Kani through welcome, check-ins, morale and practical support. The two work together where community members become collaborators or volunteers; volunteer rota and shift responsibilities stay with the assigned festival leads.\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, including Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n", "entities": "The entities enable the work; the pillars describe activities. These are proposed operating remits, to be aligned with the entities’ actual mandates and approvals.\n\n| Entity | Proposed contribution |\n|---|---|\n| Seed of Unity Foundation — SoUF | Community, education, supported research, fellowships and public-interest programmes. |\n| Kashmir Innovation Labs — KiLab | Craft, material research, documentation, innovation and related collaborations. |\n| M/s Kani Home | Commercial experiences, space hire, hospitality and accommodation. |\n\nEvery project identifies its lead entity, budget and authorised signatory. Operational coordination under the Director does not replace the financial and contractual authority of the relevant entity.\n", "council": "## Purpose\n\nThe council helps establish annual direction and priorities, contributes expertise, mentors practices and opens relationships. Senior advisors support the working team through key conversations and defined commitments. Day-to-day execution rests with staff and commissioned collaborators.\n\n## Seven advisory areas\n\nThe areas describe expertise, not named individuals or separate departments. Each area may have one or two members, depending on the expertise and support needed. Where two members share an area, they agree how to divide responsibilities and coordinate their contribution. Seven advisory areas can therefore have between seven and fourteen members when all areas are filled.\n\n| Advisory role | Main contribution |\n|---|---|\n| Art & Cultural Practice | Visual arts, film, exhibitions, artistic development and cultural relationships. |\n| Design, Systems & Technology | Programme formats, organisational systems, experiences, shared tools and infrastructure, and emerging technologies. |\n| Research, Learning & Publishing | Research direction, academic relationships, educational programmes and editorial standards. |\n| Sound & Music | Music programming, sound practices, practitioner networks and interdisciplinary collaborations. |\n| Craft, Heritage & Community | Artisan relationships, local knowledge, heritage, craft innovation and community participation. |\n| Business & Enterprise | Commercial models, pricing, retreats, bookings and market relationships. |\n| Fundraising & Resource Development | Grants, CSR relationships, sponsorships, philanthropy and institutional funding. |\n\nInstitutional partnerships are a shared responsibility across the council. Membership should include at least two people deeply connected to Kashmir’s communities and practices. Invite additional specialists for particular enquiries rather than expanding the standing council for every discipline.\n\n## Appointments and accountability\n\n- Council members serve one-year terms. Membership is reviewed annually, and appointments may be renewed.\n\n- The annual review considers contribution, agreed commitments, continuity and the expertise needed for the next year.\n\n- One member serves as Convenor for one year, coordinating agendas and follow-up without an additional artistic veto.\n\n- Each member has a written remit, agreed time commitment and compensation arrangement.\n\n- Each member undertakes a small set of concrete commitments, such as introducing partners, mentoring a project or helping develop a programme.\n\n- Departing members document commitments and hand over relationships to the working team.\n\n## Working method and disagreements\n\nHold quarterly planning and review meetings, with shorter project conversations as needed. The Director attends; relevant staff and platform leads join for their items. The Programme & Operations Coordinator initially provides light secretariat support.\n\nBring concrete proposals stating purpose, audience, owner, cost, funding source and demands on space and staff. Discuss them against the mission, local relevance, creative or learning value, feasibility and what they would displace.\n\n**Voting proposal for collective review:** Seek agreement before voting. Each advisory area has one vote, whether it has one or two members. Members sharing an area agree their position; if they cannot agree, that area abstains. A quorum requires at least five advisory areas represented, with at least four affirmative area votes for a council-level decision. Conflicted members declare their interest and step out. Confirm how vacancies, shared-area conflicts and recusals affect representation before adopting this procedure; if a valid quorum cannot be established, defer the decision. This procedure remains an open decision for the group.\n\nRecord decisions, reasons, owners and next actions. Routine programme delivery proceeds within delegated authority and does not await council votes.\n", "council-option-2": "## Council structure\n\nA proposed 14-seat council brings together advisors, serving curators, community and youth representatives. The Director attends as operational lead.\n\nHeart and grace underpin how the council listens, collaborates and works with people.\n\nFour perspectives come together in one council. The groups describe contributions, not separate departments or ranks. Members can contribute beyond their category.\n\n| Group | Seats | Proposed roles and contribution |\n|---|---|---|\n| Practice & Systems Advisors | 5 | One each for Arts, Craft & Cultural Practice; Research, Learning & Publishing; Design, Systems & Technology; Business & Enterprise; Fundraising & Partnerships. Build capability, mentor the team and develop practitioner, institutional, industry and funding relationships. |\n| Programme members — ex officio | 5 | Festival Curator; Arts & New Media Curator; Sound & Music Curator; Film & Moving Image Curator; Craft & Material Practices Curator. Bring current practice, practitioner relationships and programme experience. |\n| Community representatives | 2 | Selected through a process developed with local residents, practitioners and participants. Bring priorities, access needs and lived experience; gather views and report back. |\n| Youth representatives | 2 | Young people selected through an accessible youth-led nomination or selection process. Help shape opportunities, learning and Kani’s future direction. |\n| **Total council seats** | **14** | The Director attends as operational lead, additional to these seats. Other working-team members join relevant items. |\n\nStart with one advisor per area. Invite further specialists for particular enquiries rather than automatically adding standing seats. Community and youth seats are distinct places; one person does not fill two seats.\n\n## Advisors and curators\n\nAn advisor supports the wider organisation across programmes and years. A curator develops a particular programme within an agreed brief. For example, the Arts, Craft & Cultural Practice Advisor helps build mentoring and institutional relationships; the Arts & New Media Curator develops the festival track.\n\nEx officio means membership by virtue of holding a role. Each serving curator joins through their appointment and leaves that seat when the appointment ends. These seats are additional to the advisors. An unfilled curatorial role leaves a vacant seat; no appointment is made solely to fill the council.\n\nAdvisors and community/youth representatives serve one-year terms, reviewed annually and renewable. Each has an agreed remit, time commitment and participation or compensation arrangement. Curatorial appointments include time for council work and handover.\n\nMembers step out of discussions concerning their own appointment, fees or performance. Interests in commissions, selections or partnerships are declared and handled through an agreed conflict process.\n\n## How the council works\n\nThe council helps shape annual priorities, participation and programme learning, and advises on partnerships and long-term development. The Director and programme leads handle everyday delivery within agreed briefs and budgets. Financial and contractual commitments remain with authorised entity representatives.\n\nOne Convenor is appointed annually from the council. The full council meets quarterly, with temporary working groups for specific questions. Advisors agree practical contributions such as mentoring, introductions or helping develop organisational systems.\n\nCommunity and youth representatives help set agendas, bring views from open community gatherings and report back on responses. Participation includes appropriate honoraria, travel and access support. Selection arrangements and decision procedures remain to be agreed.\n\nReview the council structure after one year.\n", "decisions": "**Reference draft for Option 1.** [Option 2](#council-option-2) proposes an alternative council composition and remit. These decision rights have not been replaced; revise them together once a model is agreed.\n\n| Decision | Responsible role |\n|---|---|\n| Overall direction and annual priorities | Council collectively, informed by the Director and working team. |\n| Year-round programme, staff allocation and operational commitments | Director of Creative Practice, within delegated authority. |\n| Festival artistic selections | Festival Curator, informed by track curators/fellows, within the agreed brief and budget. |\n| Festival programme and resource review | Festival Curator and Producer jointly review the programme; the Curator owns artistic choices and the Producer owns delivery planning. Escalate unresolved resource conflicts to the Director. |\n| Festival confirmed timetable | Programme Coordinator maintains the schedule and change log after review by the relevant leads. |\n| Festival equipment allocation and changeovers | Technical & Infrastructure Lead under the Producer, working with venue/session leads and shared technical staff. |\n| Festival volunteer coordination | Volunteer Coordinator owns induction, rota and support; one assigned venue or task lead directs each shift. |\n| Publication editorial development and quality | Editor / Publishing Lead, within the agreed publishing brief and budget. |\n| Marketplace theme and participant selection | Marketplace Curator, within the agreed programme brief. |\n| Outreach strategy and key institutional relationships | Director, informed by programme owners and community feedback. |\n| Community relationships, participation support and follow-up | Programme & Operations Coordinator in Year 1; dedicated outreach coordinator when appointed, working with the named programme owner. |\n| Audience communication and development | Design & Communications, alongside programme owners and outreach coordination. |\n| Project schedules, participant coordination and delivery follow-up | Named programme manager or coordinator. |\n| Technical feasibility, venue readiness and production methods | Operations / Production Lead or the coordinator with appointed technical specialists. |\n| Funding proposals and funder relationships | Fundraising lead/manager with Director, programme and accounts inputs. |\n| Commercial proposals and bookings | Named commercial owner within approved pricing and booking rules. |\n| Team care, morale and working culture | Director accountable; named Heart & Wellness coordinator supports check-ins and practical care. Every lead remains responsible for their team’s working conditions. |\n| Contracts and financial commitments | Authorised representatives of the relevant entity. |\n\nWhen scope exceeds agreed resources, the relevant creative lead and Director revise the proposal or seek additional support. Council endorsement alone does not authorise spending.\n\nEvery project has one named owner and a clear budget, including when it connects pillars or platforms. For shared projects, agree who owns each deliverable and how budgets and handovers are coordinated.\n\nThe council’s proposed voting method gives one vote to each advisory area, regardless of whether it has one or two members. It remains subject to collective agreement; see [Council appointments and decision procedure](#council) and [Open Decisions](#open-decisions).\n", "year-one": "Begin with a small permanent team, supported by existing staff and funded specialist appointments. Add continuing roles as programmes, workload and resources grow.\n\nStart with **three permanent hires**, supported by the existing accounts and hospitality teams and a defined budget for retained and project expertise.\n\n## Director of Creative Practice\n\nThe single operational head of the working team.\n\n- Leads the year-round programme across the three pillars.\n\n- Is accountable for outreach and community engagement, supporting key relationships and reviewing participation and access.\n\n- Works with the council on priorities, partnerships and institutional development.\n\n- Holds the overall calendar, resource plan and programme budget within delegated authority.\n\n- Commissions curators, editors, mentors and other specialists.\n\n- Leads key fundraising relationships with retained support.\n\n- Develops and reviews platforms and original initiatives.\n\n## Roles reporting to the Director\n\n| Role | Initial responsibilities |\n|---|---|\n| Programme & Operations Coordinator | Shared calendar, resident and artist liaison, local community relationships, participation support and follow-up; production logistics, vendor coordination, commercial enquiries and booking follow-up; coordination with accounts and hospitality. |\n| Design & Communications Associate | Graphics, social media, programme announcements, audience communication and development with programme owners, presentations and documentation coordination. An early-career role with independent working ability. |\n| Existing Accounts Team | Invoicing, payments, records, expenditure tracking and financial reporting inputs. Entity approval powers remain separate. |\n| Existing Hospitality Team | Accommodation, guest arrivals, room readiness, catering arrangements, routine venue visits and visitor support. |\n\nThe Director is one of the three new permanent hires. Existing accounts and hospitality capacity is additional to those three hires.\n\n## Retained, rotating and project basis\n\n| Support role | Starting arrangement |\n|---|---|\n| Fundraising & Partnerships Lead | Part-time retainer with defined deliverables, reporting to the Director. Develops grants, CSR opportunities, sponsors, donors and institutional relationships. |\n| Proposal & Grant Writer | Commissioned for selected applications and reports; coordinated by the fundraising lead. Can be the same person where skills and capacity allow. |\n| AV Technician | Scheduled event support and maintenance visits. Train an existing staff member for basic playback and equipment checks. |\n| Student Design Intern | Paid, supervised placement under the Design & Communications Associate, with defined learning outcomes. |\n| Senior Design Mentor | Occasional support for visual direction, review and development of the associate. |\n| Festival Curator, curatorial fellows & Festival Producer | Edition-funded appointments; proposed 6–9 month paid track fellowships with mentoring and production support. |\n| Festival delivery roles | Programme Coordinator, Technical & Infrastructure Lead, venue/session leads, Artist & Guest Liaison and Volunteer Coordinator; combine roles only where capacity allows. |\n| Editor / Publishing Lead | Retained or appointed per publication or series, supported by commissioned editorial specialists. |\n| Marketplace Curator | Contract across a series of editions, supported by the permanent coordinator. |\n| Heart programme leads, mentors & facilitators | Funded appointments for initiatives such as Nurupa; define delivery time, participant support and specialist requirements before launch. |\n| Residency mentors & facilitators | Appointments against each programme’s budget, including researchers, artists, educators, creative technologists and local knowledge holders. |\n| Specialist production partners | Sound, lighting, fabrication, installation, photography, video and event crew as required. |\n\nStart with a manageable calendar. A festival or publication deadline must carry its additional staffing cost rather than simply being added to the coordinator’s existing workload.\n\n## Outreach capacity\n\nThe coordinator maintains the shared relationship record and follows up on programme feedback, while the Director supports key relationships. Allocate time for this work and fund additional outreach support during busy programmes. There is no additional permanent outreach hire in the initial three-person team. See [Outreach & Community Engagement](#outreach).\n\nKani Fest budgets for its own delivery capacity and supported volunteer teams. The permanent coordinator holds continuity; returning volunteers can take bounded team roles, while sustained responsibilities require a funded appointment. See the [festival working map](#kani-fest).\n\n## Heart & Wellness\n\nName a coordinator for team welcome, check-ins, morale, recognition and practical support, with time allocated within the starting structure. The Director is accountable for making this possible; every lead owns respectful working and realistic workloads. At festival peaks, agree additional support alongside the Producer and Volunteer Coordinator. Provide an alternative contact for concerns involving the usual lead.\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, including Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n", "full-structure": "| Area | Role | Core responsibility |\n| --- | --- | --- |\n| Programme management | Programme Manager — Research, Residencies & Learning | Owns residencies, fellowships, research, educational relationships and participant support. |\n| Programme management | Programme Manager — Creative Experiences | Owns the public calendar and delivery coordination for exhibitions, music, film, workshops, walks, marketplaces and Kani Fest. |\n| Community engagement | Community Engagement & Outreach Coordinator | Maintains local relationships, coordinates participation and access, supports programme outreach and follows up on feedback across the pillars. |\n| Fundraising, partnerships and commercial development | Fundraising & Partnerships Manager | Owns the funding strategy and pipeline, funder relationships, grants, CSR partnerships, sponsorships, donors and institutional collaborations. |\n| Fundraising, partnerships and commercial development | Commercial & Bookings Executive | Manages enquiries, proposals, quotations, site visits, follow-up, confirmed bookings and client relationships. |\n| Fundraising, partnerships and commercial development | Proposal & Grant Writer | Develops applications, concept notes, CSR and sponsorship proposals, pitch material and narrative reports. |\n| Operations and technical delivery | Operations / Production Lead | Owns venue readiness, the master venue calendar, logistics, maintenance coordination, vendors and on-site delivery. |\n| Operations and technical delivery | AV & Technical Operator | Operates sound, projection and screening systems, maintains equipment and coordinates with specialist vendors. |\n| Design and communications | Design & Communications Lead | Owns visual communication, social media planning, audience outreach, announcements, newsletters, presentations and signage across all programmes. |\n| Design and communications | Student Design Intern | Supports production through a supervised rotating placement. |\n| Existing support teams | Accounts Team | Supports project owners and fundraising staff while retaining entity-specific approval procedures. |\n| Existing support teams | Hospitality Team | Works with production, programme and bookings staff on delivery. |\n\nAll continuing roles sit within one permanent working team led by the **Director of Creative Practice**. This is a growth model; appointments follow recurring need and funding rather than being simultaneous Year 1 hires.\n\n## Programme management\n\n- **Programme Manager — Research, Residencies & Learning:** Owns residencies, fellowships, research, educational relationships and participant support. Shapes the research and learning pipeline, from developing opportunities and selecting participants to coordinating mentors, partners and outcomes. Ensures participants receive clear support and that learning is documented and shared.\n\n- **Programme Manager — Creative Experiences:** Owns the public calendar and coordinates delivery for exhibitions, music, film, workshops, walks, marketplaces and Kani Fest. Works with the Programme Manager — Research, Residencies & Learning when projects produce public events, ensuring that each project has one named owner and clear delivery responsibilities.\n\nBoth report to the Director. Where a residency produces a public event, the two managers agree the handover and responsibilities for each part.\n\n## Community engagement and outreach\n\n**Community Engagement & Outreach Coordinator — reports to the Director**\n\nMaintains local and community relationships across programmes, coordinates participation and access support, keeps the shared relationship record and follows up on feedback. Works with programme managers on co-development and with Design & Communications on audience development. Programme owners retain responsibility for creative briefs, budgets, selections and commitments.\n\nIn Year 1 these duties are allocated to the Programme & Operations Coordinator with Director support. Establish the dedicated role when recurring relationships and participation work exceed that capacity and funding can sustain it. See [Outreach & Community Engagement](#outreach).\n\n## Fundraising, partnerships and commercial development\n\n**Fundraising & Partnerships Manager — reports to the Director**\n\nThis operational role works alongside the Advisory & Programme Council’s **Fundraising & Resource Development** advisory role. The advisor provides strategic guidance and relationships; the Manager owns day-to-day fundraising delivery, partnerships and reporting.\n\nOwns the funding strategy and pipeline, funder relationships, grants, CSR partnerships, sponsorships, donors and institutional collaborations. Oversees commercial development and coordinates funder reporting.\n\nReporting to this manager:\n\n- **Commercial & Bookings Executive:** Enquiries, proposals, quotations, site visits, follow-up, confirmed bookings and client relationships.\n\n- **Proposal & Grant Writer:** Applications, concept notes, CSR and sponsorship proposals, pitch material and narrative reports. Can remain external or retained.\n\nProgramme managers design and deliver funded activities and collect outcome evidence. Accounts supplies expenditure records and financial reporting. The Fundraising Manager coordinates the combined report and funder relationship.\n\n## Operations and technical delivery\n\n**Operations / Production Lead — reports to the Director**\n\nOwns venue readiness, the master venue calendar, logistics, maintenance coordination, vendors and on-site delivery.\n\n- **AV & Technical Operator — reports to the Operations Lead:** Operates sound, projection and screening systems, maintains equipment and coordinates with specialist vendors.\n\n- External production partners provide additional capacity per project.\n\n## Design and communications\n\n**Design & Communications Lead — reports to the Director**\n\nOwns visual communication, social media planning, audience outreach, announcements, newsletters, presentations and signage across all programmes.\n\n- **Student Design Intern — reports to the Design Lead:** Supports production through a supervised rotating placement.\n\n- Programme owners provide accurate information; the communications lead coordinates public-facing editing and approval.\n\n- Editors own publication manuscripts and editorial quality. Publication design is planned with the design team.\n\n- Photography, recording and editing receive allocated time or commissioned support.\n\n## Existing support teams\n\n- **Accounts Team:** Operationally coordinated under the Director; works with project owners and fundraising staff while retaining entity-specific approval procedures.\n\n- **Hospitality Team:** Operationally coordinated under the Director; works with production, programme and bookings staff on delivery.\n\n## Kani Fest project team\n\nThe Festival Curator and Festival Producer work alongside one another under the Director. Proposed 6–9 month paid curatorial fellows develop the tracks; the Producer coordinates programme scheduling, technical infrastructure, venue/session leads, artist liaison and volunteer coordination. These are edition appointments or allocated responsibilities, not automatic additions to the permanent team. The permanent coordinator in Year 1, or Creative Experiences Programme Manager at scale, holds continuity between editions. See the [festival working map and role explainers](#kani-fest).\n\n## Heart & Wellness\n\nA shared function with a named coordinator accountable to the Director, supporting staff, fellows, project teams and volunteers across Kani. It coordinates welcome, check-ins, recognition, listening and practical care. It can be allocated within an existing role initially; dedicated capacity follows workload and funding. All team leads retain responsibility for respectful working, realistic workloads and follow-through on concerns. See [Shared Infrastructure](#infrastructure).\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, including Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n", "growth": "Growth follows recurring work and funding rather than a fixed hiring sequence.\n\n| Trigger | Staffing response |\n|---|---|\n| Credible funding opportunities require sustained follow-up. | Make Fundraising & Partnerships Manager permanent. |\n| Residencies, public programmes and commercial hires regularly overlap. | Separate programme management from operations/production coordination. |\n| Community relationships, participation support and follow-up become sustained work beyond the programme coordinator’s capacity. | Add a Community Engagement & Outreach Coordinator reporting to the Director, with recurring funding and a defined cross-programme remit. |\n| Technical activity becomes frequent and predictable. | Bring in a permanent AV & Technical Operator. |\n| Commercial enquiries and bookings become a substantial recurring business. | Add a Commercial & Bookings Executive under Fundraising & Partnerships. |\n| Research and public programmes each sustain a funded calendar. | Create dedicated managers for Research, Residencies & Learning and Creative Experiences. |\n| Publication work becomes a sustained, funded annual programme. | Expand the editor’s retained time; consider a continuing publishing role only when justified. |\n| Festival or marketplace peaks exceed normal capacity. | Add temporary producers, coordinators and crew through the relevant programme budget. |\n\nBefore each permanent addition, confirm recurring need, a clear reporting line and visibility of funding for the role’s full cost over the following 12 months. This is a proposed planning rule, not a commitment to hire.\n\nFor Kani Fest, returning volunteers may take defined team-captain responsibilities with training and staff support. Sustained work across the year should become a scoped, funded associate or fellowship opportunity where justified. This is an optional pathway based on interest, readiness and available roles, not a guaranteed promotion. See [Kani Fest](#kani-fest).\n\nReview capacity for Heart & Wellness as staff, fellows, volunteers and project teams grow. Begin with a named coordinator and allocated time; add dedicated support when recurring need and funding justify it.\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, including Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n", "heart-wellness": "## Heart as our foundation\n\nWhatever we do, we do with heart and grace. Heart is the ground beneath all three pillars: care for ourselves, one another and the places we inhabit. It shapes how we listen, create, learn and work together.\n\nHeart also has a living programme: experiences that help people explore who they are, practise who they wish to become and grow towards their potential. Reflection, creativity, companionship and sustained practice connect inner development with how we live and contribute to the world.\n\n## Two connected expressions\n\n| Expression | What it makes possible |\n|---|---|\n| Everyday culture of care | Welcome, belonging, listening, team check-ins, rest, recognition and practical support across Kani. |\n| Programmes for growth and becoming | Guided journeys, reflective residencies, creative practice, mentorship, mindful gatherings and community learning throughout the year. |\n\nHeart remains a foundation shared by the three pillars. Its programmes connect with research, residencies and learning, and can lead to creative experiences and public exchange.\n\n## Nurupa · an initiative in development\n\nNurupa is a proposed journey of remembering, practising and expressing our potential through play, reflection and creative practice. Its working white paper describes an offering of the **Qalb Center at Kani Home**, as part of **The Slow Thing Festival**. These programme identities and arrangements remain in development.\n\nParticipants imagine an aspirational self—an avatar—and explore its qualities through daily practice, supported by mentors and fellow participants. A craft or passion project gives that exploration a tangible form. The proposed winter-to-spring journey brings together on-site and online participation, with a spring sharing of what participants have practised and made.\n\n| Programme element | Purpose |\n|---|---|\n| Reflection and self-enquiry | Make room to notice habits, aspirations and possibilities through journaling, quiet time and conversation. |\n| Aspirational avatar and play | Explore ways of being through an imagined identity, cooperative games and shared discovery. |\n| Creative practice | Develop a craft or passion project through regular, sustained attention. |\n| Mentorship and companionship | Offer encouragement, listening and reflection within a supportive community. |\n| Rhythm, rest and mindful attention | Create space to slow down and practise with care and at a personally appropriate pace. |\n| Sharing and continuation | Share chosen work and learning, then continue, adapt, mentor or rest. |\n\nNurupa is one expression of Heart. Other programmes can take different forms while sharing the intention of helping people grow with care, agency and connection. The white paper is a working proposal, not a confirmed calendar or a promise of particular outcomes.\n\n## Year-round possibilities\n\n- Reflective residencies and seasonal journeys combining personal enquiry with creative practice.\n- Regular circles for listening, journaling, storytelling and shared reflection.\n- Mindfulness, movement and wellbeing sessions with appropriate facilitators.\n- Mentored craft and passion projects, with optional opportunities to share work.\n- Community gatherings that nurture belonging, mutual support and continued practice.\n\n## How programmes are held\n\nThe Director oversees the programme direction. Each initiative has a named lead, defined facilitator and mentor responsibilities, allocated time and a budget. The shared Heart & Wellness coordinator connects this work with everyday care across Kani; programme delivery receives its own capacity.\n\nParticipation respects different beliefs, backgrounds and personal boundaries. People choose what they share and may opt out of activities. Recording, documentation and public sharing require clear consent; personal reflections are not automatically publication material. Facilitator preparation, participant support, privacy and any practice-specific safeguards must be agreed before launch.\n\nNurupa's calendar, cohort format, mentor appointments, access and pricing, online arrangements and support protocols remain open for collective development. See [Open decisions](#open-decisions). Learning from each programme belongs in [Learnings & Feedback](#learnings-feedback), using participant-approved or anonymised summaries.\n", "infrastructure": "This layer shows what every programme can draw on. It does not create additional posts or duplicate the permanent team.\n\n| Shared capability | Resources and services | Responsible roles |\n|---|---|---|\n| Spaces | Level 1 gallery with track lights and four movable walls; Level 2 screening/AV room; Level 3 office and meeting facilities; guest house accommodating up to 15 people. | Programme & Operations Coordinator initially; Operations Lead as the team grows; hospitality for stays. |\n| Technical infrastructure | Sound, projection, lighting, connectivity, equipment operation and upkeep. | Scheduled AV technician initially; permanent AV Operator when justified. |\n| Production | Installation, fabrication coordination, event logistics, procurement and specialist vendors. | Coordinator initially; Operations / Production Lead at scale. |\n| Design, communications & audience support | Graphics, social media, publicity, registrations, mailing lists, signage and audience feedback. | Design & Communications role with programme inputs. |\n| Community relationships & participation support | Shared relationship records, consent for ongoing contact, access planning, partner follow-up and feedback learning. | Programme & Operations Coordinator initially; dedicated outreach coordinator when justified; programme owners retain responsibility for their commitments. |\n| Documentation & knowledge systems | Photography, recordings, archives, contributor information, consent and permissions records, publication files and programme learning. | Named programme owner, supported by communications, editors and commissioned documentation staff. |\n| Hospitality | Guest arrangements, accommodation, catering and visitor support. | Existing Hospitality Team. |\n| Heart & Wellness | Everyday care and belonging; coordination with programmes for growth and wellbeing, including Nurupa in development. Programme delivery has its own named lead and budget. | Named coordinator with allocated time, accountable to the Director; all leads share responsibility for their teams. |\n| Finance & administration | Budgets, agreements, invoicing, payments, records and reporting inputs. | Programme owners and existing Accounts Team; authorised entity representatives approve commitments. |\n\nA shared planning meeting resolves competing demands on staff, spaces and equipment. Every request includes an owner, brief, deadline and budget.\n\n## Shared resources during Kani Fest\n\nThe Festival Producer coordinates delivery with a named Technical & Infrastructure Lead. Maintain one equipment allocation and movement plan covering venues, operators, crew, setup and changeovers. Venue/session leads confirm readiness; programme changes go through the Programme Coordinator. Shared staff time and specialist crew are budgeted explicitly. Volunteers support assigned tasks under supervision. See [Kani Fest](#kani-fest).\n\nSee [Heart & Wellness](#heart-wellness) for the developing approach to care and belonging across Kani.\n\n", "platforms": "## Purpose\n\nDevelop recognisable programmes through which Kani’s ethos and pillars take shape. A platform can continue across years while contributors, themes and editions change.\n\nAn original initiative can begin as a small experiment and become a continuing platform if its value, audience, workload and funding justify it.\n\n“Platforms & Original Initiatives” is the working title for this layer. Ownership and usage of particular works, brands and commissioned outputs are addressed through the relevant contributor agreements.\n\n## Platform overview\n\n| Platform | Relationship to the pillars | Creative lead |\n|---|---|---|\n| Kani Fest | Primarily Creative Experiences; draws on research, learning and partnerships. | Festival Curator with proposed 6–9 month paid track fellows; Festival Producer leads delivery alongside the Curator. |\n| Kani Publications | Works across all three pillars; publishes research, creative practice and appropriate commissioned work. | Editor / Publishing Lead on retainer or project appointment initially. |\n| Kani Curated Marketplaces | Primarily Creative Experiences; connects craft and material research with public exchange and maker livelihoods. | Marketplace Curator appointed for a series or edition. |\n| Nurupa · in development | An initiative within Heart & Wellness, connecting reflective learning and sustained creative practice with community exchange. | Programme lead, mentors and facilitators to be confirmed against the programme brief and budget. |\n| Future original initiatives | Assigned according to their purpose; may connect several pillars. | Named project lead appointed when the initiative is approved. |\n\nThe established platform pages include a structure chart and a responsibilities table; Nurupa’s developing approach is outlined in [Heart & Wellness](#heart-wellness). The charts distinguish project reporting from shared support; retained and project appointments are not additional permanent Year 1 hires. [Outreach & Community Engagement](#outreach) supports participation across all platforms. Shared [Heart & Wellness](#heart-wellness) supports team morale, listening and practical care across their working teams.\n\nThe Director oversees platform development and resource planning with council guidance. There is no separate permanent “IP creation” department in Year 1.\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, including Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n", "kani-fest": "## Purpose\n\nAn interdisciplinary festival with a fresh curatorial proposition for each edition.\n\n## Festival working map\n\n**Drag the map background to move around. Use + / − to zoom, or Reset view to see the whole map. Select any box to read its explainer.** The map describes responsibilities; roles can be combined when time, skills and funding allow.\n\n```kani-map\n[Festival team]\n- Director of Creative Practice | Scope, resources and appointments\n  - Festival Curator | Artistic direction · edition appointment\n    - Arts & New Media Curator | 6–9 month paid fellowship\n    - Sound & Music Curator | 6–9 month paid fellowship\n    - Craft & Material Practices Curator | 6–9 month paid fellowship\n    - Film & Moving Image Curator | 6–9 month paid fellowship\n    - Assistant curators & programme collaborators | Assigned to their respective tracks\n  - Festival Producer | Delivery · fixed-term appointment\n    - Programme Coordinator | Timetable and changes\n    - Technical & Infrastructure Lead | Shared equipment, operators and crew\n    - Venue / Session Leads | Readiness and visitor flow\n    - Artist & Guest Liaison | Requirements, travel and guest coordination\n    - Volunteer Coordinator | Recruitment, induction, rota and welfare\n      - Volunteer teams | Rota and support through the coordinator\n[Shared resources]\n- Funding & Partnerships | Funding relationships and reporting\n- Finance | Budget records and payments\n- Communications | Programme and audience information\n- Community Outreach | Relationships, participation and access\n- Documentation | Consent, archives and learning\n- Hospitality | Stays, food and guest support\n- Programme continuity | Handover between editions\n- Heart & Wellness | Care, belonging & wellbeing\n- Shared Spaces & Equipment | Venues, equipment and resource availability\n[Collaborations]\n- Festival Curator <> Festival Producer | Collaboration and shared support\n- Shared resources <> Festival Curator | Collaboration and shared support\n- Shared resources <> Festival Producer | Collaboration and shared support\n```\n\nThe Festival Curator and Producer work alongside one another. Assistant curators work through their assigned track curator. Permanent staff retain their reporting lines in [Full Structure](#full-structure). Each volunteer follows one assigned venue or task lead during a shift; the Volunteer Coordinator owns the rota and support.\n\n## Programming flow\n\nProgramme ideas move through a joint creative and resource review before entering one confirmed timetable. Select a step for details.\n\n```kani-flow\n- Curators develop proposals | Content, contributors and requirements\n- Programme & resource review | Festival Curator + Festival Producer\n- Confirmed schedule | Maintained by Programme Coordinator\n```\n\n```kani-details\n| Role / step | Responsibilities and purpose | Working relationships / arrangement |\n|---|---|---|\n| Curators develop proposals | Track curators develop programme ideas with practitioners and communities. Each proposal includes its purpose, participants, space, duration, budget, equipment and support needs. | Festival Curator brings the proposals into a coherent edition and identifies cross-track collaborations. |\n| Programme & resource review | Festival Curator and Producer jointly review artistic coherence and deliverability, with technical and venue inputs. Check parallel sessions, shared equipment, crew, setup and changeovers before confirming the programme. | Curator owns artistic decisions within the brief; Producer owns delivery planning. Unresolved scope or resource conflicts go to the Director; financial authority remains unchanged. |\n| Confirmed schedule | Programme Coordinator maintains and distributes one confirmed timetable. Changes are checked with the relevant leads, logged and communicated to contributors, venue teams and communications. | A living schedule with named owners for sessions and resource movements. Curator and Producer review changes affecting programme or delivery. |\n```\n\n## Volunteer pathway\n\nParticipation can grow with interest, readiness and available opportunities. Progression is optional; sustained responsibilities need a defined, funded role. Select a step for details.\n\n```kani-flow\n- Event volunteer | Defined tasks and supported shifts\n- Returning volunteer / team captain | Bounded responsibility and training\n- Paid associate / fellowship opportunity | Funded role with a clear brief\n```\n\n```kani-details\n| Role / step | Responsibilities and purpose | Working relationships / arrangement |\n|---|---|---|\n| Event volunteer | Join an edition with agreed tasks, induction, availability and a named shift lead. Use a debrief to identify interests, learning needs and whether continued involvement is wanted. | An entry point based on interest and availability; continuing participation is optional. |\n| Returning volunteer / team captain | Take on a clearly bounded coordination or peer-support responsibility, with training, a named staff contact and agreed time commitment. Help brief teams and pass concerns to the Volunteer Coordinator. | Available where readiness and programme needs align. Sustained year-round work should be scoped and budgeted as a paid role rather than assumed to be voluntary. |\n| Paid associate / fellowship opportunity | Apply for a funded role with a defined brief, supervision, learning outcomes, time commitment and compensation. Prior volunteering can inform readiness but is not a requirement or guarantee of selection. | Depends on available funding and roles, interest and a transparent selection process. Curatorial fellowships and delivery associates may have different responsibilities. |\n```\n\n## Curatorial fellowships\n\nThe proposed track roles are **6–9 month paid curatorial fellowships**, covering research, local relationships, programme development, delivery, reflection and handover. The Festival Curator mentors and brings the fellows’ work together. Agree each fellowship’s fee, time commitment, programme budget, learning outcomes and production support before recruitment.\n\nThe four tracks are a working framework. Combine them where appropriate, and allocate poetry, theatre, talks and interdisciplinary projects explicitly within the brief. Each cross-track project has one named owner and a clear budget.\n\n## Roles and responsibilities\n\nDetailed responsibilities, working relationships and appointment arrangements for each part of the map.\n\n### Festival team\n\n| Role / step | Responsibilities and purpose | Working relationships / arrangement |\n|---|---|---|\n| Director of Creative Practice | Agrees the edition brief, budget, scope and appointments. Resolves resource conflicts and reviews delivery with the two festival leads. Financial commitments remain with authorised entity representatives. | Continuing role. Festival Curator and Festival Producer are accountable to the Director for their respective responsibilities. |\n| Festival Curator | Shapes the edition’s artistic proposition and integrates the track programmes. Guides curators, makes artistic selections within the agreed brief and budget, and reviews the programme with the Producer before commitments are made. | Edition appointment covering development, delivery and close-out. Works alongside the Festival Producer; reports to the Director. |\n| Arts & New Media Curator | Develops arts and new-media projects, researches practitioners and supports collaborations. Supplies briefs, budgets and technical requirements to the festival planning team. | Proposed 6–9 month paid curatorial fellowship. Artistic direction from the Festival Curator; delivery coordinated with the Producer. |\n| Sound & Music Curator | Develops sound and music programming, including local artist relationships. Agrees performance requirements and collaborates with the technical lead on soundchecks, shared equipment and changeovers. | Proposed 6–9 month paid curatorial fellowship, reporting artistically to the Festival Curator. |\n| Craft & Material Practices Curator | Develops hands-on workshops, making and material enquiry with practitioners and community partners. Plans materials, participant capacity, facilitation and access with the delivery team. | Proposed 6–9 month paid curatorial fellowship, reporting artistically to the Festival Curator. |\n| Film & Moving Image Curator | Develops screenings, moving-image work and related conversations. Coordinates permissions, screening formats and presentation requirements with the delivery team. | Proposed 6–9 month paid curatorial fellowship, reporting artistically to the Festival Curator. |\n| Assistant curators & programme collaborators | Support research, contributor communication and track preparation. Each collaborator has a named track curator and a defined brief; delivery requirements go through the Producer’s team. | Assigned to the respective track, according to workload and funding. The map groups them for readability; they are not a separate curatorial authority. |\n| Festival Producer | Owns the delivery plan, production budget tracking, vendors, crew and on-site coordination. Tests the programme against spaces, equipment, staffing and changeover time. Resolves operational clashes or escalates them to the Director. | Fixed-term, project-funded appointment spanning planning, delivery and close-out. Works alongside the Festival Curator and reports to the Director. |\n| Programme Coordinator | Maintains the single confirmed timetable, session briefs, contacts and change log. Checks changes with the Curator and Producer and communicates them to venue leads, contributors and communications. | Edition delivery role accountable to the Producer. Maintains the schedule; artistic selections remain with the Festival Curator. May be combined with another coordination role only where capacity allows. |\n| Technical & Infrastructure Lead | Owns the equipment inventory and allocation plan, technical requirements, operators, crew, setup and changeovers. Plans who moves shared speakers or other equipment, when they move, and when checks are completed. Flags clashes before sessions are confirmed. | Named edition lead under the Producer, working with shared Operations / Production and AV staff plus funded technical crew. Volunteers support assigned tasks under supervision. |\n| Venue / Session Leads | Check each space is ready, brief the session team, coordinate starts and changeovers, and manage visitor flow. Escalate technical issues to the technical lead and programme changes to the Programme Coordinator. | Named lead for each active venue or session, accountable to the Producer. Each volunteer has one assigned task lead per shift; experienced team captains may support this work. |\n| Artist & Guest Liaison | Collects contributor requirements, communicates arrival and session information, and coordinates travel and hospitality arrangements. Passes technical needs to the technical lead and schedule changes to the Programme Coordinator. | Edition delivery role under the Producer, working with curators and the shared Hospitality team. |\n| Volunteer Coordinator | Recruits and inducts volunteers, agrees availability and tasks, maintains the rota and supports welfare, briefings and debriefs. Assigns each person to a named shift lead and maintains a route for concerns or changes. | Edition role under the Producer. Coordinates with year-round outreach staff for continuing participation; shift tasks are directed by the assigned venue or task lead. |\n| Volunteer teams | Support agreed tasks such as welcome desks, workshop assistance, visitor guidance, documentation support and supervised setup. Receive induction, clear shifts, breaks and a named lead. Specialist technical tasks remain with qualified crew. | Volunteer Coordinator handles rota and support. The assigned venue or task lead directs each shift. Responsibilities and available support are agreed in advance. |\n\n### Shared resources\n\n| Role / step | Responsibilities and purpose | Working relationships / arrangement |\n|---|---|---|\n| Funding & Partnerships | Develops grant, sponsor and partner relationships; coordinates reporting with programme and finance inputs. Confirms partner commitments with the authorised leads. | Shared support allocated to the edition. Works with the Director, Curator and Producer; existing reporting lines remain. |\n| Finance | Tracks the edition budget, invoices, payments and reporting records with the Producer and programme owners. Financial approvals follow the relevant entity’s delegated authority. | Existing Accounts Team with allocated edition time; programme appointments do not create new approval powers. |\n| Communications | Turns confirmed programme information into announcements, audience information, registration communications and signage. Coordinates changes with the Programme Coordinator and outreach team. | Shared Design & Communications team with additional edition support where funded. |\n| Community Outreach | Builds local relationships, listens to participation needs and supports invitations, access and follow-up. Works with curators on co-development and with the Volunteer Coordinator on continuing involvement. | Year 1 Programme & Operations Coordinator with Director support; dedicated outreach role when justified. Outreach and volunteer management have distinct duties. |\n| Documentation | Plans consent, credits, photography, recordings, archives and the edition review. Gathers learning from fellows, contributors, crew and volunteers and prepares material for possible publication. | Named documentation owner, supported by communications and commissioned contributors. Publishing decisions remain with the publishing lead. |\n| Hospitality | Coordinates accommodation, food, arrivals and guest support using the requirements gathered by Artist & Guest Liaison. Confirms arrangements against the edition budget and capacity. | Existing shared Hospitality Team, with one agreed contact for the festival. |\n| Programme continuity | Keeps relationships, records, calendar coordination and learning connected between editions. Holds the handover from the festival team and helps plan the next cycle. | Programme & Operations Coordinator in Year 1; Creative Experiences Programme Manager at scale. Edition duties need allocated time and additional funded support. |\n| Heart & Wellness | Supports care and belonging across the year. Connects teams with the wider Heart programme of growth and wellbeing; participation is optional and planned alongside delivery commitments. Notices workload pressures and helps agree practical support, rest and routes for raising concerns. Supports fellows, staff, crew and volunteers; works with the Producer and Volunteer Coordinator on the team’s experience. | Shared responsibility with a named coordinator and allocated time, accountable to the Director. May start within an existing role where capacity allows. Every lead retains responsibility for respectful working and realistic workloads; provide an alternative contact if a concern involves the usual lead. |\n| Shared Spaces & Equipment | Makes shared venues, sound, projection, lighting and other equipment available through one resource plan. Agrees bookings, operators, setup, movement and changeovers with festival delivery leads. | Shared Operations / Production and AV capacity, coordinated with the Festival Producer and Technical & Infrastructure Lead. Existing staff retain their permanent reporting lines. |\n\n## Working arrangements\n\nBegin preparation sufficiently early for the 6–9 month fellowship cycle. The Director agrees scope, resources and staffing with the Festival Curator and Producer. Appointments and fees depend on an approved edition budget; these are proposed roles, not announced vacancies.\n\nIn Year 1, the permanent Programme & Operations Coordinator provides continuity alongside a project-funded Producer, fellows and delivery team. At scale, the Creative Experiences Programme Manager provides that continuity. The festival team uses shared infrastructure with allocated staff time and additional crew where required.\n\nEach edition budgets for outreach, documentation, evaluation and handover. Agree who follows up with contributors, volunteers and partners. See [Outreach & Community Engagement](#outreach), [Shared Infrastructure](#infrastructure) and [Open Decisions](#open-decisions).\n\n", "publications": "## Purpose\n\nA proposed year-round publishing imprint with its own editorial identity, serving work across all three pillars. “Kani Publications” is a working name.\n\n## Structure chart\n\n```kani-chart\n- Director of Creative Practice | Agrees publishing plan, resources and appointments\n  - Editor / Publishing Lead | Editorial direction and quality\n    - Authors & contributors | Develop the work with the editor\n    - Editorial specialists | Review, copy editing and translation as commissioned\n```\n\n**Chart key:** Solid connections show editorial project direction and accountability. Contributors and commissioned specialists work to an agreed editorial brief; they are not permanent staff reports. The editor owns editorial quality within the approved brief and budget.\n\n> **Shared support — collaboration, not extra reporting lines:** Programme coordination; Design & Communications; community engagement and outreach; Fundraising & Partnerships; Accounts; designated sales and distribution support; Heart & Wellness. These roles support the editorial plan and retain their existing reporting lines.\n\n## Roles and responsibilities\n\n| Role | Responsibilities and decisions | Working arrangement |\n|---|---|---|\n| Director of Creative Practice | Agrees publishing priorities, resources and appointments with the editor; resolves resource conflicts and connects publishing to the wider programme. | Continuing role. |\n| Editor / Publishing Lead | Shapes the editorial programme, develops manuscripts with authors, coordinates review and checks sources, credit and permissions. Owns editorial quality within the agreed brief and budget. | Retained or appointed per title or series initially. |\n| Authors & contributors | Develop original work, supply accurate source and credit information, respond to editorial feedback and agree permissions for their contribution. | Commissioned or agreed contributor arrangements per publication. |\n| Editorial specialists | Provide subject review, language editing and translation according to the title’s needs and editorial standards. | Commissioned specialists coordinated by the editor. |\n| Programme coordination | Maintains schedules, contributor coordination, budget tracking and delivery follow-up; connects publishing with originating programmes. | Permanent coordinator initially, with additional project support where required. |\n| Design & Communications | Develops publication design and works with illustrators and production suppliers; coordinates promotion, launches and audience communication. The editor reviews editorial presentation. | Shared design capacity plus commissioned design, illustration or production support as needed. |\n| Community engagement and outreach | Builds contributor and community relationships, supports accessible participation and helps publications reach intended readers. Credit, consent and editorial permissions remain with the editor and contributors. | Year 1 coordinator and relevant programme owners; dedicated outreach role when justified. |\n| Fundraising & Partnerships | Develops appropriate publishing partnerships, grants and sponsorship proposals with the editor and Director. | Retained or shared fundraising support. |\n| Sales and distribution support | Plans routes to readers, handles orders and stock, and coordinates free or paid distribution and launch availability. | A named project responsibility; the initial allocation remains to be agreed. |\n| Accounts | Supports production-cost records, invoices, payments, sales receipts and financial reporting. | Existing Accounts Team; commitments approved by authorised entity representatives. |\n| Heart & Wellness | Supports welcome, team check-ins, recognition, listening and practical care across the programme. Flags workload pressures and supports follow-through with the relevant leads. | Shared named coordinator with allocated time, accountable to the Director. Every lead retains responsibility for respectful working and realistic workloads. |\n\n## Publishing formats\n\n- Research papers, essays, field notes and working publications.\n- Residency journals, artists’ books and experimental editions.\n- Exhibition catalogues and festival readers.\n- Craft documentation, oral histories and community-authored publications.\n- Learning resources, toolkits and field guides.\n- Zines, digital editions, audio publications and interactive formats.\n- Commissioned or partner-supported publications with an agreed editorial brief.\n\n## Working arrangements\n\nStart with a small, funded editorial programme. The number and type of Year 1 titles remain to be agreed. Programme owners contribute subject knowledge and originating material; the Editor / Publishing Lead holds editorial responsibility.\n\nEvery title has a named editorial owner, intended readership, format, budget and distribution plan. Decide whether it will be free, sold, commissioned or supported by a partner. Publishing income does not remove its research or cultural purpose.\n\nBudget explicitly for editing, design, review, translation, production, outreach and distribution as relevant. Increase retained editorial time only as the funded programme grows; these functions do not require separate permanent hires at the outset.\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, inclu
