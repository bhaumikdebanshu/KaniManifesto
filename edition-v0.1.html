<script>window.KANI_BOOTSTRAP = {"chapters": [{"id": "home", "title": "Kani Home", "group": "Home", "file": "home.md", "description": "Creative practice, research and public exchange. A shared direction for the programmes we build and the people who make them possible."}, {"id": "framework", "title": "Programme framework", "group": "Programme Framework", "file": "framework.md", "description": "How the ethos, pillars, people and platforms fit together."}, {"id": "research", "title": "Research, Residencies & Learning", "group": "Programme Framework", "file": "research.md", "description": "Develop knowledge, creative practices, skills and new ways of working."}, {"id": "creative-experiences", "title": "Creative Experiences", "group": "Programme Framework", "file": "creative-experiences.md", "description": "Bring people together through encounters with art, culture, ideas and making."}, {"id": "commercial", "title": "Commercial Experiences & Space Hire", "group": "Programme Framework", "file": "commercial.md", "description": "Earn income through commissioned experiences, spaces and creative hospitality."}, {"id": "outreach", "title": "Outreach & Community Engagement", "group": "Programme Framework", "file": "outreach.md", "description": "Relationships, participation and continuity across the three pillars."}, {"id": "entities", "title": "Enabling entities", "group": "Governance", "file": "entities.md", "description": "The organisations that enable the work."}, {"id": "council", "title": "Advisory & Programme Council", "group": "Governance", "file": "council.md", "description": "Seven advisory areas. One-year appointments, reviewed annually."}, {"id": "decisions", "title": "Decision rights", "group": "Governance", "file": "decisions.md", "description": "Clear ownership for direction, creative decisions and delivery."}, {"id": "year-one", "title": "Year 1 · Minimum team", "group": "Working Team", "file": "year-one.md", "description": "Three permanent hires, existing teams and defined specialist support."}, {"id": "full-structure", "title": "Full structure", "group": "Working Team", "file": "full-structure.md", "description": "Dedicated capacity as programmes and recurring work grow."}, {"id": "growth", "title": "How the team grows", "group": "Working Team", "file": "growth.md", "description": "Add people in response to sustained work and funding."}, {"id": "infrastructure", "title": "Shared infrastructure & capabilities", "group": "Shared Infrastructure", "file": "infrastructure.md", "description": "Spaces, equipment and services supporting all programmes."}, {"id": "platforms", "title": "Platforms & Original Initiatives", "group": "Platforms & Original Initiatives", "file": "platforms.md", "description": "Recognisable programmes with their own identity, brief and creative lead."}, {"id": "kani-fest", "title": "Kani Fest", "group": "Platforms & Original Initiatives", "file": "kani-fest.md", "description": "A fresh curatorial proposition for each festival edition."}, {"id": "publications", "title": "Kani Publications", "group": "Platforms & Original Initiatives", "file": "publications.md", "description": "A year-round publishing programme across the three pillars."}, {"id": "marketplaces", "title": "Curated Marketplaces", "group": "Platforms & Original Initiatives", "file": "marketplaces.md", "description": "Artisans, makers, demonstrations and public exchange."}, {"id": "new-initiatives", "title": "Developing new initiatives", "group": "Platforms & Original Initiatives", "file": "new-initiatives.md", "description": "Pilot, learn and establish what deserves to continue."}, {"id": "open-decisions", "title": "Open decisions", "group": "Review & Editing", "file": "open-decisions.md", "description": ""}, {"id": "version-history", "title": "Version history & feedback", "group": "Review & Editing", "file": "version-history.md", "description": "A record of how the thinking develops."}, {"id": "document-plan", "title": "Document review checklist", "group": "Review & Editing", "file": "document-plan.md", "description": ""}, {"id": "editing", "title": "How to edit and share", "group": "Review & Editing", "file": "editing.md", "description": ""}], "settings": {"title": "Kani Home", "repository": "bhaumikdebanshu/KaniManifesto", "branch": "main", "version": "v0.1", "stage": "Alpha", "updated": "2 November 2026", "kicker": "An evolving manifesto"}, "content": {"home": "## Our ethos\n\n**Proposed wording for review:**\n\nKani Home is a place for creative practice, research, learning and public exchange. It brings artists, designers, architects, researchers, craftspeople, musicians, ecologists, climate practitioners, heritage specialists, technologists and communities into conversation, creating space for both sustained enquiry and shared experiences.\n\nIts work is guided by:\n\n- **Community participation:** Develop programmes with local people, practitioners and knowledge holders.\n\n- **Experimentation:** Support exploration, making, testing and work whose outcomes are not predetermined.\n\n- **Ecological responsibility:** Engage with climate, water, materials and the relationships between people and their environments.\n\n- **Exchange across disciplines:** Connect art, design, craft, music, research and technology.\n\n- **Continuity of knowledge:** Document, publish and share work so that learning continues beyond an event or residency.\n\n- **Sustainable operation:** Develop earned income and external support that sustain the place, its people and its programme.\n\n## How we work together\n\nKani brings different disciplines and forms of knowledge into shared enquiry. An artisan, technologist, researcher and local community might shape a project together, each influencing its questions, methods and outcomes. The three pillars give this work a structure while allowing projects to move between learning, public exchange and commissioned experiences.\n\n[Outreach & Community Engagement](#outreach) builds the continuing relationships that make this participation possible, from listening and co-developing ideas to supporting access and following up after a programme.\n\n## Start with the structure\n\nThree pillars guide the work. A council with annually reviewed appointments contributes expertise. A continuing team turns ideas into programmes, supported by shared spaces and resources.\n\n- [Meet the advisory roles](#council)\n- [Explore the Year 1 team](#year-one)\n- [See the programme platforms](#platforms)\n\n## Working status\n\n**Status:** An evolving proposal for discussion and collective development.\n\nThis manifesto sets out a proposed direction; the [Open Decisions](#open-decisions) section identifies what still needs collective agreement.\n\nSee [Version history & feedback](#version-history) for previous editions and the reasons behind changes.\n", "framework": "## How the organisation fits together\n\n| Layer | What it explains |\n|---|---|\n| Ethos | The values that guide Kani’s choices. |\n| Three pillars | The broad kinds of activity Kani undertakes. |\n| Outreach & Community Engagement | How Kani builds relationships, listens, enables participation and sustains connections across its programmes. |\n| Advisory & Programme Council | The expertise, relationships and strategic guidance supporting the work. |\n| Permanent working team | The people responsible for continuity, development and delivery. |\n| Shared infrastructure & capabilities | The spaces, equipment and services available to every programme. |\n| Platforms & Original Initiatives | The recognisable programmes Kani develops, including Kani Fest, Kani Publications and curated marketplaces. |\n\nPlatforms bring the pillars into practice, drawing on a shared team and infrastructure. Outreach is a continuing function across the three pillars, with responsibilities assigned to the working team.\n\nThe pillar chapters describe possible activities. Year 1 priorities will be selected according to capacity, partnerships and funding.\n\n## How a project moves across the pillars\n\nThe ethos supports transdisciplinary enquiry: people with different practices and forms of knowledge shape the questions, methods and outcomes together. The pillars describe the different activities through which that enquiry can develop.\n\n**Example:** An artisan, technologist and local knowledge holders develop an AR heritage prototype during a residency. It is shared through a public walk and documented in a publication. An institution may later commission a related learning experience. The enquiry connects research and learning, public exchange and commissioned work; publishing carries its knowledge across all three.\n\nRead [How we work together on Home](#home) and the [Outreach & Community Engagement approach](#outreach).\n", "research": "Develop knowledge, creative practices, skills and new ways of working.\n\n| Activity area | Possible activities |\n|---|---|\n| Residencies & fellowships | Artist, designer and researcher residencies; interdisciplinary collaborations; supported periods of enquiry and practice development. |\n| Ecology & futures research | Water, climate, local ecologies, sustainability and speculative futures. |\n| Craft & material innovation | Artisan collaborations, material experiments, craft processes, sustainable production and documentation. |\n| AI, AR & emerging technologies | Creative AI, local-language tools, augmented-reality interpretation, interactive media, physical computing and critical enquiry into technology’s social implications. |\n| Living knowledge & archives | Oral histories, community-led archives, craft documentation and digital storytelling. |\n| Learning & skills exchange | Mentorship, student programmes, educational partnerships, field schools, workshops and hands-on research labs. |\n| Research publication & dissemination | Essays, papers, field notes, toolkits and other research outputs developed through Kani Publications. |\n\nResearch programmes can produce exhibitions, performances, publications, prototypes and public discussions. Appropriate specialists are engaged per project; emerging technology work does not initially require a permanent technology department.\n", "creative-experiences": "Bring people together through public encounters with art, culture, ideas and making.\n\n| Activity area | Possible activities |\n|---|---|\n| Kani Fest | An interdisciplinary festival with curators appointed for each edition. |\n| Exhibitions & open studios | Art, design, installations, work-in-progress presentations and residency outcomes. |\n| Music, performance & poetry | Baithaks, concerts, theatre, readings, experimental sound and audiovisual collaborations. |\n| Film & public conversations | Screenings, filmmaker discussions, talks, panels and debates. |\n| Workshops & heritage walks | Participatory making, demonstrations and walks developed with local knowledge holders. |\n| Curated marketplaces | Selected artisans and makers, themed editions, demonstrations, workshops and associated cultural programming. |\n| Publication encounters | Book launches, readings, editorial conversations and exhibitions connected to Kani Publications. |\n\nTicketed public events and curated marketplaces remain within Creative Experiences. Charging for participation does not automatically move a programme into the commercial pillar.\n", "commercial": "Generate earned income through hospitality, spaces and commissioned experiences.\n\n| Activity area | Possible activities |\n|---|---|\n| Corporate retreats & offsites | Residential or day programmes combining meetings, stays and creative experiences. |\n| Commissioned experiences | Tailored craft, culture and creative-learning programmes for clients and institutions. |\n| Gallery & event-space hire | Client exhibitions, presentations and private events. |\n| Screening & AV-room hire | Private screenings, presentations and facilitated sessions. |\n| Office & meeting-space hire | Workspace, conference rooms and short-term team bookings. |\n| Creative hospitality & stays | Guest stays, catering and residential programme packages tied to creative, cultural or learning experiences. |\n| Commissioned publications | Partner-supported or commissioned editions developed with Kani Publications under an agreed editorial brief. |\n\nEach commercial engagement has an agreed scope, price, delivery owner and allocation of space and staff. Public-interest programming and commercial bookings share a coordinated calendar.\n", "outreach": "## Purpose\n\nOutreach is a continuing responsibility across all three pillars. It builds relationships, helps Kani understand what people need, and creates ways for people to participate in shaping its work. Communications helps people hear about a programme; outreach helps them find a way into it and influence it.\n\n## Relationships and responsibilities\n\n| Area | What we do | Who leads |\n|---|---|---|\n| Local relationships | Meet neighbourhood groups, craftspeople, educators and cultural practitioners; listen to their interests and develop activities together. | Programme team; Programme & Operations Coordinator in Year 1. |\n| Participation and access | Reach potential residents and participants; explain opportunities; identify barriers such as language, cost, timing or accessibility. | Named programme owner, supported by communications and outreach coordination. |\n| Audience development | Build relationships with groups likely to attend, invite them personally and encourage repeat participation beyond one event. | Design & Communications, alongside programme owners. |\n| Institutional connections | Develop exchanges and joint programmes with schools, colleges, cultural organisations and research institutions. | Director and relevant programme owner, with the partnerships lead where needed. |\n| Funding and commercial relationships | Approach funders, sponsors, offsite clients and venue users with relevant proposals. | Fundraising & Partnerships / Commercial & Bookings. |\n\n## Four working commitments\n\n1. **A named owner.** Every programme identifies who handles outreach and maintains the relationships afterwards. Programme owners remain responsible for commitments made to participants.\n2. **Time and budget.** Outreach begins while a programme is being developed. Budgets allow for visits, translation, travel and participation support where needed.\n3. **A shared relationship record.** Record conversations, interests, commitments and follow-ups, with consent for ongoing contact. Contact details are held in an appropriate internal record, not this public document.\n4. **A feedback loop.** Ask what worked, who was missing and what should change. Review repeat participation, collaborations and participant experience alongside attendance and communication reach.\n\n## Year 1 and growth\n\nThe **Director of Creative Practice** is accountable for the overall approach and supports key relationships. The **Programme & Operations Coordinator** coordinates local relationships, participation support and follow-up. The **Design & Communications Associate** leads audience communication with programme inputs. The retained fundraising lead handles funding relationships and relevant institutional partnerships.\n\nAllocate working time for these responsibilities. A busy festival, residency or marketplace must budget for additional outreach support when the permanent team cannot carry it.\n\nAs recurring work and funding justify it, a **Community Engagement & Outreach Coordinator** reports to the Director and works across the pillars. This role maintains continuity between programmes; programme owners still own their briefs, budgets and commitments.\n\n## Across the platforms\n\n- **Kani Fest:** Co-develop relevant participation with local groups, plan invitations and access, and maintain relationships after the edition.\n- **Kani Publications:** Invite contributors and community knowledge holders, agree credit and permissions, and plan how publications reach their intended readers.\n- **Curated Marketplaces:** Build sustained artisan and maker relationships, support applications and participation, and gather feedback after each edition. Curatorial selection remains with the Marketplace Curator.\n\nProgramme reviews record what was heard, what changed in response and who will follow up. See [Decision rights](#decisions) for the boundaries between outreach, creative selection and financial approval.\n", "entities": "The entities enable the work; the pillars describe activities. These are proposed operating remits, to be aligned with the entities’ actual mandates and approvals.\n\n| Entity | Proposed contribution |\n|---|---|\n| Seed of Unity Foundation — SoUF | Community, education, supported research, fellowships and public-interest programmes. |\n| Kashmir Innovation Labs — KiLab | Craft, material research, documentation, innovation and related collaborations. |\n| M/s Kani Home | Commercial experiences, space hire, hospitality and accommodation. |\n\nEvery project identifies its lead entity, budget and authorised signatory. Operational coordination under the Director does not replace the financial and contractual authority of the relevant entity.\n", "council": "## Purpose\n\nThe council helps establish annual direction and priorities, contributes expertise, mentors practices and opens relationships. Senior advisors support the working team through key conversations and defined commitments. Day-to-day execution rests with staff and commissioned collaborators.\n\n## Seven advisory areas\n\nThe areas describe expertise, not named individuals or separate departments. Each area may have one or two members, depending on the expertise and support needed. Where two members share an area, they agree how to divide responsibilities and coordinate their contribution. Seven advisory areas can therefore have between seven and fourteen members when all areas are filled.\n\n| Advisory role | Main contribution |\n|---|---|\n| Art & Cultural Practice | Visual arts, film, exhibitions, artistic development and cultural relationships. |\n| Design, Systems & Technology | Programme formats, organisational systems, experiences, shared tools and infrastructure, and emerging technologies. |\n| Research, Learning & Publishing | Research direction, academic relationships, educational programmes and editorial standards. |\n| Sound & Music | Music programming, sound practices, practitioner networks and interdisciplinary collaborations. |\n| Craft, Heritage & Community | Artisan relationships, local knowledge, heritage, craft innovation and community participation. |\n| Business & Enterprise | Commercial models, pricing, retreats, bookings and market relationships. |\n| Fundraising & Resource Development | Grants, CSR relationships, sponsorships, philanthropy and institutional funding. |\n\nInstitutional partnerships are a shared responsibility across the council. Membership should include at least two people deeply connected to Kashmir’s communities and practices. Invite additional specialists for particular enquiries rather than expanding the standing council for every discipline.\n\n## Appointments and accountability\n\n- Council members serve one-year terms. Membership is reviewed annually, and appointments may be renewed.\n\n- The annual review considers contribution, agreed commitments, continuity and the expertise needed for the next year.\n\n- One member serves as Convenor for one year, coordinating agendas and follow-up without an additional artistic veto.\n\n- Each member has a written remit, agreed time commitment and compensation arrangement.\n\n- Each member undertakes a small set of concrete commitments, such as introducing partners, mentoring a project or helping develop a programme.\n\n- Departing members document commitments and hand over relationships to the working team.\n\n## Working method and disagreements\n\nHold quarterly planning and review meetings, with shorter project conversations as needed. The Director attends; relevant staff and platform leads join for their items. The Programme & Operations Coordinator initially provides light secretariat support.\n\nBring concrete proposals stating purpose, audience, owner, cost, funding source and demands on space and staff. Discuss them against the mission, local relevance, creative or learning value, feasibility and what they would displace.\n\n**Voting proposal for collective review:** Seek agreement before voting. Each advisory area has one vote, whether it has one or two members. Members sharing an area agree their position; if they cannot agree, that area abstains. A quorum requires at least five advisory areas represented, with at least four affirmative area votes for a council-level decision. Conflicted members declare their interest and step out. Confirm how vacancies, shared-area conflicts and recusals affect representation before adopting this procedure; if a valid quorum cannot be established, defer the decision. This procedure remains an open decision for the group.\n\nRecord decisions, reasons, owners and next actions. Routine programme delivery proceeds within delegated authority and does not await council votes.\n", "decisions": "| Decision | Responsible role |\n|---|---|\n| Overall direction and annual priorities | Council collectively, informed by the Director and working team. |\n| Year-round programme, staff allocation and operational commitments | Director of Creative Practice, within delegated authority. |\n| Festival artistic selections | Festival Curator, within the agreed brief and budget. |\n| Publication editorial development and quality | Editor / Publishing Lead, within the agreed publishing brief and budget. |\n| Marketplace theme and participant selection | Marketplace Curator, within the agreed programme brief. |\n| Outreach strategy and key institutional relationships | Director, informed by programme owners and community feedback. |\n| Community relationships, participation support and follow-up | Programme & Operations Coordinator in Year 1; dedicated outreach coordinator when appointed, working with the named programme owner. |\n| Audience communication and development | Design & Communications, alongside programme owners and outreach coordination. |\n| Project schedules, participant coordination and delivery follow-up | Named programme manager or coordinator. |\n| Technical feasibility, venue readiness and production methods | Operations / Production Lead or the coordinator with appointed technical specialists. |\n| Funding proposals and funder relationships | Fundraising lead/manager with Director, programme and accounts inputs. |\n| Commercial proposals and bookings | Named commercial owner within approved pricing and booking rules. |\n| Contracts and financial commitments | Authorised representatives of the relevant entity. |\n\nWhen scope exceeds agreed resources, the relevant creative lead and Director revise the proposal or seek additional support. Council endorsement alone does not authorise spending.\n\nEvery project has one named owner and a clear budget, including when it connects pillars or platforms. For shared projects, agree who owns each deliverable and how budgets and handovers are coordinated.\n\nThe council’s proposed voting method gives one vote to each advisory area, regardless of whether it has one or two members. It remains subject to collective agreement; see [Council appointments and decision procedure](#council) and [Open Decisions](#open-decisions).\n", "year-one": "Begin with a small permanent team, supported by existing staff and funded specialist appointments. Add continuing roles as programmes, workload and resources grow.\n\nStart with **three permanent hires**, supported by the existing accounts and hospitality teams and a defined budget for retained and project expertise.\n\n## Director of Creative Practice\n\nThe single operational head of the working team.\n\n- Leads the year-round programme across the three pillars.\n\n- Is accountable for outreach and community engagement, supporting key relationships and reviewing participation and access.\n\n- Works with the council on priorities, partnerships and institutional development.\n\n- Holds the overall calendar, resource plan and programme budget within delegated authority.\n\n- Commissions curators, editors, mentors and other specialists.\n\n- Leads key fundraising relationships with retained support.\n\n- Develops and reviews platforms and original initiatives.\n\n## Roles reporting to the Director\n\n| Role | Initial responsibilities |\n|---|---|\n| Programme & Operations Coordinator | Shared calendar, resident and artist liaison, local community relationships, participation support and follow-up; production logistics, vendor coordination, commercial enquiries and booking follow-up; coordination with accounts and hospitality. |\n| Design & Communications Associate | Graphics, social media, programme announcements, audience communication and development with programme owners, presentations and documentation coordination. An early-career role with independent working ability. |\n| Existing Accounts Team | Invoicing, payments, records, expenditure tracking and financial reporting inputs. Entity approval powers remain separate. |\n| Existing Hospitality Team | Accommodation, guest arrivals, room readiness, catering arrangements, routine venue visits and visitor support. |\n\nThe Director is one of the three new permanent hires. Existing accounts and hospitality capacity is additional to those three hires.\n\n## Retained, rotating and project basis\n\n| Support role | Starting arrangement |\n|---|---|\n| Fundraising & Partnerships Lead | Part-time retainer with defined deliverables, reporting to the Director. Develops grants, CSR opportunities, sponsors, donors and institutional relationships. |\n| Proposal & Grant Writer | Commissioned for selected applications and reports; coordinated by the fundraising lead. Can be the same person where skills and capacity allow. |\n| AV Technician | Scheduled event support and maintenance visits. Train an existing staff member for basic playback and equipment checks. |\n| Student Design Intern | Paid, supervised placement under the Design & Communications Associate, with defined learning outcomes. |\n| Senior Design Mentor | Occasional support for visual direction, review and development of the associate. |\n| Festival Curator, track curators & producer | Fixed-term appointments funded through each festival edition. |\n| Editor / Publishing Lead | Retained or appointed per publication or series, supported by commissioned editorial specialists. |\n| Marketplace Curator | Contract across a series of editions, supported by the permanent coordinator. |\n| Residency mentors & facilitators | Appointments against each programme’s budget, including researchers, artists, educators, creative technologists and local knowledge holders. |\n| Specialist production partners | Sound, lighting, fabrication, installation, photography, video and event crew as required. |\n\nStart with a manageable calendar. A festival or publication deadline must carry its additional staffing cost rather than simply being added to the coordinator’s existing workload.\n\n## Outreach capacity\n\nThe coordinator maintains the shared relationship record and follows up on programme feedback, while the Director supports key relationships. Allocate time for this work and fund additional outreach support during busy programmes. There is no additional permanent outreach hire in the initial three-person team. See [Outreach & Community Engagement](#outreach).\n", "full-structure": "| Area | Role | Core responsibility |\n| --- | --- | --- |\n| Programme management | Programme Manager — Research, Residencies & Learning | Owns residencies, fellowships, research, educational relationships and participant support. |\n| Programme management | Programme Manager — Creative Experiences | Owns the public calendar and delivery coordination for exhibitions, music, film, workshops, walks, marketplaces and Kani Fest. |\n| Community engagement | Community Engagement & Outreach Coordinator | Maintains local relationships, coordinates participation and access, supports programme outreach and follows up on feedback across the pillars. |\n| Fundraising, partnerships and commercial development | Fundraising & Partnerships Manager | Owns the funding strategy and pipeline, funder relationships, grants, CSR partnerships, sponsorships, donors and institutional collaborations. |\n| Fundraising, partnerships and commercial development | Commercial & Bookings Executive | Manages enquiries, proposals, quotations, site visits, follow-up, confirmed bookings and client relationships. |\n| Fundraising, partnerships and commercial development | Proposal & Grant Writer | Develops applications, concept notes, CSR and sponsorship proposals, pitch material and narrative reports. |\n| Operations and technical delivery | Operations / Production Lead | Owns venue readiness, the master venue calendar, logistics, maintenance coordination, vendors and on-site delivery. |\n| Operations and technical delivery | AV & Technical Operator | Operates sound, projection and screening systems, maintains equipment and coordinates with specialist vendors. |\n| Design and communications | Design & Communications Lead | Owns visual communication, social media planning, audience outreach, announcements, newsletters, presentations and signage across all programmes. |\n| Design and communications | Student Design Intern | Supports production through a supervised rotating placement. |\n| Existing support teams | Accounts Team | Supports project owners and fundraising staff while retaining entity-specific approval procedures. |\n| Existing support teams | Hospitality Team | Works with production, programme and bookings staff on delivery. |\n\nAll continuing roles sit within one permanent working team led by the **Director of Creative Practice**. This is a growth model; appointments follow recurring need and funding rather than being simultaneous Year 1 hires.\n\n## Programme management\n\n- **Programme Manager — Research, Residencies & Learning:** Owns residencies, fellowships, research, educational relationships and participant support. Shapes the research and learning pipeline, from developing opportunities and selecting participants to coordinating mentors, partners and outcomes. Ensures participants receive clear support and that learning is documented and shared.\n\n- **Programme Manager — Creative Experiences:** Owns the public calendar and coordinates delivery for exhibitions, music, film, workshops, walks, marketplaces and Kani Fest. Works with the Programme Manager — Research, Residencies & Learning when projects produce public events, ensuring that each project has one named owner and clear delivery responsibilities.\n\nBoth report to the Director. Where a residency produces a public event, the two managers agree the handover and responsibilities for each part.\n\n## Community engagement and outreach\n\n**Community Engagement & Outreach Coordinator — reports to the Director**\n\nMaintains local and community relationships across programmes, coordinates participation and access support, keeps the shared relationship record and follows up on feedback. Works with programme managers on co-development and with Design & Communications on audience development. Programme owners retain responsibility for creative briefs, budgets, selections and commitments.\n\nIn Year 1 these duties are allocated to the Programme & Operations Coordinator with Director support. Establish the dedicated role when recurring relationships and participation work exceed that capacity and funding can sustain it. See [Outreach & Community Engagement](#outreach).\n\n## Fundraising, partnerships and commercial development\n\n**Fundraising & Partnerships Manager — reports to the Director**\n\nThis operational role works alongside the Advisory & Programme Council’s **Fundraising & Resource Development** advisory role. The advisor provides strategic guidance and relationships; the Manager owns day-to-day fundraising delivery, partnerships and reporting.\n\nOwns the funding strategy and pipeline, funder relationships, grants, CSR partnerships, sponsorships, donors and institutional collaborations. Oversees commercial development and coordinates funder reporting.\n\nReporting to this manager:\n\n- **Commercial & Bookings Executive:** Enquiries, proposals, quotations, site visits, follow-up, confirmed bookings and client relationships.\n\n- **Proposal & Grant Writer:** Applications, concept notes, CSR and sponsorship proposals, pitch material and narrative reports. Can remain external or retained.\n\nProgramme managers design and deliver funded activities and collect outcome evidence. Accounts supplies expenditure records and financial reporting. The Fundraising Manager coordinates the combined report and funder relationship.\n\n## Operations and technical delivery\n\n**Operations / Production Lead — reports to the Director**\n\nOwns venue readiness, the master venue calendar, logistics, maintenance coordination, vendors and on-site delivery.\n\n- **AV & Technical Operator — reports to the Operations Lead:** Operates sound, projection and screening systems, maintains equipment and coordinates with specialist vendors.\n\n- External production partners provide additional capacity per project.\n\n## Design and communications\n\n**Design & Communications Lead — reports to the Director**\n\nOwns visual communication, social media planning, audience outreach, announcements, newsletters, presentations and signage across all programmes.\n\n- **Student Design Intern — reports to the Design Lead:** Supports production through a supervised rotating placement.\n\n- Programme owners provide accurate information; the communications lead coordinates public-facing editing and approval.\n\n- Editors own publication manuscripts and editorial quality. Publication design is planned with the design team.\n\n- Photography, recording and editing receive allocated time or commissioned support.\n\n## Existing support teams\n\n- **Accounts Team:** Operationally coordinated under the Director; works with project owners and fundraising staff while retaining entity-specific approval procedures.\n\n- **Hospitality Team:** Operationally coordinated under the Director; works with production, programme and bookings staff on delivery.\n", "growth": "Growth follows recurring work and funding rather than a fixed hiring sequence.\n\n| Trigger | Staffing response |\n|---|---|\n| Credible funding opportunities require sustained follow-up. | Make Fundraising & Partnerships Manager permanent. |\n| Residencies, public programmes and commercial hires regularly overlap. | Separate programme management from operations/production coordination. |\n| Community relationships, participation support and follow-up become sustained work beyond the programme coordinator’s capacity. | Add a Community Engagement & Outreach Coordinator reporting to the Director, with recurring funding and a defined cross-programme remit. |\n| Technical activity becomes frequent and predictable. | Bring in a permanent AV & Technical Operator. |\n| Commercial enquiries and bookings become a substantial recurring business. | Add a Commercial & Bookings Executive under Fundraising & Partnerships. |\n| Research and public programmes each sustain a funded calendar. | Create dedicated managers for Research, Residencies & Learning and Creative Experiences. |\n| Publication work becomes a sustained, funded annual programme. | Expand the editor’s retained time; consider a continuing publishing role only when justified. |\n| Festival or marketplace peaks exceed normal capacity. | Add temporary producers, coordinators and crew through the relevant programme budget. |\n\nBefore each permanent addition, confirm recurring need, a clear reporting line and visibility of funding for the role’s full cost over the following 12 months. This is a proposed planning rule, not a commitment to hire.\n", "infrastructure": "This layer shows what every programme can draw on. It does not create additional posts or duplicate the permanent team.\n\n| Shared capability | Resources and services | Responsible roles |\n|---|---|---|\n| Spaces | Level 1 gallery with track lights and four movable walls; Level 2 screening/AV room; Level 3 office and meeting facilities; guest house accommodating up to 15 people. | Programme & Operations Coordinator initially; Operations Lead as the team grows; hospitality for stays. |\n| Technical infrastructure | Sound, projection, lighting, connectivity, equipment operation and upkeep. | Scheduled AV technician initially; permanent AV Operator when justified. |\n| Production | Installation, fabrication coordination, event logistics, procurement and specialist vendors. | Coordinator initially; Operations / Production Lead at scale. |\n| Design, communications & audience support | Graphics, social media, publicity, registrations, mailing lists, signage and audience feedback. | Design & Communications role with programme inputs. |\n| Community relationships & participation support | Shared relationship records, consent for ongoing contact, access planning, partner follow-up and feedback learning. | Programme & Operations Coordinator initially; dedicated outreach coordinator when justified; programme owners retain responsibility for their commitments. |\n| Documentation & knowledge systems | Photography, recordings, archives, contributor information, consent and permissions records, publication files and programme learning. | Named programme owner, supported by communications, editors and commissioned documentation staff. |\n| Hospitality | Guest arrangements, accommodation, catering and visitor support. | Existing Hospitality Team. |\n| Finance & administration | Budgets, agreements, invoicing, payments, records and reporting inputs. | Programme owners and existing Accounts Team; authorised entity representatives approve commitments. |\n\nA shared planning meeting resolves competing demands on staff, spaces and equipment. Every request includes an owner, brief, deadline and budget.\n", "platforms": "## Purpose\n\nDevelop recognisable programmes through which Kani’s ethos and pillars take shape. A platform can continue across years while contributors, themes and editions change.\n\nAn original initiative can begin as a small experiment and become a continuing platform if its value, audience, workload and funding justify it.\n\n“Platforms & Original Initiatives” is the working title for this layer. Ownership and usage of particular works, brands and commissioned outputs are addressed through the relevant contributor agreements.\n\n## Platform overview\n\n| Platform | Relationship to the pillars | Creative lead |\n|---|---|---|\n| Kani Fest | Primarily Creative Experiences; draws on research, learning and partnerships. | Festival Curator appointed for each edition. |\n| Kani Publications | Works across all three pillars; publishes research, creative practice and appropriate commissioned work. | Editor / Publishing Lead on retainer or project appointment initially. |\n| Kani Curated Marketplaces | Primarily Creative Experiences; connects craft and material research with public exchange and maker livelihoods. | Marketplace Curator appointed for a series or edition. |\n| Future original initiatives | Assigned according to their purpose; may connect several pillars. | Named project lead appointed when the initiative is approved. |\n\nEach platform page includes a structure chart and a responsibilities table. The charts distinguish project reporting from shared support; retained and project appointments are not additional permanent Year 1 hires. [Outreach & Community Engagement](#outreach) supports participation across all platforms.\n\nThe Director oversees platform development and resource planning with council guidance. There is no separate permanent “IP creation” department in Year 1.\n", "kani-fest": "## Purpose\n\nAn interdisciplinary festival with a fresh curatorial proposition for each edition. The previous format was a 15-day community festival; future scope and duration are agreed against resources.\n\n## Structure chart\n\n```kani-chart\n- Director of Creative Practice | Agrees scope, resources and appointments\n  - Festival Curator | Artistic direction for the edition\n    - Arts & New Media Curator | Track programme\n    - Sound & Music Curator | Track programme\n    - Craft & Material Practices Curator | Track programme\n    - Film & Moving Image Curator | Track programme\n    - Assistant curators | Assigned to their respective track leads\n  - Festival Producer | Delivery plan and production coordination\n    - Edition delivery team | Appointed crew and programme support\n```\n\n**Chart key:** Solid connections show project accountability and creative or delivery direction. Track assistants work through their assigned curator. The curator and producer collaborate; neither automatically takes on the other’s responsibilities. Permanent staff retain the reporting lines in [Full Structure](#full-structure).\n\n> **Shared support — collaboration, not extra reporting lines:** Programme & Operations Coordinator in Year 1; Creative Experiences Programme Manager at scale; Operations / Production and AV; outreach; Design & Communications; Fundraising & Partnerships; Accounts; Hospitality. Their time and responsibilities are agreed in the edition plan.\n\n## Roles and responsibilities\n\n| Role | Responsibilities and decisions | Working arrangement |\n|---|---|---|\n| Director of Creative Practice | Agrees the brief, budget, staffing and infrastructure; appoints leads and resolves resource conflicts. Financial commitments follow entity authority. | Continuing role. |\n| Festival Curator | Develops the artistic proposition and programme; directs track curators; has final artistic say within the agreed brief and budget. | Rotating appointment for development, delivery and close-out. |\n| Arts & New Media Curator | Develops the arts and new-media track, selects and supports practitioners, and coordinates requirements with the producer. | Edition appointment reporting artistically to the Festival Curator. |\n| Sound & Music Curator | Develops music and sound programming, practitioner relationships and cross-disciplinary collaborations. | Edition appointment reporting artistically to the Festival Curator. |\n| Craft & Material Practices Curator | Develops craft, material and maker-led activities with practitioners and community partners. | Edition appointment reporting artistically to the Festival Curator. |\n| Film & Moving Image Curator | Develops screenings and moving-image work, contributor conversations and presentation requirements. | Edition appointment reporting artistically to the Festival Curator. |\n| Assistant curators / programme coordinators | Support research, artist liaison, schedules and track delivery. Each has an assigned lead and clear scope. | Appointed against track workload; artistic questions go through the relevant curator, delivery arrangements through the producer. |\n| Festival Producer | Coordinates the master delivery schedule, production budget tracking, vendors, crew and on-site delivery. Escalates feasibility and resource issues. | Project-funded appointment; reports on delivery to the Director and works alongside the Festival Curator. |\n| Edition delivery team | Executes assigned production, coordination and visitor-facing tasks against the approved delivery plan. | Temporary crew and allocated staff; project tasks coordinated by the producer. |\n| Programme continuity | Maintains calendar coordination, participant handovers, records and learning across editions. | Permanent coordinator in Year 1; Creative Experiences Programme Manager at scale. |\n| Operations / Production and AV | Checks feasibility and venue readiness; coordinates installation, sound, projection and technical operation with the producer. | Allocated staff and appointed technical specialists. |\n| Community engagement and outreach | Builds local relationships early, supports participation and access, and follows up after the edition. | Year 1 coordinator with Director support; dedicated outreach role when justified; additional edition support if needed. |\n| Design & Communications | Leads programme announcements, audience communication, visual material, signage and documentation coordination. | Shared team with edition-specific support as required. |\n| Fundraising & Partnerships | Develops funder and sponsor relationships and coordinates agreed reporting with programme and accounts inputs. | Retained support initially; dedicated manager as justified. |\n| Accounts and Hospitality | Accounts supports financial records and payments; hospitality coordinates guest stays, food and visitor services. | Existing shared teams. |\n\n## Working arrangements\n\nBegin preparation sufficiently early—typically the 6–9 month cycle discussed. The Director agrees scope, budget, staffing and infrastructure with the Festival Curator and producer. Appoint and combine track roles according to the programme and resources; the chart does not require every role to be a separate hire.\n\nPoetry, theatre, talks and interdisciplinary work are allocated explicitly within the curatorial brief. Collaborations may share budgets across tracks, with one named owner for each project.\n\nIn Year 1, the permanent coordinator works with a project-funded Festival Producer and temporary delivery team. At scale, the Creative Experiences Programme Manager provides continuity across editions, supported by Production and AV. Project appointments do not create extra permanent departments.\n\nEach edition budgets for outreach, documentation, evaluation and handover, including follow-up with participants and partners. See [Outreach & Community Engagement](#outreach).\n", "publications": "## Purpose\n\nA proposed year-round publishing imprint with its own editorial identity, serving work across all three pillars. “Kani Publications” is a working name.\n\n## Structure chart\n\n```kani-chart\n- Director of Creative Practice | Agrees publishing plan, resources and appointments\n  - Editor / Publishing Lead | Editorial direction and quality\n    - Authors & contributors | Develop the work with the editor\n    - Editorial specialists | Review, copy editing and translation as commissioned\n```\n\n**Chart key:** Solid connections show editorial project direction and accountability. Contributors and commissioned specialists work to an agreed editorial brief; they are not permanent staff reports. The editor owns editorial quality within the approved brief and budget.\n\n> **Shared support — collaboration, not extra reporting lines:** Programme coordination; Design & Communications; community engagement and outreach; Fundraising & Partnerships; Accounts; designated sales and distribution support. These roles support the editorial plan and retain their existing reporting lines.\n\n## Roles and responsibilities\n\n| Role | Responsibilities and decisions | Working arrangement |\n|---|---|---|\n| Director of Creative Practice | Agrees publishing priorities, resources and appointments with the editor; resolves resource conflicts and connects publishing to the wider programme. | Continuing role. |\n| Editor / Publishing Lead | Shapes the editorial programme, develops manuscripts with authors, coordinates review and checks sources, credit and permissions. Owns editorial quality within the agreed brief and budget. | Retained or appointed per title or series initially. |\n| Authors and contributors | Develop original work, supply accurate source and credit information, respond to editorial feedback and agree permissions for their contribution. | Commissioned or agreed contributor arrangements per publication. |\n| Reviewers, copy editors and translators | Provide subject review, language editing and translation according to the title’s needs and editorial standards. | Commissioned specialists coordinated by the editor. |\n| Programme coordination | Maintains schedules, contributor coordination, budget tracking and delivery follow-up; connects publishing with originating programmes. | Permanent coordinator initially, with additional project support where required. |\n| Design & Communications | Develops publication design and works with illustrators and production suppliers; coordinates promotion, launches and audience communication. The editor reviews editorial presentation. | Shared design capacity plus commissioned design, illustration or production support as needed. |\n| Community engagement and outreach | Builds contributor and community relationships, supports accessible participation and helps publications reach intended readers. Credit, consent and editorial permissions remain with the editor and contributors. | Year 1 coordinator and relevant programme owners; dedicated outreach role when justified. |\n| Fundraising & Partnerships | Develops appropriate publishing partnerships, grants and sponsorship proposals with the editor and Director. | Retained or shared fundraising support. |\n| Sales and distribution support | Plans routes to readers, handles orders and stock, and coordinates free or paid distribution and launch availability. | A named project responsibility; the initial allocation remains to be agreed. |\n| Accounts | Supports production-cost records, invoices, payments, sales receipts and financial reporting. | Existing Accounts Team; commitments approved by authorised entity representatives. |\n\n## Publishing formats\n\n- Research papers, essays, field notes and working publications.\n- Residency journals, artists’ books and experimental editions.\n- Exhibition catalogues and festival readers.\n- Craft documentation, oral histories and community-authored publications.\n- Learning resources, toolkits and field guides.\n- Zines, digital editions, audio publications and interactive formats.\n- Commissioned or partner-supported publications with an agreed editorial brief.\n\n## Working arrangements\n\nStart with a small, funded editorial programme. The number and type of Year 1 titles remain to be agreed. Programme owners contribute subject knowledge and originating material; the Editor / Publishing Lead holds editorial responsibility.\n\nEvery title has a named editorial owner, intended readership, format, budget and distribution plan. Decide whether it will be free, sold, commissioned or supported by a partner. Publishing income does not remove its research or cultural purpose.\n\nBudget explicitly for editing, design, review, translation, production, outreach and distribution as relevant. Increase retained editorial time only as the funded programme grows; these functions do not require separate permanent hires at the outset.\n", "marketplaces": "## Purpose\n\nA recurring public programme bringing selected artisans and makers together with demonstrations, workshops and cultural activity.\n\n**Working ambition:** Every two months, for 3–4 days, subject to staffing, funding and participant demand. Confirm the Year 1 frequency separately.\n\n## Structure chart\n\n```kani-chart\n- Director of Creative Practice | Overall resources and accountability\n  - Programme owner | Director in Year 1; Creative Experiences Programme Manager at scale\n    - Marketplace Curator | Theme, participant selection and accompanying programme\n    - Delivery coordinator | Edition schedule, participant logistics and follow-up\n```\n\n**Chart key:** Solid connections show programme and project accountability. In Year 1 the Director also holds programme ownership; that box is a responsibility, not another hire. The permanent Programme & Operations Coordinator initially coordinates delivery. The curator owns selection; delivery coordination does not override that remit.\n\n> **Shared support — collaboration, not extra reporting lines:** Operations / Production and AV; outreach; Design & Communications; Fundraising & Partnerships; Commercial & Bookings; Accounts; Hospitality. These teams retain their existing reporting lines.\n\n## Roles and responsibilities\n\n| Role | Responsibilities and decisions | Working arrangement |\n|---|---|---|\n| Director of Creative Practice | Agrees the series scope, resources and appointments; retains overall accountability. Holds programme ownership in Year 1. | Continuing role. |\n| Creative Experiences Programme Manager | At scale, owns the calendar, coordination and continuity of the marketplace platform; agrees handovers and tracks delivery. | Growth-stage role reporting to the Director; not an additional Year 1 hire. |\n| Marketplace Curator | Selects participants, develops themes and shapes demonstrations, workshops and cultural activities. Works with local practitioners and relevant council advisors. | Series or edition appointment. Creative selection rests with this role within the agreed brief. |\n| Delivery coordinator | Coordinates schedules, participant requirements, logistics and follow-up, escalating resource issues to the programme owner. | Programme & Operations Coordinator in Year 1; allocated or project-funded coordination as the platform grows. |\n| Operations / Production and AV | Plans layout, stalls, equipment, installation and technical support, with named on-site responsibilities. | Allocated team capacity and technical specialists. |\n| Community engagement and outreach | Builds sustained artisan and maker relationships, supports applications and access, and gathers participant feedback. Makes opportunities understandable; does not replace curatorial selection. | Year 1 coordinator with Director support; dedicated outreach role when justified. |\n| Design & Communications | Handles promotion, audience invitations, participant stories and programme information with consent and accurate credits. | Shared communications capacity. |\n| Fundraising & Partnerships | Develops appropriate sponsors and institutional partnerships with the programme owner. | Retained or shared fundraising support. |\n| Commercial & Bookings | Administers stall bookings and fees after curatorial selection, using approved terms. | Named responsibility within Year 1 coordination; dedicated bookings role as justified. |\n| Accounts | Supports fee receipts, invoices, payments and financial records. | Existing Accounts Team. |\n| Hospitality | Supports guest arrangements, food and visitor services against the edition plan. | Existing Hospitality Team. |\n\n## Working arrangements\n\nProgramme ownership sits within Creative Experiences. The Director holds that responsibility initially; the Creative Experiences Programme Manager provides continuity at scale. The Marketplace Curator can be appointed across a series, with delivery supported by the permanent team and additional project appointments when needed.\n\nConfirm frequency, stall arrangements, selection criteria, staffing, outreach and budget before committing to a Year 1 series. Fees and booking administration follow selection; they do not determine curatorial acceptance.\n\nAfter each edition, review participant experience, access, attendance, costs and maker feedback. Record what changes for the next edition and who maintains the relationships between events.\n", "new-initiatives": "Use a simple progression:\n\n1. Identify an enquiry, need or opportunity connected to the ethos and pillars.\n\n2. Define a small pilot with a named owner, audience, budget and outcome. Build outreach into its development: listen to intended participants, identify access needs and agree who maintains the relationships afterwards.\n\n3. Deliver and document the pilot.\n\n4. Review value, local relevance, participation, workload and financial viability.\n\n5. Repeat or revise where justified.\n\n6. Establish a continuing platform only when there is a clear reason and capacity to sustain it.\n", "open-decisions": "This edition incorporates the agreed drafting changes. The following questions still need collective agreement before they become operating commitments.\n\n- [ ] Review the ethos wording, three pillar titles and activity menus with the group.\n- [ ] Review the seven advisory areas and identify one or two members per area, with one-year appointments and annual review.\n- [ ] Agree the council voting procedure: the proposal is one vote per advisory area, a quorum of five areas and four affirmative area votes. Resolve vacancies, disagreements within an area, conflicts and recusals before adoption.\n- [ ] Confirm “Platforms & Original Initiatives” as the layer title and confirm working platform names, including the publishing imprint.\n- [ ] Choose a realistic Year 1 calendar, including festival scope, marketplace frequency and publication commitments and editorial focus.\n- [ ] Confirm outreach priorities, initial community and institutional relationships, allocated staff time and participation-support budgets.\n- [ ] Confirm Year 1 retainer and project-support budgets alongside the three permanent hires; agree platform staffing against actual programmes.\n- [ ] Confirm entity responsibilities and delegated financial authority.\n- [ ] Confirm how publishing sales and distribution will be administered initially.\n\nRecord presentation feedback as suggested, agreed or deferred in [Version history & feedback](#version-history). A suggestion is not an agreed operating decision.\n", "version-history": "## Current edition\n\n**v0.1 · Alpha — For discussion**  \n**Published:** 2 November 2026\n\nThis is the first numbered presentation edition. It records a direction for discussion, not a claim that every operating proposal has been collectively agreed.\n\n## Editions and changes\n\n| Edition | What changed | Why |\n|---|---|---|\n| v0.1 · Alpha · 2 November 2026 | “An evolving manifesto”; clearer transdisciplinary approach; outreach section and responsibilities across the structure; one-year council appointments with one or two members per area; Sound & Music title; charts and responsibilities for all three platforms; simpler status and review notes. | Prepare a coherent presentation edition and make relationships, responsibilities and the evolution of thinking easier to follow. |\n| Initial website · 1 November 2026 | The first online working document, before numbered editions. | Establish an editable, shared source. |\n\n[Read the preserved v0.1 Alpha edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.1.html).\n\n[Read the initial website snapshot](https://bhaumikdebanshu.github.io/KaniManifesto/edition-initial.html). Its content is also preserved in the [original repository commit](https://github.com/bhaumikdebanshu/KaniManifesto/tree/14fac9b564864435f37587fa36fc6e175b9512d5).\n\nSnapshots stay as they were published. The main website carries the latest edition.\n\n## Simple versioning\n\n| Version | When to use it |\n|---|---|\n| v0.1 · Alpha | This first presentation edition. |\n| v0.2 · Revised draft | A substantive revision following presentation feedback. Not yet published. |\n| v0.3 · Revised draft | A further meaningful round of discussion and changes. Not yet published. |\n| v1.0 · Agreed baseline | When the group agrees a structure to begin working with. It can still evolve. |\n\nDo not change the version for every typo. Increment it when the thinking, responsibilities or structure meaningfully changes. Record what changed, why and what remains unresolved; preserve the previous edition before publishing the next.\n\n## Presentation feedback\n\nNo presentation feedback has been recorded in this edition. For each item, record the suggestion, reason, affected pages, decision status, owner and next step.\n\n| Status | Meaning |\n|---|---|\n| Suggested | Raised for consideration; not an agreed change. |\n| Agreed | Accepted for the next revision, with an owner and affected pages identified. |\n| Deferred | Left open, with the reason or information needed to revisit it. |\n\nKeep unresolved operating questions in [Open Decisions](#open-decisions). Check related chapters before publishing an agreed revision; see the [Document review checklist](#document-plan).\n", "document-plan": "## Review one complete edition\n\nReview the manifesto, programme framework, advisory arrangements, team and platforms together. This prevents a change to one role from leaving contradictory responsibilities elsewhere.\n\n## Consistency checklist\n\n| When this changes | Also review |\n|---|---|\n| Ethos or pillars | Home, Programme Framework, pillar chapters, platform descriptions and open decisions. |\n| Advisory areas, appointments or voting | Council, Decision rights, overview text and open decisions. |\n| Outreach responsibilities | Outreach section, Year 1, Full Structure, Growth, shared capabilities and all platform role tables. |\n| Platform staffing or reporting | Platform chart, its responsibilities table, Year 1 support, Full Structure and Decision rights. |\n| A substantive agreed revision | Version label, version history, previous-edition snapshot, navigation, Markdown export and print view. |\n\nCharts distinguish reporting and project responsibility from shared support. Platform leads and advisors are not additional permanent hires in Year 1.\n\n## Review and publish\n\nCollect proposed edits, review them as a batch, then publish one coherent edition. Keep feedback as suggested, agreed or deferred. Preserve the presentation edition before incorporating feedback so readers can follow how the thinking changed.\n\nSee [Version history & feedback](#version-history) for the current edition and revision approach.\n", "editing": "## Edit a chapter\n\n1. Open the chapter you want to change.\n2. Click **Edit this chapter** in the top bar. It opens the corresponding Markdown file on GitHub.\n3. Sign in to GitHub and make your changes. Headings use `##`; tables use rows separated by vertical bars.\n4. Use GitHub’s Preview tab to check the text and table formatting.\n5. Select **Commit changes**, add a short description, and save to the publishing branch if you have permission.\n6. Wait for the Pages deployment to complete, then refresh this website.\n\nThe editor link appears once the site is hosted on GitHub Pages, or when the repository is set in `site.json`.\n\n## Let someone else contribute\n\nShare the website link for reading. Give selected collaborators repository write access if they should edit directly. Others can propose changes through GitHub pull requests. This is repository editing, not simultaneous Google Docs-style editing.\n\n## Tables and checklists\n\nThe site displays tables and checklists from the Markdown files. Make changes in the source file through **Edit this chapter**. Checkboxes on the reading page are intentionally read-only; use `- [x]` in the source to mark a decision complete.\n\n## Download or print\n\n**Download Markdown** combines the current chapters into a single editable document. **Print all** prepares every chapter for printing or saving to PDF.\n\n## One working source\n\nAfter publishing, the Markdown files in this GitHub repository are the website’s working source. The earlier ChatGPT Page and Obsidian folder do not automatically synchronise with it.\n\n## Visibility\n\nThe free public-repository setup makes the site and its source public. The site requests that search engines do not index it, but this is not access control. Anyone with the address can read it.\n\n## Versions and charts\n\nUse [Version history & feedback](#version-history) for substantive changes. The main website is the current working edition; the linked snapshots preserve earlier editions and should not be edited. Use **Print all** on a snapshot to save that edition as a PDF.\n\nPlatform charts are written as indented bullet lists inside a `kani-chart` code block in each platform’s Markdown file. Indentation defines the project hierarchy. The matching responsibilities table explains each role; shared support is listed separately beneath the chart. Update both when a reporting relationship changes.\n\nBefore publishing a substantive new edition, update the version and date in `site.json`, the history page and the preserved snapshot together. Follow the [Document review checklist](#document-plan).\n"}};</script>
<script>/* Kani Home — static, Markdown-backed reader. No credentials are stored here. */
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let chapters = [], settings = {}, current = null, routeVersion = 0, searchVersion = 0;
  const cache = new Map();
  const snapshot = document.documentElement.dataset.snapshot === 'true';
  const offline = location.protocol === 'file:' || snapshot;
  function chartFromText(text) {
    const figure=document.createElement('figure');figure.className='org-chart';
    const caption=document.createElement('figcaption');caption.textContent='Project structure';figure.append(caption);
    const root=document.createElement('ul');root.className='org-tree';figure.append(root);
    const lists=[root];let previous=null,depthBefore=0;
    for(const line of text.trimEnd().split('\n')) {
      if(!line.trim())continue;
      const match=line.match(/^( *)(?:- )(.+)$/);
      if(!match||match[1].length%2)return null;
      const depth=match[1].length/2;if(depth>6||depth>depthBefore+1||(!previous&&depth!==0))return null;
      if(depth>depthBefore){const children=document.createElement('ul');previous.append(children);lists[depth]=children;}
      const item=document.createElement('li'),card=document.createElement('div');card.className='org-node';
      const [title,...notes]=match[2].split('|');const strong=document.createElement('strong');strong.textContent=title.trim();card.append(strong);
      if(notes.length){const small=document.createElement('small');small.textContent=notes.join('|').trim();card.append(small);}
      item.append(card);lists[depth].append(item);previous=item;depthBefore=depth;
    }
    return root.children.length?figure:null;
  }
  const allowed = new Set('P BR HR STRONG EM DEL S BLOCKQUOTE UL OL LI H1 H2 H3 H4 H5 H6 TABLE THEAD TBODY TR TH TD CODE PRE A INPUT'.split(' '));
  function renderMarkdown(md) {
    const template = document.createElement('template');
    template.innerHTML = marked.parse(md, {gfm:true, breaks:false});
    const charts=[...template.content.querySelectorAll('pre > code.language-kani-chart')].map(code=>({pre:code.parentElement,chart:chartFromText(code.textContent)}));
    const clean = node => {
      for (const el of [...node.children]) {
        if (!allowed.has(el.tagName)) { el.remove(); continue; }
        const href = el.getAttribute('href'), checked = el.hasAttribute('checked');
        const align = el.getAttribute('align');
        for (const a of [...el.attributes]) el.removeAttribute(a.name);
        if (el.tagName === 'A' && href && (/^https?:\/\//i.test(href) || /^#[a-z0-9-]+$/i.test(href))) {
          el.setAttribute('href', href);
          if (/^https?:/i.test(href)) {el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer');}
        }
        if (el.tagName === 'INPUT') {el.type='checkbox';el.disabled=true;el.checked=checked;}
        if (['TH','TD'].includes(el.tagName) && ['left','right','center'].includes(align)) el.style.textAlign=align;
        clean(el);
      }
    };
    clean(template.content);
    for(const {pre,chart} of charts)if(chart)pre.replaceWith(chart);
    for(const table of template.content.querySelectorAll('table')) {
      const wrap=document.createElement('div');wrap.className='table-scroll';wrap.tabIndex=0;
      wrap.setAttribute('role','region');wrap.setAttribute('aria-label','Scrollable table');
      table.replaceWith(wrap);wrap.append(table);
    }
    return template.content;
  }
  async function readJSON(path) {
    const res=await fetch(path,{cache:'no-store'});if(!res.ok)throw Error(`Could not load ${path} (${res.status}).`);return res.json();
  }
  async function markdown(chapter) {
    if(cache.has(chapter.id))return cache.get(chapter.id);
    let text;
    if(offline) text=window.KANI_BOOTSTRAP.content[chapter.id];
    else {const r=await fetch(chapter.file,{cache:'no-store'});if(!r.ok)throw Error(`The chapter could not be loaded (${r.status}). Please refresh or check its Markdown file.`);text=await r.text();}
    cache.set(chapter.id,text);return text;
  }
  function repository() {
    if(settings.repository)return settings.repository;
    if(location.hostname.endsWith('.github.io')) {
      const owner=location.hostname.split('.')[0];
      const segment=location.pathname.split('/').filter(Boolean)[0];
      const repo=segment && !segment.endsWith('.html') ? segment : owner+'.github.io';
      return owner+'/'+repo;
    }
    return '';
  }
  function editURL(chapter) {
    const repo=repository();
    if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo))return null;
    return 'https://github.com/'+repo+'/edit/'+encodeURIComponent(settings.branch||'main')+'/'+chapter.file.split('/').map(encodeURIComponent).join('/');
  }
  function navLink(chapter) {
    const a=document.createElement('a');a.href='#'+chapter.id;a.textContent=chapter.title;a.dataset.chapter=chapter.id;return a;
  }
  function makeNavigation() {
    $('toc').replaceChildren();
    for(const c of chapters) {
      if(c.id==='home'){$('toc').append(navLink(c));continue;}
      let group=[...$('toc').querySelectorAll('details')].find(d=>d.dataset.group===c.group);
      if(!group){group=document.createElement('details');group.dataset.group=c.group;const summary=document.createElement('summary');summary.textContent=c.group;const list=document.createElement('div');list.className='subnav';group.append(summary,list);$('toc').append(group);}
      group.querySelector('.subnav').append(navLink(c));
    }
  }
  function closeMenu() {document.body.classList.remove('menu-open');$('menu').setAttribute('aria-expanded','false');$('shade').hidden=true;}
  function markActive() {
    for(const a of document.querySelectorAll('[data-chapter]')){
      if(a.dataset.chapter===current.id){a.setAttribute('aria-current','page');const group=a.closest('details');if(group)group.open=true;}
      else a.removeAttribute('aria-current');
    }
  }
  function homeCards() {
    $('home-cards').replaceChildren();
    for(const id of ['research','creative-experiences','commercial']){
      const c=chapters.find(x=>x.id===id);const a=document.createElement('a');a.href='#'+id;a.className='pillar-card';
      const num=document.createElement('small');num.textContent='PILLAR '+($('home-cards').children.length+1);
      const h=document.createElement('h2');h.textContent=c.title;
      const p=document.createElement('p');p.textContent=c.description;
      const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='Explore the pillar →';a.append(num,h,p,arrow);$('home-cards').append(a);
    }
  }
  async function route() {
    const version=++routeVersion;
    let id;try{id=decodeURIComponent(location.hash.slice(1))||'home';}catch{id='home';}
    const found=chapters.find(c=>c.id===id);current=found||chapters[0];
    const c=current;
    document.title=c.title+' · Kani Home';$('title').textContent=c.title;
    $('breadcrumb').textContent=c.id==='home'?'Programme & organisation':c.group;
    $('kicker').textContent=c.id==='home'?(settings.kicker||'An evolving manifesto'):c.group;
    $('lead').textContent=c.description||'';$('home-cards').hidden=c.id!=='home';
    $('notice').hidden=true;
    if(!found&&id!=='home'){$('notice').textContent='That chapter was not found. Showing Home.';$('notice').hidden=false;}
    const url=editURL(c);$('edit').hidden=snapshot||!url;if(url)$('edit').href=url;
    if(snapshot){$('notice').textContent='Preserved edition — this snapshot stays unchanged. The main website carries the latest version.';$('notice').hidden=false;}
    markActive();closeMenu();$('article').textContent='Loading chapter…';$('pager').replaceChildren();
    try{const md=await markdown(c);if(version!==routeVersion)return;$('article').replaceChildren(renderMarkdown(md));
      const first=$('article').firstElementChild;if(first?.tagName==='P'&&first.textContent.trim()===c.description?.trim())first.remove();}
    catch(e){if(version!==routeVersion)return;$('article').textContent=e.message;return;}
    const index=chapters.findIndex(x=>x.id===c.id);
    for(const [n,label] of [[index-1,'Previous chapter'],[index+1,'Next chapter']]){
      if(!chapters[n])continue;const a=document.createElement('a');a.href='#'+chapters[n].id;
      const small=document.createElement('small');small.textContent=label;a.append(small,document.createTextNode(chapters[n].title));$('pager').append(a);
    }
    window.scrollTo({top:0,behavior:'instant'});$('main').focus({preventScroll:true});
  }
  async function search() {
    const version=++searchVersion;const q=$('search').value.trim().toLowerCase();
    $('results').hidden=!q;$('toc').hidden=!!q;$('results').replaceChildren();
    if(!q){$('search-status').textContent='';return;}
    $('search-status').textContent='Searching chapters…';
    const loaded=await Promise.allSettled(chapters.map(async c=>({c,text:await markdown(c)})));
    if(version!==searchVersion)return;
    let count=0,failed=0;
    for(const r of loaded){if(r.status!=='fulfilled'){failed++;continue;}const {c,text}=r.value;
      if(!(c.title+' '+c.group+' '+text).toLowerCase().includes(q))continue;
      count++;const a=navLink(c);const small=document.createElement('small');small.textContent=c.group||'Overview';a.append(small);$('results').append(a);
    }
    $('search-status').textContent=`${count} matching chapter${count===1?'':'s'}`+(failed?` · ${failed} could not load`:'');markActive();
  }
  async function allMarkdown() {return Promise.all(chapters.map(async c=>({c,md:await markdown(c)})));}
  $('export').onclick=async()=>{
    $('export').disabled=true;
    try{const all=await allMarkdown();const text='# Kani Home — '+(settings.version||'Working draft')+' · '+(settings.stage||'')+'\n\nUpdated '+(settings.updated||'')+'\n\n'+all.map(({c,md})=>'# '+c.title+'\n\n'+md).join('\n\n---\n\n');
      const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Kani-Home-'+(settings.version||'Working-Draft')+'.md';a.hidden=true;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
    }catch(e){$('notice').textContent='Export failed: '+e.message;$('notice').hidden=false;}finally{$('export').disabled=false;}
  };
  function clearPrint(){document.body.classList.remove('print-all');document.getElementById('print-document')?.remove();}
  $('print').onclick=async()=>{
    $('print').disabled=true;
    try{const all=await allMarkdown();clearPrint();const doc=document.createElement('div');doc.id='print-document';
      for(const {c,md} of all){const section=document.createElement('section');section.className='print-chapter prose';const h=document.createElement('h1');h.textContent=c.title;const label=document.createElement('p');label.textContent=(settings.version||'Working draft')+' · '+(settings.stage||'')+' · '+(settings.updated||'');section.append(label,h,renderMarkdown(md));doc.append(section);}
      document.body.append(doc);document.body.classList.add('print-all');requestAnimationFrame(()=>window.print());
    }catch(e){$('notice').textContent='Print preparation failed: '+e.message;$('notice').hidden=false;}finally{$('print').disabled=false;}
  };
  window.addEventListener('afterprint',clearPrint);
  $('menu').onclick=()=>{const open=!document.body.classList.contains('menu-open');document.body.classList.toggle('menu-open',open);$('menu').setAttribute('aria-expanded',String(open));$('shade').hidden=!open;};
  $('shade').onclick=closeMenu;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
  $('search').addEventListener('input',search);
  document.querySelector('.skip').onclick=e=>{e.preventDefault();$('main').focus();};
  window.addEventListener('hashchange',()=>{if(chapters.length)route();});
  async function start(){
    try{if(offline){chapters=window.KANI_BOOTSTRAP.chapters;settings=window.KANI_BOOTSTRAP.settings;}
      else{[chapters,settings]=await Promise.all([readJSON('chapters.json'),readJSON('site.json')]);}
      $('version-label').textContent=(settings.version||'Draft')+' · '+(settings.stage||'Discussion');
      $('edition-meta').textContent=(settings.version||'Draft')+' · '+(settings.stage||'Discussion')+' — For discussion · Updated '+(settings.updated||'');
      makeNavigation();homeCards();await route();
      if(offline&&!snapshot){$('notice').textContent='Local preview snapshot. Online edits are made through GitHub after publishing.';$('notice').hidden=false;}
    }catch(e){$('article').textContent='The document could not load. '+e.message;}
  }
  start();
})();
</script>
