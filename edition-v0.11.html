n| [Full structure](#full-structure) | The earlier growth model with dedicated functional roles. |\n| [How the team grows](#growth) | The earlier approach to phasing appointments. |\n\nThe original chapter links still work. Their text is preserved, with an archive notice to distinguish them from [The Structure](#structure).\n\n## Preserved editions\n\n[Read the complete v0.8 edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.8.html), before The Structure and this archive were introduced.\n\n[Version history](#version-history) records earlier editions and the reasons for each change. Published snapshots remain unchanged.\n","open-decisions":"This edition incorporates the agreed drafting changes. The following questions still need collective agreement before they become operating commitments.\n\n- [ ] Review the ethos wording, three pillar titles and activity menus with the group.\n- [ ] Review [The Structure](#structure): the seven-member council, representative selection, continuing working roles, convening and the six-month review.\n- [ ] Confirm the six [Advisory Circle](#structure-advisory) areas, initial appointments, time commitments, honoraria and the route for responding to advice.\n- [ ] Agree decision rules, quorum, conflicts and recusals, emergency authority, financial limits and entity delegations before using them.\n- [ ] Establish confidential contacts, an alternative route and impartial complaint and review arrangements.\n- [ ] Once the structure is adopted, align detailed programme charts and earlier reporting terminology across the manifesto.\n- [ ] Confirm the proposed platforms—Kanifest, Kani Publications, Curated Marketplaces, Sunset Baithaks, and Kani Canteen and Food Lab—and the publishing imprint.\n- [ ] Review and adopt the Programme Selection process, including who records decisions and how community participation is included.\n- [ ] Choose a realistic Year 1 calendar, including festival scope, marketplace frequency and publication commitments and editorial focus.\n- [ ] Confirm outreach priorities, initial community and institutional relationships, allocated staff time and participation-support budgets.\n- [ ] Confirm Year 1 staffing and support budgets under The Structure; agree platform staffing against actual programmes.\n- [ ] Agree Kani Fest duration and timetable; confirm the Producer, technical lead, shared-resource plan and delivery budget.\n- [ ] Agree curatorial fellowship fees, time commitments, mentoring, selection process and programme support before recruitment.\n- [ ] Confirm volunteer support, team-captain scopes and any funded year-round associate opportunities.\n- [ ] Name the Heart & Wellness coordinator, allocate time and agree support and alternative routes for concerns.\n- [ ] Develop Nurupa within Heart: confirm the Qalb Center / Slow Thing Festival relationship, programme lead, mentor preparation, calendar, cohort format, budget, pricing and local access, privacy and recording consent, online participation and participant-support protocols before launch.\n- [ ] Confirm entity responsibilities and delegated financial authority.\n- [ ] Confirm how publishing sales and distribution will be administered initially.\n\nCollect programme and presentation feedback in [Learnings & Feedback](#learnings-feedback). A suggestion is not an agreed operating decision.\n\n","version-history":"## Current edition\n\n**v0.11 · Revised draft — For discussion**\n\n**Published:** 12 November 2026\n\nStrengthened the manifesto opening with a clearer purpose statement, a more visible ethos, explicit transdisciplinary language and a linked synopsis of the current structure.\n\nReframed the Programme Framework around pillars, programmes and platforms; added Sunset Baithaks and Kani Canteen and Food Lab; and introduced a separate Programme Selection process. Removed the provisional wording label and the repeated working-status block from the home page.\n\n## Editions and changes\n\n| Edition | What changed | Why |\n|---|---|---|\n| v0.11 · Revised draft · 12 November 2026 | Clarified the opening and ethos; added a linked structure synopsis; reframed pillars, programmes and platforms; added two platforms and a Programme Selection process. | Make Kani’s values, organisation and programme-development decisions easier to understand. |\n| v0.10 · Revised draft · 11 November 2026 | Restored the Advisory Circle and consolidated repeated team, outreach, infrastructure and platform content. | Keep specialist expertise visible while making the manifesto shorter and internally consistent. |\n| v0.9 · Revised draft · 11 November 2026 | Added The Structure and its seven subpages; archived earlier governance and staffing proposals with original links preserved. | Make the current proposal easier to understand without rebuilding the wider menu. |\n| v0.8 · Revised draft · 11 November 2026 | Added shared-stewardship Option 3, lean coordination roles and detailed governance procedures; linked related chapters. | Explore decentralised authority without creating four director posts. |\n| v0.7 · Revised draft · 11 November 2026 | Expanded Heart into a programme space; introduced Nurupa and linked relevant chapters. | Make personal growth and becoming part of the lived foundation, alongside everyday care. |\n| v0.6 · Revised draft · 4 November 2026 | Added a participatory council option and side-by-side comparison; retained Option 1 and its reference decision rights; identified decisions required before adoption. | Explore a more inclusive model without prematurely replacing the earlier proposal. |\n| v0.5 · Revised draft · 2 November 2026 | Three high-level dotted connections without numbered relationship controls; programming and volunteer flows with clickable detail instead of repeated visible tables. | Make the map and pathways easier to read while retaining the detailed responsibilities. |\n| v0.4 · Revised draft · 2 November 2026 | Draggable festival map with shared resources and numbered dotted collaboration links; separate programming and volunteer flows; Heart & Wellness above shared resources with content to be developed; Learnings & Feedback immediately before Review & Editing. | Make working relationships easier to explore and keep developing content easy to find. |\n| v0.3 · Revised draft · 2 November 2026 | Unified expandable festival map with shared resources; year-round Heart & Wellness activities; detailed roles retained; new Learnings & Feedback chapter with collection marked ongoing. Internal analogy and retrospective material removed from manifesto chapters. | Present the proposed organisation clearly while giving experience and evolving feedback their own place. |\n| v0.2 · Revised draft · 2 November 2026 | Clickable Kani Fest working map and role explainers; paid curatorial fellowship model; named delivery and infrastructure responsibilities; programming workflow; supported volunteer pathway; shared Heart & Wellness responsibility; aligned staffing, outreach and decision pages. | Build on first-edition experience and make responsibility, shared-resource planning and routes for participation clear. |\n| v0.1 · Alpha · 2 November 2026 | “An evolving manifesto”; clearer transdisciplinary approach; outreach section and responsibilities across the structure; one-year council appointments with one or two members per area; Sound & Music title; charts and responsibilities for all three platforms; simpler status and review notes. | Prepare a coherent presentation edition and make relationships, responsibilities and the evolution of thinking easier to follow. |\n| Initial website · 1 November 2026 | The first online working document, before numbered editions. | Establish an editable, shared source. |\n\n[Read the preserved v0.11 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.11.html).\n\n[Read the preserved v0.10 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.10.html).\n\n[Read the preserved v0.9 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.9.html).\n\n[Read the preserved v0.8 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.8.html).\n\n[Read the final v0.7 edition before Option 3](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.7-final.html).\n\n[Read the preserved v0.7 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.7.html).\n\n[Read the preserved v0.6 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.6.html).\n\n[Read the preserved v0.5 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.5.html).\n\n[Read the preserved v0.4 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.4.html).\n\n[Read the preserved v0.3 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.3.html).\n\n[Read the preserved v0.2 Revised draft edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.2.html).\n\n[Read the preserved v0.1 Alpha edition](https://bhaumikdebanshu.github.io/KaniManifesto/edition-v0.1.html).\n\n[Read the initial website snapshot](https://bhaumikdebanshu.github.io/KaniManifesto/edition-initial.html). Its content is also preserved in the [original repository commit](https://github.com/bhaumikdebanshu/KaniManifesto/tree/14fac9b564864435f37587fa36fc6e175b9512d5).\n\nSnapshots stay as they were published. The main website carries the latest edition.\n\n## Simple versioning\n\n| Version | When to use it |\n|---|---|\n| v0.1 · Alpha | This first presentation edition. |\n| v0.2 · Revised draft | Earlier revision of the Kani Fest model. |\n| v0.3 · Revised draft | Earlier revision: unified map and separate learning and feedback. |\n| v0.4 · Revised draft | Earlier revision: draggable collaboration map and revised navigation. |\n| v0.5 · Revised draft | Earlier revision: simpler collaboration links and less repetition. |\n| v0.6 · Revised draft | Earlier revision: participatory council option and Heart foundation. |\n| v0.7 · Revised draft | Earlier revision: Heart programmes and Nurupa in development. |\n| v0.8 · Revised draft | Earlier revision: shared stewardship and a light Working Coordination Group. |\n| v0.9 · Revised draft | Earlier revision: The Structure and an archive of earlier proposals. |\n| v0.10 · Revised draft | Earlier revision: restored Advisory Circle and a crisper, aligned manifesto. |\n| v0.11 · Revised draft | Current revision: a clearer ethos, linked structure synopsis, programme framework and selection process. |\n| v1.0 · Agreed baseline | When the group agrees a structure to begin working with. It can still evolve. |\n\nDo not change the version for every typo. Increment it when the thinking, responsibilities or structure meaningfully changes. Record what changed, why and what remains unresolved; preserve the previous edition before publishing the next.\n\n## Learning and feedback\n\nProgramme observations and feedback now have a dedicated [Learnings & Feedback](#learnings-feedback) chapter. Collection is ongoing, and its structure remains provisional. Version history records changes made to the manifesto; feedback can remain under discussion without becoming an agreed change.\n\nKeep unresolved operating questions in [Open Decisions](#open-decisions). Check related chapters before publishing an agreed revision; see the [Document review checklist](#document-plan).\n\n\n","document-plan":"## Review one complete edition\n\nReview the manifesto, programme framework, advisory arrangements, team and platforms together. This prevents a change to one role from leaving contradictory responsibilities elsewhere.\n\n## Consistency checklist\n\n| When this changes | Also review |\n|---|---|\n| Ethos or pillars | Home, Programme Framework, pillar chapters, platform descriptions and open decisions. |\n| Programme selection criteria or process | Programme Framework, Programme Selection, Working Team, Decision-making and open decisions. |\n| Council membership or authority | Governance, Decision-making, Overview, enabling-entity arrangements and open decisions. |\n| Advisory areas or appointments | Advisory Circle, Governance, Working Team, Operations & Resources and open decisions. |\n| Outreach responsibilities | Outreach, Working Team, Operations & Resources and relevant programme pages. |\n| Heart & Wellness | Home, Heart & Wellness, Working Team, outreach and Disagreements & Resolution. |\n| Platform staffing or reporting | Programme Teams, the relevant platform map or chart and Operations & Resources. |\n| Programme observations or feedback | Learnings & Feedback, unresolved decisions, and any agreed changes to the relevant manifesto chapters. |\n| A substantive agreed revision | Version label, version history, previous-edition snapshot, navigation, Markdown export and print view. |\n\nCharts distinguish programme responsibility from shared support. Platform leads and advisors are not additional permanent hires.\n\n## Review and publish\n\nCollect proposed edits, review them as a batch, then publish one coherent edition. Keep feedback in [Learnings & Feedback](#learnings-feedback), distinguishing collected observations from agreed actions. Preserve the presentation edition before incorporating feedback so readers can follow how the thinking changed.\n\nSee [Version history](#version-history) for the current edition and revision approach.\n","editing":"## Edit a chapter\n\n1. Open the chapter you want to change.\n2. Click **Edit this chapter** in the top bar. It opens the corresponding Markdown file on GitHub.\n3. Sign in to GitHub and make your changes. Headings use `##`; tables use rows separated by vertical bars.\n4. Use GitHub’s Preview tab to check the text and table formatting.\n5. Select **Commit changes**, add a short description, and save to the publishing branch if you have permission.\n6. Wait for the Pages deployment to complete, then refresh this website.\n\nThe editor link appears once the site is hosted on GitHub Pages, or when the repository is set in `site.json`.\n\n## Let someone else contribute\n\nShare the website link for reading. Give selected collaborators repository write access if they should edit directly. Others can propose changes through GitHub pull requests. This is repository editing, not simultaneous Google Docs-style editing.\n\n## Tables and checklists\n\nThe site displays tables and checklists from the Markdown files. Make changes in the source file through **Edit this chapter**. Checkboxes on the reading page are intentionally read-only; use `- [x]` in the source to mark a decision complete.\n\n## Download or print\n\n**Download Markdown** combines the current chapters into a single editable document. **Print all** prepares every chapter for printing or saving to PDF.\n\n## One working source\n\nAfter publishing, the Markdown files in this GitHub repository are the website’s working source. The earlier ChatGPT Page and Obsidian folder do not automatically synchronise with it.\n\n## Visibility\n\nThe free public-repository setup makes the site and its source public. The site requests that search engines do not index it, but this is not access control. Anyone with the address can read it.\n\n## Versions and charts\n\nUse [Version history](#version-history) for substantive changes. The main website is the current working edition; the linked snapshots preserve earlier editions and should not be edited. Use **Print all** on a snapshot to save that edition as a PDF.\n\nPlatform charts are written as indented bullet lists inside a `kani-chart` code block in each platform’s Markdown file. Indentation defines the project hierarchy. Kani Fest uses one `kani-map` block with three labelled sections: `[Festival team]`, `[Shared resources]` and `[Collaborations]`. Indented bullets define the team hierarchy; flat bullets define shared resources. Collaboration entries use `- Role A <> Role B | Relationship label`, matching box names exactly. The programming and volunteer flows use separate `kani-flow` blocks below the map. Each box title matches the first cell of its explanation table exactly; the next cells supply the explainer text. The programming and volunteer explanations are in `kani-details` blocks directly beneath their flows. These tables supply the clickable explainers and print output without repeating on the reading page. Edit those table cells to change an explainer. Keep map collaboration links at the level of the two festival leads and shared resources. Update the chart and table together when a role or relationship changes. Shared support stays separate from reporting lines.\n\nBefore publishing a substantive new edition, update the version and date in `site.json`, the history page and the preserved snapshot together. Follow the [Document review checklist](#document-plan).\n\nProgramme observations and feedback belong in [Learnings & Feedback](#learnings-feedback). Its collection format is provisional; use reviewed summaries when updating this public record.\n","entities":"The entities enable the work; the pillars describe activities. These are proposed operating remits, to be aligned with the entities’ actual mandates and approvals.\n\n| Entity | Proposed contribution |\n|---|---|\n| Seed of Unity Foundation — SoUF | Community, education, supported research, fellowships and public-interest programmes. |\n| Kashmir Innovation Labs — KiLab | Craft, material research, documentation, innovation and related collaborations. |\n| M/s Kani Home | Commercial experiences, space hire, hospitality and accommodation. |\n\nEvery project identifies its lead entity, budget and authorised signatory. Operational coordination under the Director does not replace the financial and contractual authority of the relevant entity.\n","council":"## Purpose\n\nThe council helps establish annual direction and priorities, contributes expertise, mentors practices and opens relationships. Senior advisors support the working team through key conversations and defined commitments. Day-to-day execution rests with staff and commissioned collaborators.\n\n## Seven advisory areas\n\nThe areas describe expertise, not named individuals or separate departments. Each area may have one or two members, depending on the expertise and support needed. Where two members share an area, they agree how to divide responsibilities and coordinate their contribution. Seven advisory areas can therefore have between seven and fourteen members when all areas are filled.\n\n| Advisory role | Main contribution |\n|---|---|\n| Art & Cultural Practice | Visual arts, film, exhibitions, artistic development and cultural relationships. |\n| Design, Systems & Technology | Programme formats, organisational systems, experiences, shared tools and infrastructure, and emerging technologies. |\n| Research, Learning & Publishing | Research direction, academic relationships, educational programmes and editorial standards. |\n| Sound & Music | Music programming, sound practices, practitioner networks and interdisciplinary collaborations. |\n| Craft, Heritage & Community | Artisan relationships, local knowledge, heritage, craft innovation and community participation. |\n| Business & Enterprise | Commercial models, pricing, retreats, bookings and market relationships. |\n| Fundraising & Resource Development | Grants, CSR relationships, sponsorships, philanthropy and institutional funding. |\n\nInstitutional partnerships are a shared responsibility across the council. Membership should include at least two people deeply connected to Kashmir’s communities and practices. Invite additional specialists for particular enquiries rather than expanding the standing council for every discipline.\n\n## Appointments and accountability\n\n- Council members serve one-year terms. Membership is reviewed annually, and appointments may be renewed.\n\n- The annual review considers contribution, agreed commitments, continuity and the expertise needed for the next year.\n\n- One member serves as Convenor for one year, coordinating agendas and follow-up without an additional artistic veto.\n\n- Each member has a written remit, agreed time commitment and compensation arrangement.\n\n- Each member undertakes a small set of concrete commitments, such as introducing partners, mentoring a project or helping develop a programme.\n\n- Departing members document commitments and hand over relationships to the working team.\n\n## Working method and disagreements\n\nHold quarterly planning and review meetings, with shorter project conversations as needed. The Director attends; relevant staff and platform leads join for their items. The Programme & Operations Coordinator initially provides light secretariat support.\n\nBring concrete proposals stating purpose, audience, owner, cost, funding source and demands on space and staff. Discuss them against the mission, local relevance, creative or learning value, feasibility and what they would displace.\n\n**Voting proposal for collective review:** Seek agreement before voting. Each advisory area has one vote, whether it has one or two members. Members sharing an area agree their position; if they cannot agree, that area abstains. A quorum requires at least five advisory areas represented, with at least four affirmative area votes for a council-level decision. Conflicted members declare their interest and step out. Confirm how vacancies, shared-area conflicts and recusals affect representation before adopting this procedure; if a valid quorum cannot be established, defer the decision. This procedure remains an open decision for the group.\n\nRecord decisions, reasons, owners and next actions. Routine programme delivery proceeds within delegated authority and does not await council votes.\n","council-option-2":"## Council structure\n\nA proposed 14-seat council brings together advisors, serving curators, community and youth representatives. The Director attends as operational lead.\n\nHeart and grace underpin how the council listens, collaborates and works with people.\n\nFour perspectives come together in one council. The groups describe contributions, not separate departments or ranks. Members can contribute beyond their category.\n\n| Group | Seats | Proposed roles and contribution |\n|---|---|---|\n| Practice & Systems Advisors | 5 | One each for Arts, Craft & Cultural Practice; Research, Learning & Publishing; Design, Systems & Technology; Business & Enterprise; Fundraising & Partnerships. Build capability, mentor the team and develop practitioner, institutional, industry and funding relationships. |\n| Programme members — ex officio | 5 | Festival Curator; Arts & New Media Curator; Sound & Music Curator; Film & Moving Image Curator; Craft & Material Practices Curator. Bring current practice, practitioner relationships and programme experience. |\n| Community representatives | 2 | Selected through a process developed with local residents, practitioners and participants. Bring priorities, access needs and lived experience; gather views and report back. |\n| Youth representatives | 2 | Young people selected through an accessible youth-led nomination or selection process. Help shape opportunities, learning and Kani’s future direction. |\n| **Total council seats** | **14** | The Director attends as operational lead, additional to these seats. Other working-team members join relevant items. |\n\nStart with one advisor per area. Invite further specialists for particular enquiries rather than automatically adding standing seats. Community and youth seats are distinct places; one person does not fill two seats.\n\n## Advisors and curators\n\nAn advisor supports the wider organisation across programmes and years. A curator develops a particular programme within an agreed brief. For example, the Arts, Craft & Cultural Practice Advisor helps build mentoring and institutional relationships; the Arts & New Media Curator develops the festival track.\n\nEx officio means membership by virtue of holding a role. Each serving curator joins through their appointment and leaves that seat when the appointment ends. These seats are additional to the advisors. An unfilled curatorial role leaves a vacant seat; no appointment is made solely to fill the council.\n\nAdvisors and community/youth representatives serve one-year terms, reviewed annually and renewable. Each has an agreed remit, time commitment and participation or compensation arrangement. Curatorial appointments include time for council work and handover.\n\nMembers step out of discussions concerning their own appointment, fees or performance. Interests in commissions, selections or partnerships are declared and handled through an agreed conflict process.\n\n## How the council works\n\nThe council helps shape annual priorities, participation and programme learning, and advises on partnerships and long-term development. The Director and programme leads handle everyday delivery within agreed briefs and budgets. Financial and contractual commitments remain with authorised entity representatives.\n\nOne Convenor is appointed annually from the council. The full council meets quarterly, with temporary working groups for specific questions. Advisors agree practical contributions such as mentoring, introductions or helping develop organisational systems.\n\nCommunity and youth representatives help set agendas, bring views from open community gatherings and report back on responses. Participation includes appropriate honoraria, travel and access support. Selection arrangements and decision procedures remain to be agreed.\n\nReview the council structure after one year.\n","council-option-3":"**Status: proposed model for discussion.** Membership, appointments, decision rules and financial delegations require collective agreement before adoption. The earlier governance and staffing chapters remain reference proposals; this chapter sets out Option 3 in full.\n\n## Executive summary\n\nKani Home is proposed as an organisation governed through **shared stewardship**. Authority is distributed across a council, a small working group and programme teams, with decisions made close to the work.\n\nA **16-member Shared Stewardship Council** brings together six advisors, three programme delegates, one Heart delegate, two working-team delegates, two community representatives and two youth representatives. It agrees direction, annual priorities, shared policies and resource-allocation principles, and reviews how Kani is working.\n\nA **Working Coordination Group** carries four responsibilities: Creative Practice & Learning; Community & Care; Partnerships & Institutional Development; and Systems, Operations & Resources. These are responsibilities, not four director posts. The group's size follows the actual appointments.\n\n**Year 1 centres on two continuing paid coordination roles: Programme Coordinator and Operations Coordinator.** Design & Communications works alongside them. Community & Care has allocated time within the team or part-time support; Partnerships can begin through a part-time or retained appointment. Existing accounts and hospitality staff support delivery. Each responsibility has a named owner, realistic capacity and appropriate compensation.\n\nProgramme teams make creative and delivery decisions within agreed briefs and budgets. Each programme has a named delivery owner. A **Council Convenor** maintains the governance process, with meeting facilitation shared or rotated and no casting vote or unilateral override.\n\nMajor direction is developed through consensus-seeking; practical, reviewable policies can use consent. Routine work proceeds through delegated authority. Heart underpins the whole structure through care, participation, respectful disagreement and responsibility towards people and place.\n\n## 1. How the structure works\n\n| Part | Purpose and authority | Boundary |\n|---|---|---|\n| Shared Stewardship Council | Direction, annual priorities, shared policies, resource-allocation principles and organisational review. | Does not approve every activity or give separate instructions to staff. |\n| Working Coordination Group | Connect programmes, community, partnerships and resources; coordinate capacity and resolve issues between teams. | Works within agreed priorities and delegated resources. |\n| Programme and working teams | Develop and deliver programmes and everyday services, with autonomy within their mandates. | Escalate matters affecting other teams, exceeding resources or changing agreed direction. |\n| Enabling entities | Hold the relevant institutional, financial and contractual responsibilities. | Reserved approvals and delegations must be explicit and aligned with actual entity mandates. |\n\nThe six advisors sit within the council as peers. Their advice alone is not an operational instruction. Every shared project still has one named person responsible for following it through.\n\n## 2. Council membership\n\n| Group | Seats | Contribution and selection |\n|---|---|---|\n| Practice advisors | 6 | Expertise, mentoring and organisational development; appointed against agreed criteria and needs. |\n| Programme delegates | 3 | One from each pillar, selected with the relevant programme teams. |\n| Heart delegate | 1 | Care, wellbeing and personal growth across Kani, including Heart programmes; selected with people involved in that work. |\n| Working-team delegates | 2 | Experience of running the place; selected by the working team. |\n| Community representatives | 2 | Local priorities, knowledge and access needs; selected through a process developed with participating communities. |\n| Youth representatives | 2 | Young people's perspectives on learning, participation and Kani's future; selected through an accessible youth-led process. |\n| **Total** | **16** | One person occupies one seat and has one decision-making position. |\n\nThe three programme delegates represent Research, Residencies & Learning; Creative Experiences; and Commercial Experiences & Space Hire. Their remit includes year-round activities beyond Kani Fest. Heart remains the foundation across the pillars, with a dedicated voice in governance.\n\nRepresentatives consult the people they represent and report back. Council seats are not additional staff posts. Invite specialists for particular questions without automatically adding standing seats.\n\n## 3. The six advisory roles\n\n| Advisory role | Contribution |\n|---|---|\n| Arts, Culture & Publishing | Creative practice, curatorial mentoring, publishing and cultural relationships. |\n| Research & Learning | Residencies, fellowships, learning approaches and research collaborations. |\n| Systems & Organisational Development | Governance, decision processes, team structures, documentation and organisational learning. |\n| Technology & Digital Practice | Creative technology, digital infrastructure, archives and technical capability. |\n| Business & Enterprise | Revenue models, pricing, commercial experiences, hospitality and sustainability. |\n| Institutional Partnerships & Fundraising | Institutional networks, grants, CSR, sponsorship and resource mobilisation. |\n\nEach advisor has an agreed contribution and time commitment. Advisors mentor, review and open relationships; named working-role holders carry the continuing work. For example, an advisor may introduce an art school, while the Partnerships Coordinator develops and maintains the collaboration.\n\n## 4. A light Working Coordination Group\n\nFour responsibilities are held across the people actually appointed. One person may hold more than one responsibility only where time, skills, support and workload make this realistic.\n\n| Responsibility | Suggested role title | Year 1 arrangement |\n|---|---|---|\n| Creative Practice & Learning | Programme Coordinator | Continuing paid role: programme development, creative quality, research, residencies, mentoring and connections across disciplines. |\n| Community & Care | Community & Care Coordinator | Defined responsibility with allocated paid time within the team, or part-time support: local relationships, access, participation, feedback and working culture. Works with Heart programme leads. |\n| Partnerships & Institutional Development | Partnerships Coordinator | Part-time or retained support: institutional relationships, funding development, proposals and follow-through, supported by relevant advisors. |\n| Systems, Operations & Resources | Operations Coordinator | Continuing paid role: shared calendar, resource planning, operational processes, documentation and coordination with accounts, hospitality and technical staff. |\n\n**The initial continuing team is Programme Coordinator, Operations Coordinator and Design & Communications.** Existing accounts and hospitality capacity is additional. Community & Care and Partnerships must have named owners and funded time; they are not assumed to happen through unpaid extra work. Additional support grows with programmes and funding.\n\nDesign & Communications leads graphics, audience communication and documentation coordination, working directly with programme owners. Curators, producers, editors, mentors, outreach support and technical specialists are appointed against programme needs and budgets. Systems coordination does not require the Operations Coordinator to personally supply every technical skill.\n\nThe Working Coordination Group consists of the people holding these ongoing responsibilities. Its membership need not be four people, and does not automatically expand when a project specialist is engaged. A named commercial booking owner works with Operations and Partnerships within agreed pricing and booking rules.\n\n### Authority and accountability\n\n- Each working role has a written mandate: decisions it can make, consultation requirements, resources, expected contributions and review dates.\n- The council appoints and reviews those holding the continuing coordination responsibilities through a defined process involving the working team. Initial role mandates run for one year, with a six-month review; employment or service terms are agreed separately.\n- Each person acts within their own mandate. Decisions affecting several functions involve the relevant colleagues and affected programme teams.\n- Each staff member has a named support and review contact, avoiding several competing managers.\n- Working Coordination Group members attend relevant council discussions. They hold a council decision-making seat only if selected into one of the existing 16 seats; there are no automatic extra seats or duplicate votes.\n- When responsibilities are combined in one person, required consultation or approval remains with a distinct authorised colleague. Combining roles must not become self-approval.\n\n## 5. Convening and facilitation\n\n| Role | Responsibility |\n|---|---|\n| Council Convenor | Gather agenda items, circulate information, organise meetings and follow up on governance commitments. |\n| Meeting facilitator | Guide a particular discussion, support equal participation and check agreement explicitly. |\n| Working-group Convenor | Organise coordination meetings and follow up on shared operational commitments; an assigned responsibility within the working group. |\n\nThe council selects its Convenor through nominations and a consent process for a one-year term, reviewed after six months. Meeting facilitation can rotate among prepared members or be supported externally. Initially, different people convene the council and the working group.\n\nThe Convenor has no casting vote, unilateral veto or power to change a collective decision. Every member can submit agenda items. The Convenor cannot exclude a concern without an agreed reason and route for consideration, and represents Kani's position only when authorised. Someone else facilitates matters involving the Convenor's own proposal or interests. Founders are eligible through defined roles; the position is not automatically theirs.\n\n## 6. Who decides what?\n\n| Decision | Decision owner | Required involvement |\n|---|---|---|\n| Purpose, ethos and major direction | Council | Wider consultation with teams and communities. |\n| Annual priorities | Council | Programme proposals and working-group capacity assessment. |\n| Annual programme allocations | Council | Accounts and relevant entity confirmation of funds and authorisations. |\n| Programme content and artistic selections | Relevant curator or programme team | Consultation appropriate to the agreed brief. |\n| Routine spending within an allocation | Authorised budget holder | Agreed financial process and limits. |\n| Shared-space or staffing clashes | Affected teams first; working group if unresolved | People responsible for affected work. |\n| Routine institutional collaboration | Partnerships Coordinator within delegated authority | Relevant programme and resource leads. |\n| Major partnership or long-term commitment | Council and relevant entity | Assessment of value, capacity and obligations. |\n| Operational systems and procedures | Relevant function, or working group for shared policies | Staff and users affected by the change. |\n| Appointment and review of coordination-role holders | Council | Working-team input; conflicted members step aside. |\n| Programme specialist appointments | Relevant team under an agreed process | Budget holder and required entity authorisation. |\n\nEvery project has a named delivery owner, including work spanning pillars. Within its agreed brief and resources, a team can proceed without repeated council approval. Advisors, founders and funders use these arrangements rather than giving parallel instructions to staff.\n\n## 7. Reaching agreement\n\n| Decision type | Method |\n|---|---|\n| Routine work within an agreed mandate | Responsible person decides, consulting affected people. |\n| Practical policies and reversible experiments | Consent, with limits and a review date. |\n| Major organisational direction | Consensus-seeking, with wider consultation. |\n| Immediate operational emergency | Defined emergency authority, followed by review. |\n\n**Consensus** develops a proposal members can support or live with; it need not be everyone's first preference. **Consent** asks whether there is a reasoned objection to trying a proposal within defined limits. It is useful for decisions that can be reviewed and changed. Both require understanding, meaningful participation and an explicit check.\n\n### The decision process\n\n1. **Prepare:** circulate the need, proposal, costs, affected people, decision owner and review date.\n2. **Clarify:** answer questions before debating positions.\n3. **Hear:** give each eligible participant an opportunity to contribute, with language and access support where needed.\n4. **Revise:** address concerns and consider alternatives.\n5. **Check:** ask each eligible participant to state their position explicitly.\n6. **Record:** document the decision, reservations, owner, resources and next steps.\n\n| Position | Meaning |\n|---|---|\n| Support | I support the proposal proceeding. |\n| Accept with reservations | I can live with it; record my concern. |\n| Stand aside | I do not support it, but will not prevent others proceeding; implications for delivery must be clarified. |\n| Object | I see a significant problem concerning consequences, feasibility or alignment with Kani's purpose that needs resolving. |\n\nFacilitators help people explain concerns without requiring technical or polished language. **Silence and unanswered messages do not count as agreement.** Standing aside does not imply agreement to provide labour or resources.\n\n### When agreement is not reached\n\nIdentify whether the issue is missing information, competing needs, resources, values or a damaged working relationship. Revise the proposal, develop alternatives with those raising concerns, seek independent facilitation, agree a smaller trial, or defer or withdraw it. A deadline does not automatically transfer authority to the Convenor.\n\nA possible voting fallback is approval by three-quarters of eligible council members after a second facilitated discussion, limited to specified decisions. This is a proposal, not an adopted rule: eligible membership, rounding, recusals and the permitted decisions must be defined before use. A result reached this way is recorded as a supermajority decision, not consensus. Until a fallback is agreed, an unresolved proposal remains unresolved.\n\nFor a fully occupied 16-seat council, the proposed quorum is **11**, including at least two community/youth representatives and two programme, Heart or working-team delegates. Vacancy, recusal, written-participation and agreement-check rules must be settled before adoption; the six advisors cannot decide alone.\n\n## 8. Budgets, spaces and shared resources\n\nEach programme agreement identifies its purpose, scope, owner, budget, funding conditions, staff time, spaces, equipment, spending authority, participation responsibilities and review dates. Accounts provides an accessible picture of available, committed and spent funds.\n\n| Question | Proposed arrangement |\n|---|---|\n| Who allocates resources across programmes? | Council, informed by actual funding and team capacity. |\n| Who spends within an allocation? | Named authorised budget holder, within written limits. |\n| Who agrees transfers between programmes? | Working group within an agreed limit, with affected budget holders; council beyond it, with required entity authorisation. |\n| How are commercial and public activities balanced? | Shared calendar and allocation policy, including protected time for public-interest work. |\n| How are equipment and spaces maintained? | Transparent booking rules, named maintenance responsibilities and a process for clashes. |\n\nCommercial bookings account for their full demands on staff and facilities. Kani can consider a defined programme fund whose allocations involve community and youth representatives. Institutional relationships, agreements and commitments are documented so continuity does not depend on one person.\n\n## 9. Founders and enabling entities\n\nThe proposed roles of SoUF, KiLab and M/s Kani Home must be aligned with their actual mandates and authorisations. A written delegation agreement identifies lead entities, signatories, expenditure powers, team authority, reserved matters and a route for disagreements.\n\nFounders participate through defined responsibilities; any retained approval powers are stated openly. Council agreement alone does not authorise a financial or contractual commitment. Delegations must nevertheless give teams enough authority to carry out approved work without repeatedly seeking fresh permission.\n\n## 10. Participation, care and conflicts of interest\n\nCouncil appointments run for one year, reviewed annually, with staggered handovers where possible. Agree selection criteria, nomination routes, expected contributions, participation support and a fair replacement process. Community and youth representatives need accessible ways to gather views and report back.\n\nBudget for appropriate honoraria, travel, language and access support. Declare interests in suppliers, applicants, partners and commissions. Members step aside from decisions about their own appointment, fees or connected interests. A replacement or conduct process includes an opportunity to respond.\n\nHeart shapes everyday practice. Every lead remains responsible for respectful working and realistic workloads. Confidential concerns have an impartial route and an alternative contact when the usual lead, founder or Convenor is involved. Sensitive complaints are handled separately from public consensus discussions.\n\nDefine emergency authority before launch: who can act, for what situations, within what limits and how promptly decisions are reported and reviewed. Emergency authority is not a general route around agreed governance.\n\n## 11. Working rhythm and records\n\n| Gathering | Proposed rhythm | Focus |\n|---|---|---|\n| Programme-team check-ins | According to the work | Delivery and immediate decisions. |\n| Working Coordination Group | Fortnightly; weekly during busy periods | Shared capacity, resources and issues between teams. |\n| Council | Quarterly, with additional decision meetings when needed | Direction, budgets, policy and accountability. |\n| Community gathering | Twice yearly | Priorities, feedback and reporting back. |\n| Governance review | After six months, then annually | Participation, authority, workload and effectiveness. |\n\nThe shared decision record captures what was agreed, why, who participated, who will act and when it will be reviewed. Confidential personnel and complaint records have separate restricted access. Feedback receives a response: what changes, what needs exploration and what cannot proceed, with reasons.\n\nReviews ask whose contributions shape decisions, who controls information and resources, whether staff can disagree, whether community and youth members influence outcomes, and whether coordination work is recognised and paid.\n\n## 12. Example: an institutional residency\n\n1. The Partnerships Coordinator develops an opportunity with an art or design school.\n2. The Programme Coordinator and relevant practitioners develop the brief.\n3. The person responsible for Community & Care helps shape local participation, access and support.\n4. The Operations Coordinator assesses budget, spaces, staffing and calendar implications.\n5. The proposal proceeds within existing delegation, or goes to the council if it introduces a major commitment or changes priorities.\n6. The relevant entity authorises the agreement.\n7. A named residency lead delivers within the agreed mandate.\n8. Participants and partners contribute to a review informing future work.\n\nWhere someone holds two functions, these remain distinct checks and consultation involves the affected colleagues. The council sets direction and boundaries, the working functions make collaboration possible, and the programme team carries the work.\n\n## 13. Starting the model\n\nBegin with a six-month pilot after agreeing:\n\n- Founder and entity delegations, financial limits and reserved matters.\n- Council selection, representative mandates, participation support and handovers.\n- Paid time, staffing and authority for the four coordination responsibilities, with the lean Year 1 arrangements confirmed.\n- Quorum, consent and consensus procedures, vacancies, recusals and any voting fallback.\n- Convenor selection, independent routes for concerns and emergency arrangements.\n- A manageable programme calendar and a review process.\n\nTest the arrangements against a Kani Fest budget, an institutional residency partnership and a commercial booking that clashes with a community programme. The pilot reviews whether authority is shared in practice, decisions sit at the right level, workload is manageable and responsibilities are fulfilled.\n\n## References informing the discussion\n\nThese sources offer practices to learn from; Option 3 is a proposed adaptation for Kani, not a claim to reproduce any one organisation's governance.\n\n- [Kalpavriksh: Philosophy and Working Principles](https://kalpavriksh.org/wp-content/uploads/2021/01/KV-philosophy-note-revised-Oct-2019-clean.pdf) — collective direction and project responsibility.\n- [Seeds for Change: Consensus Decision Making](https://www.seedsforchange.org.uk/consensus) — participation, reservations, objections and facilitation.\n- [Sociocracy For All: Consent Decision Making](https://www.sociocracyforall.org/consent-decision-making/) — consent and reasoned objections.\n- [Casa do Povo](https://casadopovo.org.br/about/) — participatory cultural space and differentiated institutional roles.\n- [UHAI: participatory grantmaking case study](https://icscentre.org/wp-content/uploads/2024/05/UHAI_ThePowerofMakingFutures.pdf) — community involvement in resource allocation.\n- [ruangrupa and lumbung](https://documenta-fifteen.de/en/about/) — collective resource sharing.\n","decisions":"**Reference draft for Option 1.** [Option 2](#council-option-2) sets out a participatory council. [Option 3](#council-option-3) contains its own shared-stewardship decision rights, lean staffing, consensus and consent procedures. The Director-based rights below are retained as an earlier proposal; they do not govern Option 3.\n\n| Decision | Responsible role |\n|---|---|\n| Overall direction and annual priorities | Council collectively, informed by the Director and working team. |\n| Year-round programme, staff allocation and operational commitments | Director of Creative Practice, within delegated authority. |\n| Festival artistic selections | Festival Curator, informed by track curators/fellows, within the agreed brief and budget. |\n| Festival programme and resource review | Festival Curator and Producer jointly review the programme; the Curator owns artistic choices and the Producer owns delivery planning. Escalate unresolved resource conflicts to the Director. |\n| Festival confirmed timetable | Programme Coordinator maintains the schedule and change log after review by the relevant leads. |\n| Festival equipment allocation and changeovers | Technical & Infrastructure Lead under the Producer, working with venue/session leads and shared technical staff. |\n| Festival volunteer coordination | Volunteer Coordinator owns induction, rota and support; one assigned venue or task lead directs each shift. |\n| Publication editorial development and quality | Editor / Publishing Lead, within the agreed publishing brief and budget. |\n| Marketplace theme and participant selection | Marketplace Curator, within the agreed programme brief. |\n| Outreach strategy and key institutional relationships | Director, informed by programme owners and community feedback. |\n| Community relationships, participation support and follow-up | Programme & Operations Coordinator in Year 1; dedicated outreach coordinator when appointed, working with the named programme owner. |\n| Audience communication and development | Design & Communications, alongside programme owners and outreach coordination. |\n| Project schedules, participant coordination and delivery follow-up | Named programme manager or coordinator. |\n| Technical feasibility, venue readiness and production methods | Operations / Production Lead or the coordinator with appointed technical specialists. |\n| Funding proposals and funder relationships | Fundraising lead/manager with Director, programme and accounts inputs. |\n| Commercial proposals and bookings | Named commercial owner within approved pricing and booking rules. |\n| Team care, morale and working culture | Director accountable; named Heart & Wellness coordinator supports check-ins and practical care. Every lead remains responsible for their team’s working conditions. |\n| Contracts and financial commitments | Authorised representatives of the relevant entity. |\n\nWhen scope exceeds agreed resources, the relevant creative lead and Director revise the proposal or seek additional support. Council endorsement alone does not authorise spending.\n\nEvery project has one named owner and a clear budget, including when it connects pillars or platforms. For shared projects, agree who owns each deliverable and how budgets and handovers are coordinated.\n\nThe council’s proposed voting method gives one vote to each advisory area, regardless of whether it has one or two members. It remains subject to collective agreement; see [Council appointments and decision procedure](#council) and [Open Decisions](#open-decisions).\n","year-one":"**Earlier staffing reference:** This chapter describes the Director-based proposal. [Council Option 3](#council-option-3) sets out the alternative with Programme and Operations Coordinators, Design & Communications, and allocated or part-time support for Community & Care and Partnerships. These are alternative models for discussion, not cumulative staffing commitments.\n\nBegin with a small permanent team, supported by existing staff and funded specialist appointments. Add continuing roles as programmes, workload and resources grow.\n\nStart with **three permanent hires**, supported by the existing accounts and hospitality teams and a defined budget for retained and project expertise.\n\n## Director of Creative Practice\n\nThe single operational head of the working team.\n\n- Leads the year-round programme across the three pillars.\n\n- Is accountable for outreach and community engagement, supporting key relationships and reviewing participation and access.\n\n- Works with the council on priorities, partnerships and institutional development.\n\n- Holds the overall calendar, resource plan and programme budget within delegated authority.\n\n- Commissions curators, editors, mentors and other specialists.\n\n- Leads key fundraising relationships with retained support.\n\n- Develops and reviews platforms and original initiatives.\n\n## Roles reporting to the Director\n\n| Role | Initial responsibilities |\n|---|---|\n| Programme & Operations Coordinator | Shared calendar, resident and artist liaison, local community relationships, participation support and follow-up; production logistics, vendor coordination, commercial enquiries and booking follow-up; coordination with accounts and hospitality. |\n| Design & Communications Associate | Graphics, social media, programme announcements, audience communication and development with programme owners, presentations and documentation coordination. An early-career role with independent working ability. |\n| Existing Accounts Team | Invoicing, payments, records, expenditure tracking and financial reporting inputs. Entity approval powers remain separate. |\n| Existing Hospitality Team | Accommodation, guest arrivals, room readiness, catering arrangements, routine venue visits and visitor support. |\n\nThe Director is one of the three new permanent hires. Existing accounts and hospitality capacity is additional to those three hires.\n\n## Retained, rotating and project basis\n\n| Support role | Starting arrangement |\n|---|---|\n| Fundraising & Partnerships Lead | Part-time retainer with defined deliverables, reporting to the Director. Develops grants, CSR opportunities, sponsors, donors and institutional relationships. |\n| Proposal & Grant Writer | Commissioned for selected applications and reports; coordinated by the fundraising lead. Can be the same person where skills and capacity allow. |\n| AV Technician | Scheduled event support and maintenance visits. Train an existing staff member for basic playback and equipment checks. |\n| Student Design Intern | Paid, supervised placement under the Design & Communications Associate, with defined learning outcomes. |\n| Senior Design Mentor | Occasional support for visual direction, review and development of the associate. |\n| Festival Curator, curatorial fellows & Festival Producer | Edition-funded appointments; proposed 6–9 month paid track fellowships with mentoring and production support. |\n| Festival delivery roles | Programme Coordinator, Technical & Infrastructure Lead, venue/session leads, Artist & Guest Liaison and Volunteer Coordinator; combine roles only where capacity allows. |\n| Editor / Publishing Lead | Retained or appointed per publication or series, supported by commissioned editorial specialists. |\n| Marketplace Curator | Contract across a series of editions, supported by the permanent coordinator. |\n| Heart programme leads, mentors & facilitators | Funded appointments for initiatives such as Nurupa; define delivery time, participant support and specialist requirements before launch. |\n| Residency mentors & facilitators | Appointments against each programme’s budget, including researchers, artists, educators, creative technologists and local knowledge holders. |\n| Specialist production partners | Sound, lighting, fabrication, installation, photography, video and event crew as required. |\n\nStart with a manageable calendar. A festival or publication deadline must carry its additional staffing cost rather than simply being added to the coordinator’s existing workload.\n\n## Outreach capacity\n\nThe coordinator maintains the shared relationship record and follows up on programme feedback, while the Director supports key relationships. Allocate time for this work and fund additional outreach support during busy programmes. There is no additional permanent outreach hire in the initial three-person team. See [Outreach & Community Engagement](#outreach).\n\nKani Fest budgets for its own delivery capacity and supported volunteer teams. The permanent coordinator holds continuity; returning volunteers can take bounded team roles, while sustained responsibilities require a funded appointment. See the [festival working map](#kani-fest).\n\n## Heart & Wellness\n\nName a coordinator for team welcome, check-ins, morale, recognition and practical support, with time allocated within the starting structure. The Director is accountable for making this possible; every lead owns respectful working and realistic workloads. At festival peaks, agree additional support alongside the Producer and Volunteer Coordinator. Provide an alternative contact for concerns involving the usual lead.\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, including Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n","full-structure":"**Earlier staffing reference:** This chapter describes the Director-based proposal. [Council Option 3](#council-option-3) sets out the alternative with Programme and Operations Coordinators, Design & Communications, and allocated or part-time support for Community & Care and Partnerships. These are alternative models for discussion, not cumulative staffing commitments.\n\n| Area | Role | Core responsibility |\n| --- | --- | --- |\n| Programme management | Programme Manager — Research, Residencies & Learning | Owns residencies, fellowships, research, educational relationships and participant support. |\n| Programme management | Programme Manager — Creative Experiences | Owns the public calendar and delivery coordination for exhibitions, music, film, workshops, walks, marketplaces and Kani Fest. |\n| Community engagement | Community Engagement & Outreach Coordinator | Maintains local relationships, coordinates participation and access, supports programme outreach and follows up on feedback across the pillars. |\n| Fundraising, partnerships and commercial development | Fundraising & Partnerships Manager | Owns the funding strategy and pipeline, funder relationships, grants, CSR partnerships, sponsorships, donors and institutional collaborations. |\n| Fundraising, partnerships and commercial development | Commercial & Bookings Executive | Manages enquiries, proposals, quotations, site visits, follow-up, confirmed bookings and client relationships. |\n| Fundraising, partnerships and commercial development | Proposal & Grant Writer | Develops applications, concept notes, CSR and sponsorship proposals, pitch material and narrative reports. |\n| Operations and technical delivery | Operations / Production Lead | Owns venue readiness, the master venue calendar, logistics, maintenance coordination, vendors and on-site delivery. |\n| Operations and technical delivery | AV & Technical Operator | Operates sound, projection and screening systems, maintains equipment and coordinates with specialist vendors. |\n| Design and communications | Design & Communications Lead | Owns visual communication, social media planning, audience outreach, announcements, newsletters, presentations and signage across all programmes. |\n| Design and communications | Student Design Intern | Supports production through a supervised rotating placement. |\n| Existing support teams | Accounts Team | Supports project owners and fundraising staff while retaining entity-specific approval procedures. |\n| Existing support teams | Hospitality Team | Works with production, programme and bookings staff on delivery. |\n\nAll continuing roles sit within one permanent working team led by the **Director of Creative Practice**. This is a growth model; appointments follow recurring need and funding rather than being simultaneous Year 1 hires.\n\n## Programme management\n\n- **Programme Manager — Research, Residencies & Learning:** Owns residencies, fellowships, research, educational relationships and participant support. Shapes the research and learning pipeline, from developing opportunities and selecting participants to coordinating mentors, partners and outcomes. Ensures participants receive clear support and that learning is documented and shared.\n\n- **Programme Manager — Creative Experiences:** Owns the public calendar and coordinates delivery for exhibitions, music, film, workshops, walks, marketplaces and Kani Fest. Works with the Programme Manager — Research, Residencies & Learning when projects produce public events, ensuring that each project has one named owner and clear delivery responsibilities.\n\nBoth report to the Director. Where a residency produces a public event, the two managers agree the handover and responsibilities for each part.\n\n## Community engagement and outreach\n\n**Community Engagement & Outreach Coordinator — reports to the Director**\n\nMaintains local and community relationships across programmes, coordinates participation and access support, keeps the shared relationship record and follows up on feedback. Works with programme managers on co-development and with Design & Communications on audience development. Programme owners retain responsibility for creative briefs, budgets, selections and commitments.\n\nIn Year 1 these duties are allocated to the Programme & Operations Coordinator with Director support. Establish the dedicated role when recurring relationships and participation work exceed that capacity and funding can sustain it. See [Outreach & Community Engagement](#outreach).\n\n## Fundraising, partnerships and commercial development\n\n**Fundraising & Partnerships Manager — reports to the Director**\n\nThis operational role works alongside the Advisory & Programme Council’s **Fundraising & Resource Development** advisory role. The advisor provides strategic guidance and relationships; the Manager owns day-to-day fundraising delivery, partnerships and reporting.\n\nOwns the funding strategy and pipeline, funder relationships, grants, CSR partnerships, sponsorships, donors and institutional collaborations. Oversees commercial development and coordinates funder reporting.\n\nReporting to this manager:\n\n- **Commercial & Bookings Executive:** Enquiries, proposals, quotations, site visits, follow-up, confirmed bookings and client relationships.\n\n- **Proposal & Grant Writer:** Applications, concept notes, CSR and sponsorship proposals, pitch material and narrative reports. Can remain external or retained.\n\nProgramme managers design and deliver funded activities and collect outcome evidence. Accounts supplies expenditure records and financial reporting. The Fundraising Manager coordinates the combined report and funder relationship.\n\n## Operations and technical delivery\n\n**Operations / Production Lead — reports to the Director**\n\nOwns venue readiness, the master venue calendar, logistics, maintenance coordination, vendors and on-site delivery.\n\n- **AV & Technical Operator — reports to the Operations Lead:** Operates sound, projection and screening systems, maintains equipment and coordinates with specialist vendors.\n\n- External production partners provide additional capacity per project.\n\n## Design and communications\n\n**Design & Communications Lead — reports to the Director**\n\nOwns visual communication, social media planning, audience outreach, announcements, newsletters, presentations and signage across all programmes.\n\n- **Student Design Intern — reports to the Design Lead:** Supports production through a supervised rotating placement.\n\n- Programme owners provide accurate information; the communications lead coordinates public-facing editing and approval.\n\n- Editors own publication manuscripts and editorial quality. Publication design is planned with the design team.\n\n- Photography, recording and editing receive allocated time or commissioned support.\n\n## Existing support teams\n\n- **Accounts Team:** Operationally coordinated under the Director; works with project owners and fundraising staff while retaining entity-specific approval procedures.\n\n- **Hospitality Team:** Operationally coordinated under the Director; works with production, programme and bookings staff on delivery.\n\n## Kani Fest project team\n\nThe Festival Curator and Festival Producer work alongside one another under the Director. Proposed 6–9 month paid curatorial fellows develop the tracks; the Producer coordinates programme scheduling, technical infrastructure, venue/session leads, artist liaison and volunteer coordination. These are edition appointments or allocated responsibilities, not automatic additions to the permanent team. The permanent coordinator in Year 1, or Creative Experiences Programme Manager at scale, holds continuity between editions. See the [festival working map and role explainers](#kani-fest).\n\n## Heart & Wellness\n\nA shared function with a named coordinator accountable to the Director, supporting staff, fellows, project teams and volunteers across Kani. It coordinates welcome, check-ins, recognition, listening and practical care. It can be allocated within an existing role initially; dedicated capacity follows workload and funding. All team leads retain responsibility for respectful working, realistic workloads and follow-through on concerns. See [Shared Infrastructure](#infrastructure).\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, including Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n","growth":"**Earlier staffing reference:** This chapter describes the Director-based proposal. [Council Option 3](#council-option-3) sets out the alternative with Programme and Operations Coordinators, Design & Communications, and allocated or part-time support for Community & Care and Partnerships. These are alternative models for discussion, not cumulative staffing commitments.\n\nGrowth follows recurring work and funding rather than a fixed hiring sequence.\n\n| Trigger | Staffing response |\n|---|---|\n| Credible funding opportunities require sustained follow-up. | Make Fundraising & Partnerships Manager permanent. |\n| Residencies, public programmes and commercial hires regularly overlap. | Separate programme management from operations/production coordination. |\n| Community relationships, participation support and follow-up become sustained work beyond the programme coordinator’s capacity. | Add a Community Engagement & Outreach Coordinator reporting to the Director, with recurring funding and a defined cross-programme remit. |\n| Technical activity becomes frequent and predictable. | Bring in a permanent AV & Technical Operator. |\n| Commercial enquiries and bookings become a substantial recurring business. | Add a Commercial & Bookings Executive under Fundraising & Partnerships. |\n| Research and public programmes each sustain a funded calendar. | Create dedicated managers for Research, Residencies & Learning and Creative Experiences. |\n| Publication work becomes a sustained, funded annual programme. | Expand the editor’s retained time; consider a continuing publishing role only when justified. |\n| Festival or marketplace peaks exceed normal capacity. | Add temporary producers, coordinators and crew through the relevant programme budget. |\n\nBefore each permanent addition, confirm recurring need, a clear reporting line and visibility of funding for the role’s full cost over the following 12 months. This is a proposed planning rule, not a commitment to hire.\n\nFor Kani Fest, returning volunteers may take defined team-captain responsibilities with training and staff support. Sustained work across the year should become a scoped, funded associate or fellowship opportunity where justified. This is an optional pathway based on interest, readiness and available roles, not a guaranteed promotion. See [Kani Fest](#kani-fest).\n\nReview capacity for Heart & Wellness as staff, fellows, volunteers and project teams grow. Begin with a named coordinator and allocated time; add dedicated support when recurring need and funding justify it.\n\n[Heart & Wellness](#heart-wellness) also holds programmes for growth, wellbeing and becoming, including Nurupa in development. Each initiative needs a defined brief, named lead and funded delivery capacity; detailed arrangements remain open.\n\n"}};

  function chartFromText(text, explanations, kind='chart') {
    const figure=document.createElement('figure');figure.className='org-chart map-'+kind;
    const caption=document.createElement('figcaption');caption.textContent=({chart:'Project structure',support:'Shared support · works with both festival leads',flow:'Follow the steps'})[kind]+' · Select a box';figure.append(caption);

      if(!line.trim())continue;

      if(!match||match[1].length%2)return null;
      const depth=match[1].length/2;if(depth>6||depth>depthBefore+1||(!previous&&depth!==0)||(kind!=='chart'&&depth!==0))return null;
      if(depth>depthBefore){const children=document.createElement('ul');previous.append(children);lists[depth]=children;}
      const item=document.createElement('li'),card=document.createElement('button');card.type='button';card.className='org-node';
      const [rawTitle,...notes]=match[2].split('|');const title=rawTitle.trim(),note=notes.join('|').trim();
      if(depth===1)tone=title==='Festival Curator'?'creative':title==='Festival Producer'?'delivery':'';

      card.setAttribute('aria-haspopup','dialog');card.setAttribute('aria-label',title+' — read explainer');
      const details=explanations.get(title)||[{label:'About this role',text:note||'See the roles and working arrangements in this chapter.'}];
      card.onclick=()=>showExplainer(title,note,details,card);

  }
  function unifiedMapFromText(text, explanations, expanded=false) {

    if(links.some(x=>!x))return null;
    const figure=document.createElement('figure');figure.className='unified-map draggable-map';

    const controls=document.createElement('div');controls.className='map-view-controls';
    function control(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;controls.append(b);return b;}
    if(!expanded)control('Expand map ↗',()=>{
      if(mapDialog)mapDialog.remove();
      mapDialog=document.createElement('dialog');mapDialog.className='map-dialog';mapDialog.setAttribute('aria-label','Expanded Kani Fest map');
      const close=document.createElement('button');close.type='button';close.className='map-close';close.textContent='Close expanded map ×';close.onclick=()=>mapDialog.close();
      const expandedMap=unifiedMapFromText(text,explanations,true);if(!expandedMap)return;
      mapDialog.append(close,expandedMap);document.body.append(mapDialog);mapDialog.addEventListener('close',()=>{document.body.classList.remove('map-open');if(figure.isConnected)controls.querySelector('button').focus({preventScroll:true});});
      mapDialog.showModal();document.body.classList.add('map-open');close.focus();
    });
    const scroll=document.createElement('div');scroll.className='map-viewport';scroll.tabIndex=0;scroll.setAttribute('role','region');scroll.setAttribute('aria-label','Draggable festival map. Drag the background or use arrow keys to pan. Select a role for details.');
    const stage=document.createElement('div');stage.className='map-stage';
    const canvas=document.createElement('div');canvas.className='map-canvas prose';
    const top=document.createElement('div');top.className='map-organisation';
    const team=chartFromText(sections.get('Festival team').join('\n'),explanations,'chart');
    const shared=chartFromText(sections.get('Shared resources').join('\n'),explanations,'support');if(!team||!shared)return null;
    team.querySelector('figcaption').textContent='Festival team';shared.querySelector('figcaption').textContent='Shared resources';
    top.append(team,shared);canvas.append(top);stage.append(canvas);scroll.append(stage);
    const nodeMap=new Map([...canvas.querySelectorAll('.org-node')].map(el=>[el.querySelector('strong').textContent,el]));nodeMap.set('Shared resources',shared);
    if(links.some(x=>!nodeMap.has(x.from)||!nodeMap.has(x.to)))return null;
    const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.classList.add('collaboration-lines');svg.setAttribute('aria-hidden','true');canvas.prepend(svg);
    let scale=1,naturalHeight=700;
    const status=document.createElement('span');status.className='map-zoom-status';status.setAttribute('aria-live','polite');
    function setScale(next,center=true){
      const cx=(scroll.scrollLeft+scroll.clientWidth/2)/scale,cy=(scroll.scrollTop+scroll.clientHeight/2)/scale;
      scale=Math.max(.15,Math.min(2,next));canvas.style.transform='scale('+scale+')';stage.style.width=(1260*scale)+'px';stage.style.height=(naturalHeight*scale)+'px';status.textContent=Math.round(scale*100)+'%';
      if(center){scroll.scrollLeft=cx*scale-scroll.clientWidth/2;scroll.scrollTop=cy*scale-scroll.clientHeight/2;}
    }
    function fit(){naturalHeight=canvas.offsetHeight;setScale(Math.min(1,(scroll.clientWidth-24)/1260,(scroll.clientHeight-24)/naturalHeight),false);scroll.scrollLeft=0;scroll.scrollTop=0;}
    control('−',()=>setScale(scale/1.2)).setAttribute('aria-label','Zoom out');
    control('+',()=>setScale(scale*1.2)).setAttribute('aria-label','Zoom in');
    control('100%',()=>setScale(1));control('Reset view',fit);controls.append(status);header.append(controls);figure.append(header);
    const hint=document.createElement('p');hint.className='map-instructions';hint.textContent='Drag background to move · + / − to zoom · Click a box for details';figure.append(hint,scroll);
    const legend=document.createElement('p');legend.className='collaboration-key';
    legend.textContent='Solid lines show project accountability. Dotted lines indicate collaboration and shared support.';figure.append(legend);
    function drawLines(){
      if(!figure.isConnected)return;
      const base=canvas.getBoundingClientRect();const factor=base.width/1260;
      if(!factor)return;
      const box=el=>{const r=el.getBoundingClientRect();return{x:(r.left-base.left)/factor,y:(r.top-base.top)/factor,w:r.width/factor,h:r.height/factor};};
      svg.replaceChildren();svg.setAttribute('viewBox','0 0 1260 '+canvas.offsetHeight);svg.setAttribute('width','1260');svg.setAttribute('height',String(canvas.offsetHeight));
      links.forEach(link=>{

        if(link.from==='Shared resources'){

        }else{
          const y=Math.min(a.y,b.y)-16;

        }

        for(const cls of ['collab-halo','collab-path']){const path=document.createElementNS(ns,'path');path.setAttribute('d',d);path.setAttribute('class',cls);g.append(path);}

    }
    let pan=null;
    scroll.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button'))return;pan={id:e.pointerId,x:e.clientX,y:e.clientY,left:scroll.scrollLeft,top:scroll.scrollTop};scroll.setPointerCapture(e.pointerId);scroll.classList.add('is-dragging');scroll.focus({preventScroll:true});e.preventDefault();});

  }
  function structureMapFromText(text) {
    const entries=text.trim().split('\n').filter(Boolean).map(line=>{
      const match=line.trim().match(/^- \[([^\]]+)\]\((#[a-z0-9-]+)\)\s*\|\s*(.+)$/i);
