.ethos-card strong{display:block;margin-bottom:5px;font-size:15px}
.structure-synopsis-map{margin:26px 0 28px;padding:26px;background:#f2f4ec;border:1px solid var(--line);border-radius:10px;text-align:center}
.structure-synopsis-map figcaption{margin:0 0 22px;color:var(--muted);font-size:10px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase}
.structure-synopsis-card{display:block;max-width:670px;margin:0 auto;padding:18px 21px;border:1px solid #bdcbb7;border-radius:7px;background:#fffefa;color:var(--ink);text-align:left;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.structure-synopsis-card:hover{transform:translateY(-2px);border-color:var(--green);box-shadow:0 5px 18px #253d3316}
.structure-synopsis-card strong{display:block;font:22px/1.25 Georgia,serif;margin-bottom:7px}
.structure-synopsis-card span{display:block;color:var(--muted);font-size:13px;line-height:1.55}
.structure-synopsis-card small{display:block;margin-top:10px;color:var(--green);font-size:11px;font-weight:bold}
.structure-synopsis-card.is-advisory{border-style:dashed;background:#f8f6ed}
.structure-synopsis-card.is-council{background:var(--green);border-color:var(--green);color:#fffefa}
.structure-synopsis-card.is-council span,.structure-synopsis-card.is-council small{color:#e8efe6}
.structure-connector{position:relative;margin:0 auto;padding:19px 0 17px;color:var(--muted);font-size:10px;font-weight:bold;letter-spacing:.7px;text-transform:uppercase}
.structure-connector:before{content:'';position:absolute;left:50%;top:0;height:15px;border-left:1px solid #879a80}
.structure-connector:after{content:'↓';display:block;position:absolute;left:calc(50% - 7px);bottom:-2px;color:var(--green);font-size:15px}
.structure-team-branches{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding-top:21px}
.structure-team-branches:before{content:'';position:absolute;left:25%;right:25%;top:0;border-top:1px solid #879a80}
.structure-team-branches .structure-synopsis-card{position:relative;width:100%;height:100%}
.structure-team-branches .structure-synopsis-card:before{content:'';position:absolute;left:50%;top:-22px;height:21px;border-left:1px solid #879a80}
@media(max-width:700px){.prose .ethos-grid,.structure-team-branches{grid-template-columns:1fr}.prose .ethos-card:first-child{grid-column:auto}.structure-synopsis-map{padding:20px 15px}.structure-team-branches{gap:14px}.structure-team-branches:before{left:50%;right:auto;height:100%;border-top:0;border-left:1px solid #879a80}.structure-team-branches .structure-synopsis-card:before{left:-16px;top:50%;width:15px;height:0;border-left:0;border-top:1px solid #879a80}.structure-synopsis-card strong{font-size:20px}}
@media print{.prose .ethos-grid{grid-template-columns:repeat(2,1fr)}.prose .ethos-card:first-child{grid-column:1/-1;background:white;color:var(--ink);border:2px solid var(--green)}.structure-synopsis-map{background:white;break-inside:avoid}.structure-synopsis-card.is-council{background:white;color:var(--ink);border:2px solid var(--green)}.structure-synopsis-card.is-council span,.structure-synopsis-card.is-council small{color:var(--muted)}}

/* Shared foundation spanning the three pillars */
.heart-foundation{grid-column:1/-1;padding:23px 26px;background:var(--green);color:#fffefa;border:1px solid var(--green);border-radius:6px;text-align:center}
.heart-foundation h2{font:600 13px/1.5 Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 7px}
.heart-foundation p{font-size:15px;line-height:1.6;margin:0;color:#eef2e9}
@media(max-width:760px){.heart-foundation{padding:21px 18px}.heart-foundation h2{font-size:12px}.heart-foundation p{font-size:14px}}
@media print{.heart-foundation{background:white;color:#172b21;border:2px solid #305b47;break-inside:avoid}.heart-foundation p{color:#172b21}}
</style>

l review and relationships."},{"id":"structure-working-team","title":"Working Team","group":"The Structure","file":"structure-working-team.md","description":"Starting roles, shared responsibilities and growth with capacity."},{"id":"structure-programme-teams","title":"Programme Teams","group":"The Structure","file":"structure-programme-teams.md","description":"How Kanifest and other initiatives connect to Kani."},{"id":"structure-operations","title":"Operations & Resources","group":"The Structure","file":"structure-operations.md","description":"Partnerships, budgets, spaces, equipment and shared services."},{"id":"structure-decisions","title":"Decision-making","group":"The Structure","file":"structure-decisions.md","description":"Who decides, how agreement is reached and when to escalate."},{"id":"structure-resolution","title":"Disagreements & Resolution","group":"The Structure","file":"structure-resolution.md","description":"Working disagreements, confidential concerns and impartial review."},{"id":"heart-wellness","title":"Heart & Wellness","group":"Heart & Wellness","file":"heart-wellness.md","description":"Our shared foundation, with programmes for wellbeing, growth and becoming."},{"id":"infrastructure","title":"Shared infrastructure & capabilities","group":"Shared Infrastructure","file":"infrastructure.md","description":"Spaces, equipment and services supporting all programmes."},{"id":"platforms","title":"Platforms","group":"Platforms","file":"platforms.md","description":"Continuing structures that hold related programmes, projects and editions."},{"id":"kani-fest","title":"Kani Fest","group":"Platforms","file":"kani-fest.md","description":"A fresh curatorial proposition for each festival edition."},{"id":"publications","title":"Kani Publications","group":"Platforms","file":"publications.md","description":"A year-round publishing programme across the three pillars."},{"id":"marketplaces","title":"Curated Marketplaces","group":"Platforms","file":"marketplaces.md","description":"Artisans, makers, demonstrations and public exchange."},{"id":"new-initiatives","title":"Developing new initiatives","group":"Platforms","file":"new-initiatives.md","description":"Pilot, learn and establish what deserves to continue."},{"id":"learnings-feedback","title":"Learnings & Feedback","group":"Learnings & Feedback","file":"learnings-feedback.md","description":"Programme learning and an evolving record of feedback. Collection is ongoing."},{"id":"structure-archive","title":"Earlier Structures","group":"Review & Editing","file":"structure-archive.md","description":"Archived council, governance and staffing proposals."},{"id":"open-decisions","title":"Open decisions","group":"Review & Editing","file":"open-decisions.md","description":""},{"id":"version-history","title":"Version history","group":"Review & Editing","file":"version-history.md","description":"A record of how the thinking develops."},{"id":"document-plan","title":"Document review checklist","group":"Review & Editing","file":"document-plan.md","description":""},{"id":"editing","title":"How to edit and share","group":"Review & Editing","file":"editing.md","description":""},{"id":"entities","title":"Enabling entities (archived)","group":"Archive · Earlier Structures","file":"entities.md","description":"The organisations that enable the work.","archived":true},{"id":"council","title":"Council · Option 1 (archived)","group":"Archive · Earlier Structures","file":"council.md","description":"Seven advisory areas. One-year appointments, reviewed annually.","archived":true},{"id":"council-option-2","title":"Council · Option 2 (archived)","group":"Archive · Earlier Structures","file":"council-option-2.md","description":"A participatory council with advisors, curators, community and youth representatives.","archived":true},{"id":"council-option-3","title":"Council · Option 3 (archived)","group":"Archive · Earlier Structures","file":"council-option-3.md","description":"Shared stewardship, six advisors and a light Working Coordination Group.","archived":true},{"id":"decisions","title":"Decision rights (archived)","group":"Archive · Earlier Structures","file":"decisions.md","description":"Clear ownership for direction, creative decisions and delivery.","archived":true},{"id":"year-one","title":"Year 1 · Minimum team (archived)","group":"Archive · Earlier Structures","file":"year-one.md","description":"Three permanent hires, existing teams and defined specialist support.","archived":true},{"id":"full-structure","title":"Full structure (archived)","group":"Archive · Earlier Structures","file":"full-structure.md","description":"Dedicated capacity as programmes and recurring work grow.","archived":true},{"id":"growth","title":"How the team grows (archived)","group":"Archive · Earlier Structures","file":"growth.md","description":"Add people in response to sustained work and funding.","archived":true}],"settings":{"title":"Kani Manifesto","repository":"bhaumikdebanshu/KaniManifesto","branch":"main","version":"v0.11","stage":"Revised draft","updated":"12 November 2026","kicker":"An evolving manifesto","foundation":{"title":"Heart — our shared foundation","description":"Everything begins with heart and grace. We create space for people to discover their potential, nurture their practice and grow together."}},"content":{"home":"## Our ethos\n\nKani Home is a place for creative practice, research, learning and public exchange. It brings artists, designers, architects, researchers, craftspeople, musicians, ecologists, climate practitioners, heritage specialists, technologists and communities into conversation, creating space for both sustained enquiry and shared experiences.\n\nIts work is guided by:\n\n- **Heart & grace:** Bring care, openness and respect to everything we do. Support people in exploring who they are and who they wish to become, through reflection, creative practice and community.\n\n- **Community participation:** Develop programmes with local people, practitioners and knowledge holders.\n\n- **Experimentation:** Support exploration, making, testing and work whose outcomes are not predetermined.\n\n- **Ecological responsibility:** Engage with climate, water, materials and the relationships between people and their environments.\n\n- **Exchange across disciplines:** Connect art, design, craft, music, research and technology.\n\n- **Continuity of knowledge:** Document, publish and share work so that learning continues beyond an event or residency.\n\n- **Sustainable operation:** Develop earned income and external support that sustain the place, its people and its programme.\n\n## How we work together — a transdisciplinary practice\n\nKani brings different disciplines and forms of knowledge into shared enquiry. An artisan, technologist, researcher and local community might shape a project together, each influencing its questions, methods and outcomes. The three pillars give this work a structure while allowing projects to move between learning, public exchange and commissioned experiences.\n\n[Outreach & Community Engagement](#outreach) builds the continuing relationships that make this participation possible, from listening and co-developing ideas to supporting access and following up after a programme.\n\n[Heart](#heart-wellness) is both our way of being together and a space for growth. Through programmes such as Nurupa, we bring reflection, play, creative practice and mentorship together, helping people explore their potential and how they contribute to the world around them.\n\n## Structure Synopsis\n\nThree pillars guide what Kani does. Four connected groups shape how the work is supported, governed and delivered.\n\n```kani-structure\n- [Advisory Circle](#structure-advisory) | Offers specialist knowledge, mentoring, critical review and relationships. It advises without becoming a management or governing layer.\n- [Kani Council](#structure-governance) | Holds the shared direction, agrees priorities and resource allocations, and remains accountable for how the organisation works.\n- [Kani Working Team](#structure-working-team) | Maintains year-round programmes, relationships, spaces and systems, and carries organisational continuity.\n- [Programme Teams](#structure-programme-teams) | Develop and deliver particular initiatives within an agreed brief, budget and period of work.\n```\n\nThe Advisory Circle strengthens the Council with knowledge and relationships; the Council gives the teams clear mandates and resources. The Working Team carries continuity, while Programme Teams gather around specific work. [Explore the complete structure](#structure) or [browse earlier proposals](#structure-archive).\n\n\n","framework":"Kani’s programme framework helps us understand what kinds of work Kani undertakes, how different activities connect and what deserves to continue over time.\n\nIt has three connected elements:\n\n- **Pillars** describe the purpose of the work.\n- **Programmes** are the activities and projects Kani develops.\n- **Platforms** are named, continuing structures that can hold multiple programmes, projects and editions.\n\n## What kinds of work does Kani undertake?\n\nKani’s work is organised through three pillars:\n\n| Pillar | Purpose |\n|---|---|\n| **Research, Residencies & Learning** | Develop knowledge, creative practices, skills and new forms of enquiry. |\n| **Creative Experiences** | Bring people together through art, culture, ideas and making. |\n| **Commercial Experiences & Space Hire** | Generate income through commissioned experiences, hospitality and the use of Kani’s spaces. |\n\nThe pillars help us understand the primary purpose of a programme.\n\n## What holds this work together?\n\nHeart and grace form the foundation of all three pillars.\n\nCommunity participation, experimentation, ecological responsibility, transdisciplinary exchange, continuity of knowledge and sustainable operation shape how programmes are developed and delivered.\n\nThese principles apply whether the programme is a residency, festival, publication, gathering, workshop, marketplace, meal or commercial engagement.\n\n## What is the difference between a pillar, a programme and a platform?\n\n- **Pillars** describe why the work exists.\n- **Programmes** are the actual activities and projects being undertaken.\n- **Platforms** are recognisable, continuing structures through which related programmes can develop over time.\n\nA platform may hold multiple editions, projects, gatherings, collaborations and outputs.\n\nFor example, Creative Experiences is a pillar. Kanifest is a platform. A particular edition of Kanifest is a programme developed within that platform.\n\nPlatforms draw on Kani’s shared Working Team, spaces, infrastructure and programme-specific appointments.\n\nFormats such as exhibitions, workshops, residencies, meals, performances and publications do not automatically become platforms. They are ways in which programmes can take form.\n\n## Can a programme belong to more than one pillar?\n\nYes. Transdisciplinary programmes can move between research, public exchange and commissioned or income-generating activity.\n\nA residency might bring an artisan, technologist and local knowledge holder together to explore a question. Their research could become an exhibition, workshop or publication. An institution might later commission a related learning experience.\n\nThe same enquiry can move across the pillars without losing its original purpose.\n\n## Can a platform work across more than one pillar?\n\nYes. A platform can hold different kinds of programmes.\n\nKani Publications may document research, produce an artist publication and undertake a commissioned editorial project. Kani Canteen and Food Lab may research local ingredients, host community meals and develop paid food experiences.\n\nThis movement across the pillars is central to Kani’s transdisciplinary approach.\n\n## What are the current platforms?\n\n| Platform | What it holds |\n|---|---|\n| **Kanifest** | An interdisciplinary festival developed through distinct editions, curatorial propositions and community participation. |\n| **Kani Publications** | Editorial projects, research outputs, field notes, books and other forms of documented knowledge. |\n| **Curated Marketplaces** | Recurring encounters connecting artisans, makers, demonstrations, workshops and cultural programming. |\n| **Sunset Baithaks** | Intimate sunset gatherings around music, poetry, performance, conversation and collective listening. |\n| **Kani Canteen and Food Lab** | A space for food experimentation, shared meals, local ingredients, culinary knowledge and feeding the community. |\n\nOther platforms may emerge as Kani’s work develops. Not every workshop, exhibition, residency, gathering or event needs to become a platform.\n\n## How does Kani decide what to programme?\n\nA proposed programme should have:\n\n- A clear relationship to Kani’s ethos and one or more pillars\n- Relevance to a community, audience or field of enquiry\n- A named creative owner and delivery owner\n- Realistic time, resources and funding\n- An approach to participation, access and care\n- A plan for documentation, reflection or continued learning\n\nProgrammes can begin as small experiments. They may be repeated, revised, expanded or allowed to conclude. See [Programme Selection](#programme-selection) for the complete process.\n\n## When does a programme become a platform?\n\nA programme can develop into a platform when it has:\n\n- A clear purpose and recognisable identity\n- A reason to continue beyond a single event or project\n- The capacity to hold multiple programmes, editions or collaborations\n- A named owner\n- A realistic resource and funding model\n- A way to carry relationships, documentation and learning forward\n\nBecoming a platform is not automatically a measure of success. Some of Kani’s most meaningful programmes may remain temporary, experimental or specific to a particular place and moment.\n","research":"Develop knowledge, creative practices, skills and new ways of working.\n\n| Activity area | Possible activities |\n|---|---|\n| Residencies & fellowships | Artist, designer and researcher residencies; interdisciplinary collaborations; supported periods of enquiry and practice development. |\n| Ecology & futures research | Water, climate, local ecologies, sustainability and speculative futures. |\n| Craft & material innovation | Artisan collaborations, material experiments, craft processes, sustainable production and documentation. |\n| AI, AR & emerging technologies | Creative AI, local-language tools, augmented-reality interpretation, interactive media, physical computing and critical enquiry into technology’s social implications. |\n| Living knowledge & archives | Oral histories, community-led archives, craft documentation and digital storytelling. |\n| Learning & skills exchange | Mentorship, student programmes, educational partnerships, field schools, workshops and hands-on research labs. |\n| Reflective practice & personal growth | Heart programmes such as Nurupa connect self-enquiry, mentored creative practice and community learning, through residential or hybrid formats. |\n| Research publication & dissemination | Essays, papers, field notes, toolkits and other research outputs developed through Kani Publications. |\n\nResearch programmes can produce exhibitions, performances, publications, prototypes and public discussions. Appropriate specialists are engaged per project; emerging technology work does not initially require a permanent technology department.\n\n\nSee [Heart & Wellness](#heart-wellness) for programme intent and working arrangements.\n","creative-experiences":"Bring people together through public encounters with art, culture, ideas and making.\n\n| Activity area | Possible activities |\n|---|---|\n| Kani Fest | An interdisciplinary festival with curators appointed for each edition. |\n| Exhibitions & open studios | Art, design, installations, work-in-progress presentations and residency outcomes. |\n| Music, performance & poetry | Baithaks, concerts, theatre, readings, experimental sound and audiovisual collaborations. |\n| Film & public conversations | Screenings, filmmaker discussions, talks, panels and debates. |\n| Workshops & heritage walks | Participatory making, demonstrations and walks developed with local knowledge holders. |\n| Curated marketplaces | Selected artisans and makers, themed editions, demonstrations, workshops and associated cultural programming. |\n| Heart gatherings & creative sharing | Reflective circles, participatory gatherings and optional showcases emerging from Heart programmes such as Nurupa; developed with participant consent. |\n| Publication encounters | Book launches, readings, editorial conversations and exhibitions connected to Kani Publications. |\n\nTicketed public events and curated marketplaces remain within Creative Experiences. Charging for participation does not automatically move a programme into the commercial pillar.\n\n","commercial":"Generate earned income through hospitality, spaces and commissioned experiences.\n\n| Activity area | Possible activities |\n|---|---|\n| Corporate retreats & offsites | Residential or day programmes combining meetings, stays and creative experiences. |\n| Commissioned experiences | Tailored craft, culture and creative-learning programmes for clients and institutions. |\n| Gallery & event-space hire | Client exhibitions, presentations and private events. |\n| Screening & AV-room hire | Private screenings, presentations and facilitated sessions. |\n| Office & meeting-space hire | Workspace, conference rooms and short-term team bookings. |\n| Creative hospitality & stays | Guest stays, catering and residential programme packages tied to creative, cultural or learning experiences. |\n| Commissioned publications | Partner-supported or commissioned editions developed with Kani Publications under an agreed editorial brief. |\n\nEach commercial engagement has an agreed scope, price, delivery owner and allocation of space and staff. Public-interest programming and commercial bookings share a coordinated calendar.\n","outreach":"## Purpose\n\nOutreach builds continuing relationships across all three pillars. Communications tells people what is happening; outreach helps people enter, shape and remain connected to the work.\n\n## Four commitments\n\n1. **Name an owner.** Every programme identifies who builds relationships and who follows up afterwards.\n2. **Provide time and access support.** Outreach begins during programme development and budgets for visits, language, travel or other participation needs where relevant.\n3. **Keep a shared relationship record.** Record interests, commitments and follow-ups with consent for continued contact. Personal contact details stay in an appropriate internal system.\n4. **Close the feedback loop.** Record what was heard, what changed and who will respond.\n\n## Who carries the work\n\nThe person holding **Community & Care** maintains local continuity. Programme leads remain responsible for commitments made through their work. Design & Communications supports audience information. The Partnerships lead maintains institutional and funding relationships.\n\nBusy programmes budget for additional outreach capacity. Volunteer coordination remains a distinct delivery responsibility within Kanifest and other large events.\n\n| Platform | Outreach focus |\n|---|---|\n| **Kanifest** | Local participation, invitations, access and relationships beyond the edition. |\n| **Kani Publications** | Contributor relationships, credit, permissions and routes to intended readers. |\n| **Curated Marketplaces** | Sustained artisan and maker relationships, accessible applications and participant feedback. |\n\nSee [Working Team](#structure-working-team) for continuing responsibility, [Operations & Resources](#structure-operations) for institutional partnerships, and [Learnings & Feedback](#learnings-feedback) for programme learning.\n","programme-selection":"This process helps Kani choose what to develop while leaving room for experimentation, community proposals and unexpected collaborations. It should make decisions understandable without turning every idea into a competitive application.\n\n## What does this process select?\n\nIt selects the programmes Kani will develop, support or host. These may include residencies, exhibitions, workshops, gatherings, research projects, publications, meals, commissioned experiences and other forms of work.\n\nThe selection of individual artists, residents, fellows, contributors or vendors happens within the approved programme’s own brief. That process must state its criteria, decision-makers, support and conflicts of interest.\n\n## How can an idea enter?\n\nAn idea may come from:\n\n- The Working Team or a Programme Team\n- Community members and local practitioners\n- The Advisory Circle or Council\n- An artist, researcher, institution or potential partner\n- An open call, invitation or commissioned opportunity\n- Learning from an earlier programme\n\nNo route gives an idea automatic priority. Invited and partner-supported proposals still need an alignment and capacity review.\n\n## What information is needed?\n\nBegin with a short programme note that explains:\n\n- The central idea or enquiry\n- Its relationship to Kani’s ethos and pillars\n- Who it is for and who should help shape it\n- The proposed creative owner and delivery owner\n- Likely activities, outputs and timeline\n- Space, people, equipment and partnership needs\n- An initial budget and possible source of funds\n- Participation, access, care and ecological considerations\n- What should be documented or learned\n\nEarly ideas do not need a complete proposal. The note should be detailed enough to decide whether further development is worthwhile.\n\n## Who reviews an idea?\n\nThe **Programme Coordinator** holds the process and brings together the people needed for the review.\n\n- The relevant creative lead considers purpose, quality and programme fit.\n- The Operations Coordinator checks space, timing, staffing and technical capacity.\n- Partnerships and Accounts contribute where funding, contracts or reporting are involved.\n- Community members or relevant practitioners are included when the work affects or represents them.\n- Advisors may contribute specialist knowledge or relationships.\n- The Council considers only proposals that change Kani’s direction, require a major allocation or create commitments beyond the team’s mandate.\n\nThe people who develop an idea can join the discussion, but the decision and its reasons should not rest with one person alone.\n\n## What questions guide selection?\n\n| Question | What to consider |\n|---|---|\n| **Does it belong at Kani?** | Connection to the ethos, pillars, place and longer direction. |\n| **Who finds it meaningful?** | Relevance to communities, participants, practitioners or a field of enquiry. |\n| **Does it invite genuine exchange?** | Participation, transdisciplinary possibility and whose knowledge shapes the work. |\n| **Can it be cared for well?** | Access, consent, wellbeing, fair compensation and realistic workloads. |\n| **Can it be delivered?** | Time, people, space, equipment, permissions and operational complexity. |\n| **Can it be sustained financially?** | Budget, funding route, earned income where appropriate and the full cost to Kani. |\n| **What will remain?** | Learning, relationships, documentation, public value or a reason to continue. |\n\nThese questions support judgement; they are not a mechanical score. A small local experiment may be more valuable than a larger, better-funded proposal.\n\n## What decisions can be made?\n\n| Decision | Meaning |\n|---|---|\n| **Develop** | The idea is promising and receives time to prepare a fuller brief. |\n| **Pilot** | Test the idea at a limited scale before making a larger commitment. |\n| **Proceed** | Confirm the brief, owners, budget, authority and review point. |\n| **Revise** | Return with specific changes to scope, method, partnerships or resources. |\n| **Hold** | Keep the idea for a more suitable time or funding opportunity. |\n| **Decline** | Do not proceed, with a short and respectful reason. |\n\nEvery decision identifies who communicates the outcome and what happens next.\n\n## How are fairness and accountability protected?\n\nAnyone involved in a decision declares personal, financial or professional conflicts. A conflicted person can contribute factual context but does not make the final decision.\n\nSelection criteria and decision-makers are stated in advance for open calls and paid opportunities. Applicants receive clear information about the process, timeline, available support and expected commitments. Sensitive personal information remains private.\n\nKani keeps a short internal decision record: the proposal, people consulted, decision, reasons, conditions and review point. Public communication can use an appropriate summary.\n\n## What happens after selection?\n\nBefore work begins, the programme receives an agreed brief, named owners, budget, authority, schedule and review point. Selection is not permission to exceed these boundaries.\n\nAfter delivery, the team reviews value, participation, workload, finances, relationships and learning. The programme may conclude, be repeated, be revised or—when there is a clear reason and capacity to continue—develop into a platform.\n","structure":"**Current proposal—for discussion.** This structure has not yet been adopted. See [Earlier Structures](#structure-archive) for the previous council and staffing proposals.\n\nKani Home brings together creative practice, learning, community and enterprise. Its structure should help people take responsibility, work together and care for the place without concentrating every decision in one person.\n\nKani works through four connected parts:\n\n| Part | Main responsibility |\n|---|---|\n| **Kani Council** | Holds the shared direction, agrees priorities and overall resource allocations, and reviews how the organisation is working. |\n| **Advisory Circle** | Brings specialist knowledge, mentoring, critical review and relationships without becoming another management layer. |\n| **Kani Working Team** | Maintains the year-round programmes, relationships, spaces and systems that make the work possible. |\n| **Programme Teams** | Develop and deliver particular initiatives, including Kanifest, residencies, publications, marketplaces and Heart programmes. |\n\nThe council gives teams a clear mandate and resources. The Advisory Circle strengthens the work through expertise and relationships. Teams make decisions within their mandate and bring back learning, concerns and proposals.\n\n## Shared responsibility\n\nAuthority follows responsibility. A curator can make artistic decisions within an agreed brief. A producer can organise delivery within an agreed plan. The working team can manage everyday operations without taking every matter to the council.\n\nDecisions return to the council when they change Kani’s direction, require substantial additional resources or create commitments beyond a team’s authority.\n\nEvery programme and continuing function has a named owner. Shared governance should make responsibility easier to understand.\n\n## Heart as the foundation\n\n**Whatever we do, we do with heart and grace.**\n\nThis shapes how people are welcomed, how work is distributed, how disagreement is handled and how we recognise contributions. Heart also holds programmes for wellbeing, growth and becoming, with their own briefs and delivery support.\n\nCare is a responsibility across the organisation. It includes realistic workloads, fair compensation, accessible participation and space to raise concerns. See [Heart & Wellness](#heart-wellness).\n\n## Starting small\n\nThe proposed starting structure is:\n\n- A seven-member council.\n- An Advisory Circle covering six areas of expertise.\n- Three continuing working roles, supported by existing accounts and hospitality teams.\n- Allocated or retained support for partnerships and community care.\n- Funded programme teams appointed according to need.\n\nReview the structure after six months. Add roles when sustained work and available funding justify them.\n\n## Explore the structure\n\n| Page | What it covers |\n|---|---|\n| [Governance](#structure-governance) | Council membership, selection, convening and accountability. |\n| [Advisory Circle](#structure-advisory) | Expertise, mentoring, review and institutional relationships. |\n| [Working Team](#structure-working-team) | Continuing roles, support and how capacity grows. |\n| [Programme Teams](#structure-programme-teams) | Kanifest and other initiatives: creative responsibility, delivery and handover. |\n| [Operations & Resources](#structure-operations) | Partnerships, budgets, spaces, equipment and shared services. |\n| [Decision-making](#structure-decisions) | Who decides, how agreement is reached and when matters are escalated. |\n| [Disagreements & Resolution](#structure-resolution) | Working disagreements, confidential concerns and impartial review. |\n","structure-governance":"**Current proposal—for discussion.**\n\nThe Kani Council holds responsibility for the organisation’s shared direction and accountability. It connects people doing the work with community perspectives and external experience.\n\n## Council membership\n\n| Members | Seats | Contribution |\n|---|---:|---|\n| Working-team representatives | 2 | Experience of programmes, operations, capacity and everyday working conditions. |\n| Community representatives | 2 | Local knowledge, priorities, participation and access. |\n| Youth representative | 1 | Young people’s perspectives on learning, participation and Kani’s future. |\n| Founding and enabling-entity stewardship | 2 | Institutional continuity, legal and financial responsibilities, and transparent stewardship of the place. |\n| **Total** | **7** | Members share responsibility for Kani as a whole. |\n\nThese are council responsibilities, not seven additional staff posts. Each person occupies one seat.\n\nThe [Advisory Circle](#structure-advisory) is separate from the council. Advisors strengthen decisions but do not acquire governance votes or operational authority through their advisory appointment.\n\n## What the council does\n\nThe council:\n\n- Protects Kani’s purpose and ethos.\n- Agrees annual priorities and overall budget allocations.\n- Reviews programme outcomes, financial information and working conditions.\n- Agrees major partnerships and commitments within the relevant entity arrangements.\n- Establishes clear responsibilities and decision-making boundaries.\n- Oversees a fair process for appointing and reviewing continuing coordination roles.\n\nThe council does not select every artist, approve every purchase or issue competing instructions to staff.\n\n## Selection and terms\n\nWorking-team representatives are chosen by the working team. Community representatives are selected through an accessible process developed with local participants. Young people are involved in choosing the youth representative. Founding and enabling-entity representatives are named through a transparent process that states the authority they carry.\n\nFor the first council, the organising team facilitates a founding meeting involving staff and community participants, records how members were selected and publishes the proposed membership.\n\nMembers serve an initial one-year term, renewable through review. Staggered handovers help maintain continuity. Participation time, honoraria and access support are agreed in advance.\n\nRepresentatives gather views from the people they represent and report back on decisions.\n\n## Convening\n\nOne member serves as **Council Convenor** for a year. The Convenor gathers agenda items, ensures information is circulated and follows up on agreed actions.\n\nMeeting facilitation can rotate. The Convenor has no casting vote or unilateral power to override decisions. Every member can put a matter on the agenda.\n\nThe council meets quarterly, with additional meetings for decisions that cannot wait. Advisors join only the items where their contribution is useful. Members receive a short programme, finance and capacity update between meetings.\n\n## Founders and enabling entities\n\nFounders participate through defined roles. Any authority retained through ownership, funding or an enabling entity is stated openly.\n\nThe responsibilities of SoUF, KiLab and M/s Kani Home—including contracts, payments and authorised signatures—must be documented alongside the council’s mandate. Teams should know which decisions they can make and which need additional authorisation.\n\nSee the [Advisory Circle](#structure-advisory) for specialist contribution, [Decision-making](#structure-decisions) for agreement and quorum, and [Disagreements & Resolution](#structure-resolution) for conflicts and accountability.\n","structure-advisory":"**Current proposal—for discussion.**\n\nThe Advisory Circle brings experience, critical reflection and relationships into Kani without becoming another authority layer. The council governs, the working team runs Kani, programme teams deliver the work, and advisors strengthen all three.\n\n## Six areas of contribution\n\n| Area | Contribution |\n|---|---|\n| **Arts, Culture & Publishing** | Creative practice, curatorial mentoring, publishing and cultural relationships. |\n| **Research & Learning** | Residencies, fellowships, learning methods and research collaborations. |\n| **Systems & Organisational Development** | Governance, team structures, documentation and organisational learning. |\n| **Technology & Digital Practice** | Creative technology, digital infrastructure, archives and technical capability. |\n| **Business & Enterprise** | Revenue models, pricing, commercial experiences, hospitality and sustainability. |\n| **Institutional Partnerships & Fundraising** | Institutional networks, grants, CSR, sponsorship and resource mobilisation. |\n\nThese are six areas of contribution, not necessarily six separate people. One advisor may cover connected areas where the fit is strong. Kani can invite additional specialists for a particular question without expanding the standing circle.\n\n## What advisors do\n\nAdvisors:\n\n- Mentor relevant members of the working and programme teams.\n- Review major proposals and annual priorities when invited.\n- Build practitioner, institutional, funding and industry relationships.\n- Help strengthen systems and organisational capability.\n- Join temporary working groups where their expertise is useful.\n- Contribute an independent view to the annual review.\n\nAdvisors do not manage staff, approve routine spending, direct programme teams or override the council. An introduction or recommendation becomes work only when a named team member accepts responsibility for following it through.\n\n## Appointments and accountability\n\nEach advisor has a one-year appointment stating their area, expected contribution, time commitment, review point and any honorarium. Appointments are reviewed annually and can be renewed.\n\nThe circle meets together twice a year. Individual advisors work with relevant people between meetings. They may join council discussions but do not hold a council vote simply by being advisors. If an advisor also holds a council seat or paid role, the two responsibilities and any conflict of interest are recorded separately.\n\nThe council records its response to significant advice: accepted, being explored or not proceeding, with a brief reason. This gives advice a clear route into the organisation without turning it into an instruction.\n","structure-working-team":"**Current proposal—for discussion.** The following is a proposed structure, not a list of confirmed appointments.\n\nThe working team maintains continuity across Kani’s programmes and keeps the place functioning throughout the year.\n\n## Starting team\n\n| Role | Main responsibility |\n|---|---|\n| **Programme Coordinator** | Develops the year-round programme, connects initiatives, supports curators and facilitators, maintains programme relationships and carries learning between editions. |\n| **Operations Coordinator** | Maintains the shared calendar, resource plan, venue readiness, working processes and coordination with accounts, hospitality and technical support. |\n| **Design & Communications** | Maintains visual communication, programme announcements, audience information, registration communication and documentation coordination. |\n\nThese three roles work alongside the existing Accounts and Hospitality teams and draw on the [Advisory Circle](#structure-advisory) where specialist guidance or relationships are useful.\n\nTwo further responsibilities require explicit capacity:\n\n| Responsibility | Starting arrangement |\n|---|---|\n| **Partnerships & Fundraising** | A named part-time or retained person develops institutional relationships, funding opportunities, proposals and reporting. |\n| **Community & Care** | Allocated paid time within a suitable role, or part-time support, for local relationships, participation, feedback and practical team care. |\n\nCombining responsibilities is possible where skills and time allow. It must not become an assumption that additional work happens without support or compensation.\n\n## How the team works together\n\nThere is no separate Working Coordination Group. Coordination is part of the working team’s normal work.\n\nA fortnightly meeting reviews:\n\n- Upcoming programmes and commitments.\n- Staff capacity and support needs.\n- Space, equipment and scheduling conflicts.\n- Partnership and funding developments.\n- Decisions requiring council involvement.\n\nMeetings become more frequent during busy periods. An agreed person maintains the action list; this does not make them the head of the team.\n\nEach role has a short written mandate stating its responsibilities, decision authority, resources and review arrangements. Each person also has one named support and review contact, so feedback and instructions do not come from several directions.\n\nContinuing coordination-role reviews are overseen by the council with team input. Members do not participate in decisions about their own appointment, pay or performance.\n\n## How the team grows\n\nAdditional appointments follow demonstrated need and funding. They may include technical support, community engagement, commercial bookings or dedicated programme management.\n\nBefore adding a permanent role, consider whether the work is continuing, seasonal or specific to one programme. Festival peaks should carry their own staffing budget.\n\nSee [Programme Teams](#structure-programme-teams) for edition appointments and [Operations & Resources](#structure-operations) for shared support.\n","structure-programme-teams":"**Current proposal—for discussion.**\n\nProgramme teams bring particular initiatives to life. They draw on Kani’s shared resources while holding responsibility for their own creative and delivery work.\n\nEach programme begins with a short agreement covering:\n\n- Purpose, participants and intended contribution.\n- Named creative and delivery responsibilities.\n- Budget, funding and spending authority.\n- Staff time, spaces, equipment and technical support.\n- Timeline, communication, care and access needs.\n- Review, documentation and handover.\n\nFor a small initiative, one person may hold both creative and delivery responsibility. Larger programmes need distinct roles.\n\n## Kanifest\n\nKanifest follows the same model at a larger scale. The Festival Curator owns artistic direction; the Festival Producer owns delivery. Track curators and the edition team work within an agreed brief, budget and resource plan. The detailed team, programming flow and volunteer pathway are held once on the [Kani Fest page](#kani-fest).\n\nThe year-round Programme Coordinator holds continuity between editions. The Operations Coordinator connects the festival to shared spaces, equipment and services.\n\n## Connection to the council\n\nProgramme leads join council discussions concerning their brief, allocation, major changes and review. They can submit proposals and concerns directly and can draw on relevant advisors.\n\nProgramme appointments do not automatically create council seats. Invited leads contribute to the discussion; formal council decisions remain with its appointed members. Within an approved programme, authority remains with the programme team.\n\n## Other initiatives\n\nThe same approach applies to residencies, publications, marketplaces and Heart programmes. Each has a named lead, clear resources and an appropriate level of support.\n\nAt the end of a programme, the team hands over relationships, records, financial information and learning to the relevant continuing team member.\n\nSee the programme pages for their specific creative and delivery arrangements: [Kani Fest](#kani-fest), [Kani Publications](#publications), [Curated Marketplaces](#marketplaces) and [Heart & Wellness](#heart-wellness).\n","structure-operations":"**Current proposal—for discussion.**\n\nKani maintains shared services so programmes can draw on dependable infrastructure and support.\n\n| Function | Who carries the work | Main responsibilities |\n|---|---|---|\n| Programme calendar | Programme and Operations Coordinators | Dates, capacity and connections between activities. |\n| Spaces and equipment | Operations Coordinator, with technical support | Bookings, readiness, maintenance, inventory, operators and changeovers. |\n| Institutional partnerships and funding | Partnerships lead | Relationships, proposals, agreements and reporting, supported by relevant advisors. |\n| Commercial enquiries | Named booking owner | Enquiries, quotations, visits and follow-up, using agreed pricing and availability. |\n| Accounts | Accounts team | Financial records, invoices, payments and accessible budget reports. |\n| Communications | Design & Communications | Confirmed programme information, announcements, registration communication and audience access information. |\n| Hospitality | Hospitality team | Accommodation, arrivals, food and guest support within agreed capacity. |\n| Community relationships and care | Named Community & Care owner, with programme leads | Local participation, feedback, welcome, access and practical support. |\n\nThe booking owner may sit within an existing role initially. It must be clear who follows an enquiry through to confirmation.\n\n## Institutional partnerships\n\nAdvisors and council members can open relationships; the Partnerships lead owns follow-through. Programme leads shape the content, Operations checks capacity, Accounts confirms costs and reporting, and an authorised person makes the commitment. Relationships and agreements are kept in a shared record.\n\n## Budgets and spending\n\nThe council agrees overall allocations, informed by available funding and team capacity. Each programme has an authorised budget holder.\n\nRoutine expenditure proceeds within agreed limits. Additional funding requests or transfers affecting another programme require consultation and the appropriate approval.\n\nAccounts provides a simple view of available, committed and spent funds. Approval and payment checks involve distinct people.\n\n## Shared resources\n\nOne calendar and resource plan covers public programmes, festivals, residencies and commercial bookings. Availability includes setup, staffing, maintenance and recovery time.\n\nCommercial activity accounts for its full demands on the place. Shared support is allocated explicitly, including protected time for public and community programmes.\n\nSee [Working Team](#structure-working-team) for starting capacity and [Decision-making](#structure-decisions) for authority and escalation.\n","structure-decisions":"**Current proposal—for discussion.** Decision rules, financial limits and entity delegations need collective agreement before use.\n\nDecisions should be made as close as possible to the people responsible for the work.\n\n| Decision | Who decides |\n|---|---|\n| Routine work within an agreed role | The responsible person, consulting affected colleagues. |\n| Programme content within an approved brief | The relevant curator or programme lead. |\n| Delivery arrangements within approved resources | The producer or delivery lead. |\n| Changes affecting another team or shared resources | The affected leads agree together, coordinated by the working team. |\n| Annual priorities, overall allocations and major changes of direction | The council. |\n| Contracts, payments and other reserved commitments | The relevant authorised person or entity, following the agreed decision and delegation. |\n\nAdvisors, founders and partners use these routes rather than giving parallel instructions to team members.\n\n## Reaching agreement\n\nFor a collective decision:\n\n1. Explain the proposal, its purpose, resources and consequences.\n2. Hear the people affected and clarify questions.\n3. Revise the proposal where concerns reveal a better approach.\n4. Check agreement explicitly.\n5. Record the decision, responsible person and review date.\n\nConsensus means reaching a proposal everyone involved can support or live with. It does not require everyone to prefer the same solution.\n\nFor practical, reversible changes, the group can agree a time-limited trial. The question is whether there is a significant reason the proposal should not be tried within those limits.\n\nSilence is not agreement. A person may accept a proposal with reservations, which are recorded. Agreeing not to block a proposal does not commit someone to unagreed work.\n\n## Council decisions\n\nThe proposed quorum is five of seven members, including at least one working-team representative, one community representative and one external practitioner.\n\nCouncil decisions require explicit agreement among the eligible members participating. Members receive proposals in advance and can raise concerns even when unable to attend.\n\nIf agreement cannot be reached, revise the proposal, seek facilitation, agree a smaller trial or defer it. The Convenor cannot break a deadlock alone.\n\nMembers with a conflict step aside from the affected decision. If there are too few eligible members to meet quorum, the matter waits for a properly constituted decision.\n\n## Urgent situations\n\nProgramme plans identify who can pause an activity or take immediate action to protect people, the premises or essential services. Any emergency spending authority has a stated limit.\n\nThe person acting records what happened and reports promptly. Urgency does not create a general right to bypass agreed responsibilities.\n\nSee [Disagreements & Resolution](#structure-resolution) when a working disagreement remains unresolved or a sensitive concern needs a separate route.\n","structure-resolution":"**Current proposal—for discussion.** Named contacts and the detailed complaints and review arrangements must be established before this becomes an operating process.\n\nDisagreement is part of working together. Kani aims to address it early, fairly and without making people fear the loss of work, access or belonging.\n\nDifferent concerns need different responses.\n\n| Type of concern | Starting route |\n|---|---|\n| Creative or practical disagreement | The people directly responsible discuss it against the agreed brief and available resources. |\n| Conflict over spaces, time, budgets or responsibilities | The relevant working-team members help clarify commitments and develop an agreement. |\n| Unresolved disagreement affecting Kani’s direction or policy | The council considers it through a facilitated discussion. |\n| Concern about conduct, harassment, discrimination, retaliation or misuse of authority | A confidential route involving an impartial contact; it is not treated as an ordinary programme disagreement. |\n\n## Resolving a working disagreement\n\nFirst, clarify what is disputed: the goal, decision authority, resources, behaviour or an unmet commitment.\n\nThe people involved identify what they need and explore workable options. A colleague can facilitate if everyone is comfortable with that arrangement.\n\nIf the matter remains unresolved, it goes to the appropriate working-team lead or council. A person directly involved in the dispute does not act as its impartial facilitator.\n\nRecord any agreement, who will act and when it will be reviewed.\n\n## Raising a sensitive concern\n\nKani names a confidential contact and an alternative contact outside the immediate working relationship. People can approach the alternative directly when the concern involves their usual contact, a founder, a council member or someone with authority over their work.\n\nNo one is required to confront the person concerned before seeking support. Mediation is voluntary and is not assumed to be suitable for serious misconduct.\n\nBefore information is shared, explain who needs access and why. Sensitive complaints do not go into public meeting minutes.\n\nThe process should provide:\n\n- Prompt acknowledgement and a clear next step.\n- Practical support and protection against retaliation.\n- An impartial assessment, with external assistance where needed.\n- A fair opportunity for the people concerned to be heard.\n- A reasoned outcome and an independent route to request review.\n\nPeople can use appropriate external support or complaint routes without first exhausting Kani’s internal process.\n\n## Conflicts of interest and accountability\n\nAnyone connected to a supplier, applicant, partner or disputed decision declares that interest and steps aside where necessary.\n\nConcerns about a council member’s conduct or repeated failure to fulfil their role follow a documented review involving non-conflicted people. The member has an opportunity to respond. Any replacement follows the selection process for that seat.\n\nEach review should also ask whether unclear responsibilities, unrealistic workloads or poor access to information contributed to the problem, and what Kani needs to change.\n","heart-wellness":"## Heart as our foundation\n\nWhatever we do, we do with heart and grace. Heart is the ground beneath all three pillars: care for ourselves, one another and the places we inhabit. It shapes how we listen, create, learn and work together.\n\nHeart also has a living programme: experiences that help people explore who they are, practise who they wish to become and grow towards their potential. Reflection, creativity, companionship and sustained practice connect inner development with how we live and contribute to the world.\n\n## Two connected expressions\n\n| Expression | What it makes possible |\n|---|---|\n| Everyday culture of care | Welcome, belonging, listening, team check-ins, rest, recognition and practical support across Kani. |\n| Programmes for growth and becoming | Guided journeys, reflective residencies, creative practice, mentorship, mindful gatherings and community learning throughout the year. |\n\nHeart remains a foundation shared by the three pillars. Its programmes connect with research, residencies and learning, and can lead to creative experiences and public exchange.\n\n## Nurupa · an initiative in development\n\nNurupa is a proposed journey of remembering, practising and expressing our potential through play, reflection and creative practice. Its working white paper describes an offering of the **Qalb Center at Kani Home**, as part of **The Slow Thing Festival**. These programme identities and arrangements remain in development.\n\nParticipants imagine an aspirational self—an avatar—and explore its qualities through daily practice, supported by mentors and fellow participants. A craft or passion project gives that exploration a tangible form. The proposed winter-to-spring journey brings together on-site and online participation, with a spring sharing of what participants have practised and made.\n\n| Programme element | Purpose |\n|---|---|\n| Reflection and self-enquiry | Make room to notice habits, aspirations and possibilities through journaling, quiet time and conversation. |\n| Aspirational avatar and play | Explore ways of being through an imagined identity, cooperative games and shared discovery. |\n| Creative practice | Develop a craft or passion project through regular, sustained attention. |\n| Mentorship and companionship | Offer encouragement, listening and reflection within a supportive community. |\n| Rhythm, rest and mindful attention | Create space to slow down and practise with care and at a personally appropriate pace. |\n| Sharing and continuation | Share chosen work and learning, then continue, adapt, mentor or rest. |\n\nNurupa is one expression of Heart. Other programmes can take different forms while sharing the intention of helping people grow with care, agency and connection. The white paper is a working proposal, not a confirmed calendar or a promise of particular outcomes.\n\n## Year-round possibilities\n\n- Reflective residencies and seasonal journeys combining personal enquiry with creative practice.\n- Regular circles for listening, journaling, storytelling and shared reflection.\n- Mindfulness, movement and wellbeing sessions with appropriate facilitators.\n- Mentored craft and passion projects, with optional opportunities to share work.\n- Community gatherings that nurture belonging, mutual support and continued practice.\n\n## How programmes are held\n\nThe Programme Coordinator connects Heart initiatives to the wider programme. Each initiative has a named lead, defined facilitator and mentor responsibilities, allocated time and a budget. The person holding Community & Care connects programme delivery with everyday care across Kani.\n\nParticipation respects different beliefs, backgrounds and personal boundaries. People choose what they share and may opt out of activities. Recording, documentation and public sharing require clear consent; personal reflections are not automatically publication material. Facilitator preparation, participant support, privacy and any practice-specific safeguards must be agreed before launch.\n\nNurupa's calendar, cohort format, mentor appointments, access and pricing, online arrangements and support protocols remain open for collective development. See [Open decisions](#open-decisions). Learning from each programme belongs in [Learnings & Feedback](#learnings-feedback), using participant-approved or anonymised summaries.\n","infrastructure":"Shared infrastructure is what every programme can draw on. It describes capabilities, not additional posts.\n\n| Capability | What is available |\n|---|---|\n| **Spaces** | Level 1 gallery with track lights and four movable walls; Level 2 screening and AV room; Level 3 office and meeting facilities; guest house for up to 15 people. |\n| **Technical infrastructure** | Sound, projection, lighting, connectivity, equipment operation and maintenance. |\n| **Production** | Installation, fabrication coordination, event logistics, procurement and specialist vendors. |\n| **Design & communications** | Graphics, publicity, registrations, audience information, signage and documentation coordination. |\n| **Community participation** | Relationship records, access planning, partner follow-up and feedback. |\n| **Knowledge systems** | Archives, contributor information, consent, permissions and programme learning. |\n| **Hospitality** | Accommodation, food, arrivals and guest support. |\n| **Finance & administration** | Budgets, agreements, invoicing, payments and reporting records. |\n| **Heart & care** | Welcome, belonging, listening, practical support and programmes for growth and becoming. |\n\nThe [Working Team](#structure-working-team) names the continuing owners. [Operations & Resources](#structure-operations) explains how programmes book staff, spaces, equipment and funds.\n\nFor Kanifest, one resource plan covers venues, equipment, operators, setup and changeovers. The Festival Producer coordinates delivery with the Operations Coordinator and a named Technical & Infrastructure Lead. Festival support and specialist crew are included in the edition budget.\n","platforms":"Platforms are named, continuing structures through which related programmes can develop over time. They can hold multiple projects, editions, gatherings, collaborations and outputs while drawing on Kani’s shared team, spaces and infrastructure.\n\n## Current platforms\n\n| Platform | What it holds | Named creative responsibility |\n|---|---|---|\n| [Kanifest](#kani-fest) | An interdisciplinary festival developed through distinct editions, curatorial propositions and community participation. | Festival Curator; Festival Producer holds delivery. |\n| [Kani Publications](#publications) | Editorial projects, research outputs, field notes, books and other forms of documented knowledge. | Editor / Publishing Lead. |\n| [Curated Marketplaces](#marketplaces) | Recurring encounters connecting artisans, makers, demonstrations, workshops and cultural programming. | Marketplace Curator. |\n| **Sunset Baithaks** | Intimate sunset gatherings around music, poetry, performance, conversation and collective listening. | A named curator or host for each series or edition. |\n| **Kani Canteen and Food Lab** | Food experimentation, shared meals, local ingredients, culinary knowledge and feeding the community. | A named food-programme lead, supported by hospitality and invited practitioners. |\n\nEvery platform has an agreed purpose, owner, resource model and review point. Individual programmes within it still require a clear brief, budget and delivery responsibility.\n\nFormats such as exhibitions, workshops, residencies, meals, performances and publications do not automatically become platforms. They are ways in which programmes can take form.\n\nSee [Programme Selection](#programme-selection) for how work is chosen, [Programme Teams](#structure-programme-teams) for delivery relationships and [Developing new initiatives](#new-initiatives) for the pilot pathway.\n","kani-fest":"## Purpose\n\nAn interdisciplinary festival with a fresh curatorial proposition for each edition.\n\n## Festival working map\n\n**Drag to move, use + / − to zoom, and select a box for its explainer.** Roles can be combined where time, skills and funding allow.\n\n```kani-map\n[Festival team]\n- Kanifest | Agreed brief, budget and resource plan\n  - Festival Curator | Artistic direction · edition appointment\n    - Arts & New Media Curator | Proposed paid fellowship\n    - Sound & Music Curator | Proposed paid fellowship\n    - Craft & Material Practices Curator | Proposed paid fellowship\n    - Film & Moving Image Curator | Proposed paid fellowship\n  - Festival Producer | Delivery · fixed-term appointment\n    - Festival Schedule Coordinator | Timetable and changes\n    - Technical & Infrastructure Lead | Equipment, operators and crew\n    - Venue, artist and volunteer coordination | Supported edition delivery\n[Shared resources]\n- Programme continuity | Handover between editions\n- Partnerships & Funding | Relationships and reporting\n- Finance | Budgets and payments\n- Communications & Documentation | Audience information, consent and learning\n- Community & Care | Participation, access and team support\n- Hospitality | Stays, food and guest support\n- Shared Spaces & Equipment | Venues, equipment and availability\n[Collaborations]\n- Festival Curator <> Festival Producer | Collaboration and shared support\n- Shared resources <> Festival Curator | Collaboration and shared support\n- Shared resources <> Festival Producer | Collaboration and shared support\n```\n\nThe Festival Curator owns artistic direction; the Festival Producer owns delivery. Neither automatically becomes a permanent post or council seat. The Programme Coordinator carries continuity between editions, while the Operations Coordinator connects the edition to shared resources.\n\n```kani-details\n| Role / step | Responsibilities and purpose | Working relationship |\n|---|---|---|\n| Kanifest | Sets the edition brief, budget and resource plan through the relevant programme, working-team and council decisions. | Financial and contractual commitments follow the agreed entity authority. |\n| Festival Curator | Shapes the artistic proposition, integrates the tracks and makes selections within the agreed brief and budget. | Works alongside the Festival Producer and mentors the track curators. |\n| Arts & New Media Curator | Develops arts and new-media projects and supplies clear briefs, budgets and technical needs. | Proposed paid curatorial fellowship. |\n| Sound & Music Curator | Develops sound and music programming and coordinates performance requirements. | Proposed paid curatorial fellowship. |\n| Craft & Material Practices Curator | Develops workshops and material enquiry with practitioners and communities. | Proposed paid curatorial fellowship. |\n| Film & Moving Image Curator | Develops screenings and moving-image conversations, including permissions and formats. | Proposed paid curatorial fellowship. |\n| Festival Producer | Owns the delivery plan, production budget tracking, suppliers, crew and on-site coordination. | Fixed-term, edition-funded appointment working alongside the Curator. |\n| Festival Schedule Coordinator | Maintains the confirmed timetable, session briefs, contacts and change log. | Edition delivery role accountable to the Producer. |\n| Technical & Infrastructure Lead | Owns the equipment plan, operators, setup and changeovers. | Works with Operations and funded technical crew. |\n| Venue, artist and volunteer coordination | Covers space readiness, visitor flow, contributor requirements, volunteer induction, rotas and welfare. | Split into named roles according to the edition’s scale and budget. |\n| Programme continuity | Carries relationships, records and learning between editions. | Year-round Programme Coordinator with a documented festival handover. |\n| Partnerships & Funding | Develops appropriate partner and funder relationships and coordinates reporting. | Partnerships lead supported by relevant advisors. |\n| Finance | Tracks the edition budget, invoices, payments and reporting records. | Accounts team; approval follows delegated authority. |\n| Communications & Documentation | Publishes confirmed information and coordinates consent, credits, archives and learning. | Shared Design & Communications with edition support where funded. |\n| Community & Care | Supports local participation, access, welcome and practical team care. | Named continuing owner plus additional edition support where required. |\n| Hospitality | Coordinates accommodation, food, arrivals and guest support. | Existing Hospitality team with one festival contact. |\n| Shared Spaces & Equipment | Confirms venues, operators, setup, movement and changeovers. | Operations Coordinator with the Producer and technical lead. |\n```\n\n## Programming flow\n\n```kani-flow\n- Curators develop proposals | Content, contributors and requirements\n- Creative and resource review | Festival Curator + Festival Producer\n- Confirmed schedule | Festival Schedule Coordinator\n```\n\n```kani-details\n| Role / step | Responsibilities and purpose | Working relationship |\n|---|---|---|\n| Curators develop proposals | Each proposal states its purpose, participants, space, duration, budget, equipment and support needs. | The Festival Curator brings the tracks into one edition. |\n| Creative and resource review | The Curator and Producer test artistic coherence and deliverability before commitments are made. | Unresolved scope or resource questions use the decision route in The Structure. |\n| Confirmed schedule | One timetable records sessions, owners, setup and resource movements. | Changes are checked with affected leads and communicated once. |\n```\n\n## Volunteer pathway\n\n```kani-flow\n- Event volunteer | Defined tasks and supported shifts\n- Returning volunteer / team captain | Bounded responsibility and training\n- Paid associate / fellowship | Funded role with a clear brief\n```\n\n```kani-details\n| Role / step | Responsibilities and purpose | Working relationship |\n|---|---|---|\n| Event volunteer | Joins with induction, an agreed shift, breaks and a named lead. | An entry point; continuing participation is optional. |\n| Returning volunteer / team captain | Takes a bounded peer-support or coordination responsibility with training. | Sustained year-round work is scoped and paid. |\n| Paid associate / fellowship | Holds a defined brief, supervision, learning outcomes, time and compensation. | Prior volunteering is neither required nor a guarantee of selection. |\n```\n\n## Curatorial fellowships and working rhythm\n\nThe four tracks are a working framework. They may be combined, and poetry, theatre, talks and cross-track work must be placed explicitly. Proposed fellowships cover research, local relationships, programme development, delivery, reflection and handover; fees, time, mentoring and production support are agreed before recruitment.\n\nPreparation begins early enough for the fellowship cycle. Each edition budgets for production, outreach, documentation, evaluation and handover. See [Programme Teams](#structure-programme-teams), [Operations & Resources](#structure-operations) and [Open decisions](#open-decisions).\n","publications":"## Purpose\n\nA proposed year-round publishing imprint serving work across all three pillars. “Kani Publications” is a working name.\n\n## Structure\n\n```kani-chart\n- Kani Publications | Agreed editorial plan and budget\n  - Editor / Publishing Lead | Editorial direction and quality\n    - Authors & contributors | Develop work with the editor\n    - Editorial specialists | Review, editing and translation as needed\n```\n\nThe Editor owns editorial quality within the agreed brief and budget. Programme coordination, Design & Communications, outreach, Partnerships, Accounts and distribution support are shared services rather than additional reporting lines.\n\n```kani-details\n| Role | Responsibility | Arrangement |\n|---|---|---|\n| Kani Publications | Sets priorities, resources and appointments through the annual programme and budget. | Programme responsibility within The Structure. |\n| Editor / Publishing Lead | Develops the editorial programme, manuscripts, review, sources, credit and permissions. | Retained or appointed per title or series. |\n| Authors & contributors | Develop original work and agree source, credit and permission arrangements. | Commissioned or agreed per publication. |\n| Editorial specialists | Provide subject review, language editing and translation. | Commissioned according to need. |\n```\n\n## Possible formats\n\n- Research papers, essays, field notes and residency journals.\n- Artists’ books, experimental editions, catalogues and festival readers.\n- Craft documentation, oral histories and community-authored work.\n- Learning resources, zines, audio publications and interactive formats.\n\n## Working arrangements\n\nStart with a small funded programme. Every title has a named editor, readership, format, budget, permissions and distribution plan. Programme leads contribute subject knowledge; shared services are allocated explicitly.\n\nBudget for editing, design, review, translation, production, outreach and distribution. Decide whether each title is free, sold, commissioned or partner-supported before production begins.\n","marketplaces":"## Purpose\n\nA recurring public programme bringing selected artisans and makers together with demonstrations, workshops and cultural activity.\n\nThe working ambition is a 3–4 day edition every two months, subject to demand, staffing and funding. Year 1 frequency remains open.\n\n## Structure\n\n```kani-chart\n- Curated Marketplaces | Agreed series brief and budget\n  - Marketplace Curator | Theme, selection and programme\n  - Delivery coordinator | Schedule, logistics and follow-up\n```\n\nThe curator owns selection. The delivery coordinator organises the edition and shared support; fees and booking administration do not determine curatorial acceptance.\n\n```kani-details\n| Role | Responsibility | Arrangement |\n|---|---|---|\n| Curated Marketplaces | Holds the series scope, calendar, budget and review. | Programme responsibility within The Structure. |\n| Marketplace Curator | Selects participants and shapes themes, demonstrations, workshops and cultural activity. | Series or edition appointment. |\n| Delivery coordinator | Coordinates schedules, requirements, logistics and follow-up. | Allocated working-team time or project-funded support. |\n```\n\n## Working arrangements\n\nConfirm frequency, selection criteria, stall arrangements, staffing, outreach and budget before announcing a series. Operations, communications, partnerships, accounts and hospitality are allocated through the shared resource plan.\n\nAfter each edition, review participant experience, access, attendance, costs and maker feedback. Record what changes and who maintains relationships between editions.\n","new-initiatives":"Use a simple progression:\n\n1. Identify an enquiry, need or opportunity connected to the ethos and pillars.\n\n2. Define a small pilot with a named owner, audience, budget and outcome. Build outreach into its development: listen to intended participants, identify access needs and agree who maintains the relationships afterwards.\n\n3. Deliver and document the pilot.\n\n4. Review value, local relevance, participation, workload and financial viability.\n\n5. Repeat or revise where justified.\n\n6. Establish a continuing platform only when there is a clear reason and capacity to sustain it.\n","learnings-feedback":"## A place to listen and learn\n\n**Status: Feedback collection is ongoing.** This section holds programme experience, questions and suggestions separately from the manifesto. The structure below is provisional and can develop as feedback comes in.\n\n## Kani Fest · Edition 1\n\nThe first edition ran for 15 days, with parallel workshops, talks and musical performances. Around 20 volunteers supported different tasks.\n\nThe notes below come from the organiser’s account shared during development of this document. They are initial observations, not a completed evaluation or a consensus from participants. Further feedback may add to or change them.\n\n| Area | Initial observation | Questions to explore |\n|---|---|---|\n| Programming | Programming and parallel workshops and talks worked well. | What felt valuable to participants and contributors? Where did sessions overlap productively or compete? |\n| Making and craft | Hands-on and craft workshops attracted strong interest. | Which formats, timings and facilitation worked best? What support or materials were missing? |\n| Sound and music | Local musicians drew the largest crowds. | What made these gatherings accessible and engaging? How did artists experience them? |\n| Timing | Around seven mornings were quiet across the 15-day edition. | Was this connected to timing, communication, audience availability or programme format? |\n| Infrastructure | Shared equipment moved between spaces, and infrastructure was understaffed. | Where did clashes or delays occur? What crew, equipment and changeover time would have helped? |\n| Production | There was no Festival Producer, and production capacity was weak. | Which responsibilities lacked an owner or adequate time? What needs dedicated coordination? |\n| Volunteers | Volunteers supported varied tasks; some are interested in greater responsibility across the year. | What felt supported or difficult? Who wants to stay involved, and in what capacity? |\n\n### Perspectives still to gather\n\nInvite feedback from participants, local communities, artists, workshop facilitators, volunteers, curators, production and technical crew, hospitality, partners and the organising team. Ask what worked, what was difficult and what they would change.\n\n## A simple feedback structure\n\nUse one record for each distinct observation or suggestion. Keep the original feedback separate from our interpretation and any decision.\n\n| Field | What to record |\n|---|---|\n| Programme / edition / date | Where and when the experience took place. |\n| Perspective and source | Participant, contributor, volunteer, team or partner; how the feedback was collected. |\n| Observation or feedback | What the person experienced, in their own words where appropriate. |\n| Theme | Programme, access, communication, timing, infrastructure, volunteer experience, hospitality, Heart & Wellness or another relevant theme. |\n| Question or suggestion | What needs understanding, testing or changing. |\n| Status | Collected, exploring, agreed for action or deferred. |\n| Response and follow-up | What was decided, why, who will follow up and when it will be reviewed. |\n\n### Working statuses\n\n| Status | Meaning |\n|---|---|\n| Collected | Recorded; not yet reviewed with the relevant people. |\n| Exploring | More perspectives, detail or a small test are needed. |\n| Agreed for action | A response has been agreed, with an owner and review point. |\n| Deferred | Kept for later, with the reason recorded. |\n\n## Feedback record\n\nThe initial Edition 1 notes above are the starting record. Further participant and team feedback is still being collected; no individual submissions or agreed actions have been entered here yet.\n\nUse **Edit this chapter** to add reviewed notes. This page is a shared record, not a submission form. The collection method and final feedback format remain open for discussion. Keep personal concerns and identifiable sensitive feedback out of the public record; publish agreed or anonymised summaries where appropriate.\n\nAgreed changes to the manifesto should also be recorded in [Version history](#version-history), with the relevant pages updated together. Unresolved structural questions belong in [Open decisions](#open-decisions).\n\n\n## Heart programmes · learning to gather\n\nFor Nurupa and similar initiatives, invite participants to reflect on belonging, choice, mentor support, accessibility, creative practice and what they wish to carry forward. Use voluntary check-ins and end-of-programme reflections; do not rank personal growth or assume transformation. Record only consented or anonymised summaries here. No Nurupa participant feedback has been collected in this document yet.\n","structure-archive":"Earlier council, governance and staffing proposals are preserved here as a record of how the thinking developed. They are **archived references**, not additional bodies or staffing commitments to combine with the current proposal.\n\nFor the latest proposed model, start with [The Structure — Overview](#structure).\n\n## Earlier council and governance proposals\n\n| Page | What it preserves |\n|---|---|\n| [Council · Option 1](#council) | The earlier advisory-area model. |\n| [Council · Option 2](#council-option-2) | A participatory council with serving curators as ex-officio members. |\n| [Council · Option 3](#council-option-3) | The 16-member shared-stewardship council, six advisors and Working Coordination Group. |\n| [Earlier decision rights](#decisions) | Decision responsibilities associated with the earlier models. |\n| [Enabling entities — earlier reference](#entities) | The earlier description of institutional relationships and responsibilities. |\n\n## Earlier staffing proposals\n\n| Page | What it preserves |\n|---|---|\n| [Year 1 · Minimum team](#year-one) | The Director-based starting team and specialist support. |\
